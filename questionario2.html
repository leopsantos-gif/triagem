<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2F5D4F">
<title>MAVI Cardio — Questionário 2</title>
<link rel="manifest" href="manifest-cardio.json">
<link rel="icon" href="icon-192.png">
<style>
  :root {
    --ochre: #B5732A;
    --green: #2F5D4F;
    --green-light: #EAF1EE;
    --cream: #FBF6EE;
    --ink: #2A241C;
    --muted: #6B6156;
    --line: #E3D8C4;
    --amber-soft: #FBEBD0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--cream); color: var(--ink);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-size: 17px; line-height: 1.5;
    padding-bottom: calc(32px + env(safe-area-inset-bottom, 0px));
  }
  header {
    background: var(--green); color: #fff;
    padding: calc(14px + env(safe-area-inset-top, 0px)) 16px 14px;
  }
  .bar-in { max-width: 560px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  header b { font-family: Georgia, 'Times New Roman', serif; font-size: 20px; letter-spacing: 0.06em; }
  header a { color: #fff; font-size: 14px; text-decoration: none; border: 1px solid rgba(255,255,255,.5); border-radius: 20px; padding: 6px 12px; }
  main { max-width: 560px; margin: 0 auto; padding: 18px 16px 0; display: flex; flex-direction: column; gap: 16px; }
  h1, h2 { font-family: Georgia, 'Times New Roman', serif; line-height: 1.2; margin: 0; color: var(--green); }
  h1 { font-size: 27px; }
  h2 { font-size: 24px; }
  p { margin: 0; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 20px 18px; display: flex; flex-direction: column; gap: 16px; }
  .lead { color: var(--muted); }
  label.field { display: flex; flex-direction: column; gap: 6px; font-weight: 600; font-size: 15px; }
  input[type="text"] { font: inherit; padding: 13px; border-radius: 8px; border: 1.5px solid var(--line); background: var(--cream); color: var(--ink); width: 100%; min-width: 0; }
  input:focus-visible, button:focus-visible, a:focus-visible { outline: 3px solid var(--ochre); outline-offset: 2px; }
  .btn { font: inherit; font-weight: 600; border: 0; border-radius: 10px; padding: 15px 18px; min-height: 52px; cursor: pointer; background: var(--green); color: #fff; }
  .btn.ghost { background: #fff; color: var(--green); border: 1.5px solid var(--green); }
  .btn.small { min-height: 44px; padding: 9px 16px; font-size: 15px; }
  .top { display: flex; flex-direction: column; gap: 8px; }
  .top-row { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; color: var(--muted); }
  .track { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; }
  .track span { display: block; height: 100%; background: var(--ochre); border-radius: 99px; transition: width .25s ease; }
  .opts { display: flex; flex-direction: column; gap: 10px; }
  .opt { font: inherit; text-align: left; min-height: 58px; padding: 14px 16px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--cream); color: var(--ink); cursor: pointer; display: flex; gap: 12px; align-items: center; }
  .opt i { flex: none; width: 22px; height: 22px; border: 2px solid var(--muted); border-radius: 50%; }
  .opt[aria-pressed="true"] { border-color: var(--green); background: var(--green-light); }
  .opt[aria-pressed="true"] i { border-color: var(--green); background: radial-gradient(circle, var(--green) 0 45%, transparent 50%); }
  .pill { align-self: flex-start; font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; background: var(--green-light); color: var(--green); padding: 5px 10px; border-radius: 99px; }
  .rows { border-top: 1px solid var(--line); }
  .row { padding: 13px 0; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 3px; }
  .k { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .v { font-weight: 700; }
  .d { color: var(--muted); font-size: 15.5px; }
  .summary { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 14px; white-space: pre-wrap; background: var(--cream); border: 1px solid var(--line); border-radius: 8px; padding: 12px; overflow-wrap: anywhere; user-select: all; }
  .note { background: var(--amber-soft); border-radius: 8px; padding: 11px 13px; font-size: 14.5px; }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; }
  .actions .btn { flex: 1 1 150px; }
  [hidden] { display: none !important; }
  @media (prefers-reduced-motion: reduce) { .track span { transition: none; } }

  input[type="tel"], input[type="date"], textarea.txt { font: inherit; padding: 13px; border-radius: 8px; border: 1.5px solid var(--line); background: var(--cream); color: var(--ink); width: 100%; min-width: 0; }
  .opt.sq i { border-radius: 5px; }
  .opt.sq[aria-pressed="true"] i { background: var(--green); box-shadow: inset 0 0 0 3px #fff; }
  .hint { font-size: 14px; color: var(--muted); }
  .check { display: flex; gap: 10px; align-items: flex-start; font-size: 15px; }
  .check input { width: 22px; height: 22px; flex: none; margin-top: 2px; accent-color: var(--green); }
  .err { color: #A3341F; font-size: 14.5px; font-weight: 600; }
</style>
</head>
<body>
<header>
  <div class="bar-in"><b>MAVI CARDIO</b><a href="index.html" id="backTri" hidden>← Triagem</a></div>
</header>

<main>
  <section id="s-intro" class="card">
    <h1>Exames e cuidados com o coração</h1>
    <p class="lead">São 6 perguntas rápidas. Leva cerca de 1 minuto.</p>
    <label class="field" for="nome">Nome
      <input id="nome" type="text" autocomplete="off" maxlength="120" placeholder="Nome da pessoa">
    </label>
    <div style="display:flex;gap:10px">
      <label class="field" for="nasc" style="flex:1 1 60%">Data de nascimento
        <input id="nasc" type="date" max="">
      </label>
      <label class="field" for="idade" style="flex:1 1 40%">Idade
        <input id="idade" type="tel" inputmode="numeric" maxlength="3" placeholder="Anos">
      </label>
    </div>
    <label class="field" for="cidade">Município
      <input id="cidade" type="text" list="munis" autocomplete="off" maxlength="60" placeholder="Digite o município">
    </label>
    <datalist id="munis"><option value="Custódia-PE"><option value="Triunfo-PE"><option value="Fátima (Flores)-PE"><option value="Tavares-PB"></datalist>
    <label class="field" for="local">Local
      <input id="local" type="text" autocomplete="off" maxlength="80" placeholder="Bairro, sítio, rua ou ponto">
    </label>
    <label class="field" for="whats">WhatsApp
      <input id="whats" type="tel" inputmode="tel" autocomplete="off" maxlength="20" placeholder="(87) 9 0000-0000">
    </label>
    <label class="check" for="okContato"><input type="checkbox" id="okContato"> A pessoa autoriza a MAVI a entrar em contato por WhatsApp.</label>
    <label class="field" for="consultor">Consultor
      <input id="consultor" type="text" autocomplete="off" maxlength="80" placeholder="Seu nome">
    </label>
    <p class="err" id="introErr" hidden></p>
    <button class="btn" id="start" type="button">Começar</button>
  </section>

  <section id="s-q" class="card" hidden>
    <div class="top">
      <div class="top-row"><span id="part"></span><span id="count"></span></div>
      <div class="track"><span id="fill"></span></div>
    </div>
    <h2 id="qtitle"></h2>
    <p class="hint" id="qhint" hidden></p>
    <div class="opts" id="opts"></div>
    <label class="field" id="txtWrap" hidden><span id="txtLabel"></span>
      <input id="txt" type="text" autocomplete="off" maxlength="200">
    </label>
    <div class="actions">
      <button class="btn ghost small" id="back" type="button">Voltar</button>
      <button class="btn small" id="next" type="button" hidden>Continuar</button>
    </div>
  </section>

  <section id="s-r" class="card" hidden>
    <span class="pill">Exames e cuidados com o coração</span>
    <h2>Respostas</h2>
    <div class="rows" id="rows"></div>
    <div>
      <div class="k" style="padding-bottom:8px">Resumo para o cadastro</div>
      <div class="summary" id="summary"></div>
    </div>
    <p class="note" id="saveMsg">Salvando…</p>
    <div class="actions">
      <button class="btn" id="copy" type="button">Copiar resumo</button>
      <button class="btn ghost" id="again" type="button">Novo questionário</button>
    </div>
  </section>
</main>

<script>
// ---------------- Perguntas ----------------
// multi: pode marcar mais de uma; excl: opções que desmarcam as outras;
// text: campo para digitar quando a opção indicada estiver marcada.
var QUESTIONS = [
  { id: 'exame', k: 'Último exame', t: 'Quanto tempo faz que o(a) senhor(a) fez algum exame?', o: [
    'Menos de 6 meses', 'Entre 6 meses e 1 ano', 'Entre 1 e 2 anos', 'Mais de 2 anos', 'Nunca fiz / não lembro'] },
  { id: 'familia', k: 'Família', t: 'Tem alguém na família com pressão alta, problema do coração ou diabetes?', multi: true, excl: [3, 4], o: [
    'Pressão alta ou coração: pai, mãe ou irmãos', 'Pressão alta ou coração: outros parentes', 'Diabetes', 'Não', 'Não sei'] },
  { id: 'plano', k: 'Plano assistencial', t: 'O(a) senhor(a) tem qual plano assistencial ou funerário?', multi: true, excl: [6], o: [
    'BM', 'System', 'Uniplan ou Eterna', 'Cartão de Todos', 'Total Saúde', 'Outro', 'Nenhum'], text: { when: 5, label: 'Qual outro plano?' } },
  { id: 'conhece', k: 'Conhece alguém com problema de saúde', t: 'O(a) senhor(a) conhece alguém que tem algum problema de saúde?', o: [
    'Sim', 'Não'], text: { when: 0, label: 'Quem?' } },
  { id: 'saude', k: 'Problema de saúde', t: 'O(a) senhor(a) tem algum problema de saúde?', multi: true, excl: [6], o: [
    'Pressão alta ou coração', 'Diabetes', 'Ortopédico', 'Psiquiátrico', 'Neurológico', 'Outro', 'Nenhum'], text: { when: 5, label: 'Qual outro problema?' } },
  { id: 'tele', k: 'Telemedicina', t: 'O(a) senhor(a) faria uma consulta por telemedicina?', o: [
    'Sim', 'Talvez', 'Não'] }
];

var ans = {}, txt = {}, cur = 0;
function $(id) { return document.getElementById(id); }
function show(id) { ['s-intro', 's-q', 's-r'].forEach(function (s) { $(s).hidden = (s !== id); }); window.scrollTo(0, 0); }
function sel(q) { var v = ans[q.id]; return q.multi ? (v || []) : (v === undefined ? [] : [v]); }
function needsText(q) { return q.text && sel(q).indexOf(q.text.when) >= 0; }

function render() {
  var q = QUESTIONS[cur];
  $('part').textContent = q.k;
  $('count').textContent = 'Pergunta ' + (cur + 1) + ' de ' + QUESTIONS.length;
  $('fill').style.width = (cur / QUESTIONS.length * 100) + '%';
  $('qtitle').textContent = q.t;
  $('qhint').hidden = !q.multi; $('qhint').textContent = 'Pode marcar mais de uma.';
  $('back').style.visibility = cur === 0 ? 'hidden' : 'visible';
  var chosen = sel(q);
  var box = $('opts'); box.innerHTML = '';
  q.o.forEach(function (op, i) {
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'opt' + (q.multi ? ' sq' : '');
    b.setAttribute('aria-pressed', chosen.indexOf(i) >= 0 ? 'true' : 'false');
    var dot = document.createElement('i'); dot.setAttribute('aria-hidden', 'true');
    var tx = document.createElement('span'); tx.textContent = op;
    b.appendChild(dot); b.appendChild(tx);
    b.addEventListener('click', function () { choose(i); });
    box.appendChild(b);
  });
  var nt = needsText(q);
  $('txtWrap').hidden = !nt;
  if (nt) { $('txtLabel').textContent = q.text.label; $('txt').value = txt[q.id] || ''; }
  $('next').hidden = !(q.multi || nt);
  $('next').disabled = !chosen.length;
}

function choose(i) {
  var q = QUESTIONS[cur];
  if (q.multi) {
    var v = (ans[q.id] || []).slice();
    var at = v.indexOf(i);
    if (at >= 0) v.splice(at, 1);
    else if (q.excl.indexOf(i) >= 0) v = [i];
    else { v = v.filter(function (x) { return q.excl.indexOf(x) < 0; }); v.push(i); }
    ans[q.id] = v.sort(function (a, b) { return a - b; });
    render();
    if (needsText(q)) $('txt').focus();
    return;
  }
  ans[q.id] = i;
  render();
  if (needsText(q)) { $('txt').focus(); return; }
  setTimeout(advance, 220);
}

function advance() {
  var q = QUESTIONS[cur];
  if (needsText(q)) txt[q.id] = $('txt').value.trim().slice(0, 200); else delete txt[q.id];
  if (cur < QUESTIONS.length - 1) { cur++; render(); } else { finish(); }
}

function answerText(q) {
  var s = sel(q).map(function (i) { return q.o[i]; });
  if (needsText(q) && txt[q.id]) s.push(q.text.label.replace('?', '') + ': ' + txt[q.id]);
  return s.join('; ') || 'Não respondido';
}

function finish() {
  var el = $('rows'); el.innerHTML = '';
  var nome = $('nome').value.trim(), cid = $('cidade').value.trim(), loc = $('local').value.trim();
  var wa = $('whats').value.replace(/\D/g, ''), cons = $('consultor').value.trim();
  var idade = $('idade').value.replace(/\D/g, '').slice(0, 3), nasc = $('nasc').value || '';
  var lines = [];
  QUESTIONS.forEach(function (q) {
    var v = answerText(q);
    var d = document.createElement('div'); d.className = 'row';
    var a = document.createElement('div'); a.className = 'k'; a.textContent = q.k;
    var b = document.createElement('div'); b.className = 'v'; b.textContent = v;
    d.appendChild(a); d.appendChild(b); el.appendChild(d);
    lines.push(q.k + ': ' + v);
  });
  $('summary').textContent =
    'MAVI Cardio - Exames e cuidados com o coração - ' + new Date().toLocaleDateString('pt-BR') + '\n' +
    'Nome: ' + (nome || 'não informado') + '\n' +
    'Idade: ' + (idade ? idade + ' anos' : 'não informada') + (nasc ? ' (nascimento: ' + nasc.split('-').reverse().join('/') + ')' : '') + '\n' +
    'Município: ' + (cid || 'não informado') + '\n' +
    'Local: ' + (loc || 'não informado') + '\n' +
    'WhatsApp: ' + ($('whats').value.trim() || 'não informado') + '\n' +
    'Consultor: ' + (cons || 'não informado') + '\n' + lines.join('\n');
  show('s-r');
  var msg = $('saveMsg'); msg.textContent = 'Salvando…';
  if (!(window.indexedDB && window.crypto && crypto.subtle)) { msg.textContent = 'Este aparelho não consegue salvar. Copie o resumo.'; return; }
  var now = new Date().toISOString();
  var q2 = {}; QUESTIONS.forEach(function (q) { q2[q.id] = q.multi ? sel(q) : (ans[q.id] === undefined ? null : ans[q.id]); });
  var payload = { id: newId(), kind: 'q2', q2v: 2, formVersion: 'q2-2026-10-v2', createdAt: now, updatedAt: now,
    nome: nome.slice(0, 120) || null, idade: idade ? Number(idade) : null, nasc: nasc || null, municipio: cid || null, local: loc || null, consultor: cons || null,
    consentContact: $('okContato').checked,
    contact: $('okContato').checked ? { name: nome.slice(0, 120), phone: wa.slice(0, 15) } : null,
    q2: q2, txt: Object.assign({}, txt) };
  saveQ2(payload, nome)
    .then(function () { msg.textContent = 'Salvo. Enviando…'; return flush(); })
    .then(function (n) { msg.textContent = n ? 'Salvo e enviado para a MAVI.' : 'Salvo neste celular. Será enviado quando houver internet.'; },
          function () { msg.textContent = 'Não foi possível salvar. Copie o resumo.'; });
}

// ---------------- Guardar no aparelho (cifrado) ----------------
function openDb() {
  return new Promise(function (res, rej) {
    var req = indexedDB.open('mavi_triagem_db', 3);
    req.onupgradeneeded = function () {
      var db = req.result;
      ['records', 'saved', 'pdfs', 'imported'].forEach(function (n) { if (!db.objectStoreNames.contains(n)) db.createObjectStore(n, { keyPath: 'id' }); });
      if (!db.objectStoreNames.contains('meta')) db.createObjectStore('meta', { keyPath: 'k' });
    };
    req.onsuccess = function () { res(req.result); };
    req.onerror = function () { rej(req.error); };
  });
}
function idb(store, mode, op) {
  return openDb().then(function (db) {
    return new Promise(function (res, rej) {
      var tx = db.transaction(store, mode); var rq = op(tx.objectStore(store));
      tx.oncomplete = function () { db.close(); res(rq ? rq.result : undefined); };
      tx.onerror = tx.onabort = function () { db.close(); rej(tx.error); };
    });
  });
}
async function deviceKey() {
  var m = await idb('meta', 'readonly', function (st) { return st.get('devkey'); });
  if (m && m.v) return m.v;
  var k = await crypto.subtle.generateKey({ name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
  await idb('meta', 'readwrite', function (st) { return st.put({ k: 'devkey', v: k }); });
  return k;
}
var enc = new TextEncoder();
async function rsaSeal(pub, obj, id) {
  var raw = crypto.getRandomValues(new Uint8Array(32));
  var k = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['encrypt']);
  var iv = crypto.getRandomValues(new Uint8Array(12));
  var ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv, additionalData: enc.encode(id) }, k, enc.encode(JSON.stringify(obj))));
  var ek = new Uint8Array(await crypto.subtle.encrypt({ name: 'RSA-OAEP' }, pub, raw)); raw.fill(0);
  return { iv: iv, ek: ek, ct: ct };
}
async function saveQ2(payload, name) {
  var key = await deviceKey();
  var iv = crypto.getRandomValues(new Uint8Array(12));
  var ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv, additionalData: enc.encode(payload.id) }, key,
    enc.encode(JSON.stringify({ payload: payload, name: name || '' }))));
  await idb('saved', 'readwrite', function (st) { return st.put({ id: payload.id, createdAt: payload.createdAt, savedAt: new Date().toISOString(), synced: 0, iv: iv, ct: ct }); });
  var adm = await idb('meta', 'readonly', function (st) { return st.get('admin'); });
  if (adm && adm.v && adm.v.pubSpki) {
    var pub = await crypto.subtle.importKey('spki', adm.v.pubSpki, { name: 'RSA-OAEP', hash: 'SHA-256' }, false, ['encrypt']);
    var e = await rsaSeal(pub, payload, payload.id);
    await idb('records', 'readwrite', function (st) { return st.put(Object.assign({ id: payload.id, v: 1, savedAt: new Date().toISOString() }, e)); });
  }
}
function newId() {
  if (crypto.randomUUID) return crypto.randomUUID();
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) { var r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 3 | 8)).toString(16); });
}

// ---------------- Envio para a MAVI (sem precisar abrir a Triagem) ----------------
// Mesmo caminho da Triagem: cifra com a chave pública da coordenação e grava
// pela função "triagem-envio". Só a área restrita consegue abrir.
var SB_URL = 'https://gzpijutkmamzwgyytyur.supabase.co';
var SB_KEY = 'sb_publishable_eD46xSmXU7XRNb7KkkgShg_K9PgWgpI';
function devId() {
  var d = null; try { d = localStorage.getItem('mavi_sb_device_v1'); } catch (e) {}
  if (!d || !/^[0-9a-f-]{36}$/.test(d)) { d = newId(); try { localStorage.setItem('mavi_sb_device_v1', d); } catch (e) {} }
  return d;
}
async function sbFn(method, body) {
  var r = await fetch(SB_URL + '/functions/v1/triagem-envio', { method: method, headers: { apikey: SB_KEY, 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
  if (!r.ok) throw new Error('fn ' + r.status);
  return r.json();
}
function b64(u8) { var s = ''; for (var i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); }
function unb64(s) { var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
async function pubKey() {
  var spki = null;
  try { var j = await sbFn('GET'); if (j.exists && j.data && j.data.pubSpki) { spki = j.data.pubSpki; try { localStorage.setItem('mavi_cloud_pub_v1', spki); } catch (e) {} } }
  catch (e) { try { spki = localStorage.getItem('mavi_cloud_pub_v1'); } catch (e2) {} }
  if (!spki) return null;
  return crypto.subtle.importKey('spki', unb64(spki), { name: 'RSA-OAEP', hash: 'SHA-256' }, false, ['encrypt']);
}
var flushing = null;
function flush() {
  if (flushing) return flushing;
  flushing = (async function () {
    if (!navigator.onLine) return 0;
    var all = (await idb('saved', 'readonly', function (st) { return st.getAll(); })) || [];
    var pend = all.filter(function (r) { return !r.synced; });
    if (!pend.length) return 0;
    var key = await deviceKey(), pub = await pubKey();
    if (!pub) return 0;
    var uid = devId(), n = 0;
    for (var i = 0; i < pend.length; i++) {
      var r = pend[i];
      try {
        var pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: r.iv, additionalData: enc.encode(r.id) }, key, r.ct);
        var o = JSON.parse(new TextDecoder().decode(pt));
        if (!o.payload || o.payload.kind !== 'q2') continue; // as triagens são enviadas pela própria Triagem
        var e = await rsaSeal(pub, o.payload, r.id);
        await sbFn('POST', { path: 'inbox/' + uid, data: { updatedAt: r.savedAt } });
        await sbFn('POST', { path: 'inbox/' + uid + '/recs/' + r.id, data: { v: 1, savedAt: r.savedAt, iv: b64(e.iv), ek: b64(e.ek), ct: b64(e.ct) } });
        var cur2 = await idb('saved', 'readonly', function (st) { return st.get(r.id); });
        if (cur2 && cur2.savedAt === r.savedAt) { cur2.synced = 1; cur2.syncedAt = new Date().toISOString(); await idb('saved', 'readwrite', function (st) { return st.put(cur2); }); }
        n++;
      } catch (err) { /* tenta de novo depois */ }
    }
    return n;
  })().finally(function () { flushing = null; });
  return flushing;
}

// Data de nascimento preenche a idade automaticamente.
function ageFrom(d) {
  var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(d || ''); if (!m) return '';
  var t = new Date(), a = t.getFullYear() - Number(m[1]);
  if (t.getMonth() + 1 < Number(m[2]) || (t.getMonth() + 1 === Number(m[2]) && t.getDate() < Number(m[3]))) a--;
  return a >= 0 && a <= 120 ? String(a) : '';
}

  function ok() { btn.textContent = 'Copiado'; }
  function fallback() {
    var rng = document.createRange(); rng.selectNodeContents($('summary'));
    var s = window.getSelection(); s.removeAllRanges(); s.addRange(rng);
    btn.textContent = 'Selecionado: copie manualmente';

  try { navigator.clipboard.writeText(t).then(ok, fallback); } catch (e) { fallback(); }
});
