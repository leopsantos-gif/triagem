let deferredPrompt;
const installBtn = document.getElementById('installBtn');
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  installBtn.style.display = 'block';
});
installBtn.addEventListener('click', async () => {
  installBtn.style.display = 'none';
  if (deferredPrompt) {
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt = null;
  }
});
window.addEventListener('appinstalled', () => { installBtn.style.display = 'none'; });

render();

// ---------------- Tela de boas-vindas e cadastro inicial ----------------
(function () {
  const $ = id => document.getElementById(id);
  const scr = $('welcomeScreen');
  function needWelcome() {
    const n = (document.getElementById('respondentName') || {}).value || '';
    const p = (document.getElementById('respondentPhone') || {}).value || '';
    const c = document.getElementById('consentCheck');
    return !(n.trim() && p.trim() && c && c.checked);
  }
  window.welcomeMaybeShow = function (force) {
    if (!force && !needWelcome()) return;
    $('wlName').value = ''; $('wlPhone').value = ''; $('wlConsent').checked = false; $('wlErr').textContent = '';
    scr.classList.add('open'); scr.scrollTop = 0;
  };
  $('wlPhone').addEventListener('input', e => {
    let d = e.target.value.replace(/\D/g, '').slice(0, 11), o = d;
    if (d.length > 2) o = '(' + d.slice(0, 2) + ') ' + d.slice(2, d.length > 10 ? 7 : 6) + (d.length > (d.length > 10 ? 7 : 6) ? '-' + d.slice(d.length > 10 ? 7 : 6) : '');
    e.target.value = o;
  });
  const TXT = {
    terms: '<h3>Termos de Uso</h3><p>Esta triagem é uma ferramenta de orientação sobre risco cardiovascular. Ela <strong>não substitui consulta, exame ou diagnóstico</strong> feitos por um profissional de saúde.</p><p>Responda com sinceridade. Se houver sinal de alerta, procure atendimento médico.</p><p>Os exames sugeridos só passam a valer depois de revisados e liberados por um médico.</p><p><em>Resumo informativo. O texto jurídico completo deve ser validado pela MAVI.</em></p>',
    priv: '<h3>Política de Privacidade</h3><p>Usamos o seu nome, celular e as respostas <strong>apenas para a triagem de saúde</strong> (LGPD).</p><p>As respostas ficam guardadas de forma <strong>cifrada</strong> e só podem ser abertas por pessoas autorizadas da MAVI.</p><p>A MAVI só entra em contato pelo WhatsApp se você autorizar essa opção no questionário.</p><p><em>Resumo informativo. O texto jurídico completo deve ser validado pela MAVI.</em></p>',
  };
  function modal(k, ev) { ev.preventDefault(); $('wmBody').innerHTML = TXT[k]; $('welcomeModal').classList.add('open'); }
  $('wlTerms').addEventListener('click', e => modal('terms', e));
  $('wlPriv').addEventListener('click', e => modal('priv', e));
  $('wmClose').addEventListener('click', () => $('welcomeModal').classList.remove('open'));
  $('wlAdm').addEventListener('click', () => { if (typeof openAdmin === 'function') openAdmin(); });
  $('wlForm').addEventListener('submit', ev => {
    ev.preventDefault();
    const name = $('wlName').value.trim().replace(/\s+/g, ' ');
    const digits = $('wlPhone').value.replace(/\D/g, '');
    const err = $('wlErr');
    if (name.length < 3 || !/\s/.test(name)) { err.textContent = 'Digite o nome completo.'; $('wlName').focus(); return; }
    if (digits.length < 10) { err.textContent = 'Digite o celular com DDD.'; $('wlPhone').focus(); return; }
    if (!$('wlConsent').checked) { err.textContent = 'Marque a caixa para continuar.'; return; }
    err.textContent = '';
    document.getElementById('respondentName').value = name;
    document.getElementById('respondentPhone').value = $('wlPhone').value;
    document.getElementById('consentCheck').checked = true;
    try { saveDraft(); updateProgress(); } catch (e) {}
    scr.classList.remove('open');
    window.scrollTo(0, 0);
  });
})();
welcomeMaybeShow();

// Botão "Mostrar" em todo campo de senha (para o usuário conferir o que digitou)
(function () {
  function addToggle(inp) {
    if (inp.dataset.eye) return; inp.dataset.eye = '1';
    const b = document.createElement('button');
    b.type = 'button'; b.textContent = 'Mostrar senha';
    b.style.cssText = 'display:block;margin:4px 0 10px;background:none;border:0;color:#0a6b4f;text-decoration:underline;font-size:14px;cursor:pointer;padding:0';
    b.addEventListener('click', () => { const sh = inp.type === 'password'; inp.type = sh ? 'text' : 'password'; b.textContent = sh ? 'Ocultar senha' : 'Mostrar senha'; });
    inp.insertAdjacentElement('afterend', b);
  }
  function scan() { document.querySelectorAll('input[type=password]').forEach(addToggle); }
  new MutationObserver(scan).observe(document.documentElement, { childList: true, subtree: true });
  scan();
})();
</script>
