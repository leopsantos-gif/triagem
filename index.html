<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2F5D4F">
<meta name="description" content="Triagem de risco cardiovascular e histórico de saúde MAVI — funciona offline">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MAVI Triagem">
<title>MAVI Triagem Cardiovascular</title>
<style>
  :root {
    --ochre: #B5732A;
    --ochre-dark: #8C551D;
    --green: #2F5D4F;
    --green-light: #EAF1EE;
    --cream: #FBF6EE;
    --ink: #2A241C;
    --line: #E3D8C4;
    --red: #B23A2E;
    --amber: #C68A1F;
    --blue: #1E4F7A;
    --whatsapp: #1F9B57;
    --whatsapp-dark: #167A43;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--cream);
    color: var(--ink);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    line-height: 1.4;
  }
  header {
    background: var(--green);
    color: var(--cream);
    padding: 20px 20px 22px;
    text-align: center;
  }
  header img.logo {
    max-width: 230px;
    width: 70%;
    height: auto;
    margin-bottom: 10px;
    background: #fff;
    border-radius: 10px;
    padding: 8px 14px;
  }
  header .brand {
    font-size: 13px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    opacity: 0.75;
    margin-bottom: 6px;
  }
  header h1 {
    font-family: Georgia, 'Times New Roman', serif;
    font-weight: 600;
    font-size: 23px;
    margin: 0 0 6px;
  }
  header p {
    margin: 0;
    font-size: 13.5px;
    opacity: 0.85;
    max-width: 420px;
    margin: 0 auto;
  }
  #offlineBadge { display:none; margin-top:10px; font-size:12px; background:rgba(255,255,255,0.15); padding:4px 10px; border-radius:20px; display:inline-block; }
  button#installBtn {
    display:none; width:100%; background:var(--ochre); color:#fff; border:none;
    padding:12px; font-size:14px; font-weight:600; cursor:pointer;
  }
  .toolbar {
    max-width: 560px;
    margin: 0 auto;
    padding: 10px 16px 0;
    display: flex;
    justify-content: space-between;
  }
  .consent-row { display: flex; gap: 10px; align-items: flex-start; margin-top: 12px; padding: 10px 12px; background: #fff; border: 1px solid var(--line); border-radius: 8px; font-size: 13px; line-height: 1.45; cursor: pointer; }
  .consent-row input { width: 20px; height: 20px; flex: none; margin-top: 1px; accent-color: var(--green); }
  .send-status { font-size: 13px; line-height: 1.45; margin-top: 10px; padding: 0 4px; text-align: center; }
  .send-status:empty { display: none; }
  .send-status.ok { color: var(--green); font-weight: 600; }
  .send-status.wait { color: #8a6a1c; }
  .send-status.err { color: var(--red); font-weight: 600; }
  .clear-link.armed { color: var(--red) !important; font-weight: 700; }
  .clear-link {
    background: none;
    border: none;
    color: #8a6a4a;
    font-size: 12.5px;
    text-decoration: underline;
    cursor: pointer;
    padding: 6px 2px;
  }
  main {
    max-width: 560px;
    margin: 0 auto;
    padding: 10px 16px 120px;
  }
  .progress-wrap {
    position: sticky;
    top: 0;
    background: var(--cream);
    padding: 12px 0 10px;
    z-index: 5;
    border-bottom: 1px solid var(--line);
  }
  .progress-bar {
    height: 6px;
    border-radius: 4px;
    background: var(--line);
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: var(--ochre);
    width: 0%;
    transition: width 0.25s ease;
  }
  .progress-label {
    font-size: 12px;
    color: var(--ochre-dark);
    margin-top: 6px;
    font-weight: 600;
    letter-spacing: 0.02em;
  }
  .section-title {
    margin: 26px 0 4px;
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--green);
    border-bottom: 2px solid var(--green);
    padding-bottom: 6px;
  }
  .section-sub {
    font-size: 12.5px;
    color: #6b6156;
    margin: 4px 0 10px;
  }
  .question, .name-field {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 16px 16px 14px;
    margin-top: 14px;
  }
  .question.optional {
    border-style: dashed;
  }
  .question .qnum, .name-field .qnum {
    font-size: 11px;
    color: var(--ochre-dark);
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .question .qnum.extra { color: var(--blue); }
  .opt-tag {
    font-weight: 600;
    color: #8a8070;
    text-transform: none;
    letter-spacing: 0;
  }
  .question h3, .name-field h3 {
    font-size: 15.5px;
    margin: 4px 0 12px;
    font-weight: 600;
  }
  .options {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .option {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    transition: border-color 0.15s, background 0.15s;
  }
  .option:hover { border-color: var(--ochre); }
  .option input { accent-color: var(--ochre); width: 16px; height: 16px; flex-shrink: 0; }
  .option.selected {
    border-color: var(--ochre);
    background: #FBF0E2;
  }
  .conditional-field {
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px dashed var(--line);
    display: none;
  }
  .conditional-field.show { display: block; }
  .conditional-field label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 6px;
    color: var(--ink);
  }
  .conditional-field textarea,
  .conditional-field input[type="text"],
  .name-field input[type="text"],
  .name-field input[type="tel"],
  .name-field select {
    width: 100%;
    padding: 11px 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    font-size: 14px;
    font-family: inherit;
    color: var(--ink);
    background: #fff;
  }
  .conditional-field textarea { min-height: 64px; resize: vertical; }
  .conditional-field textarea:focus,
  .conditional-field input[type="text"]:focus,
  .name-field input:focus,
  .name-field select:focus {
    outline: none;
    border-color: var(--ochre);
  }
  .checkbox-grid {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .checkbox-opt {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    font-size: 13.5px;
    cursor: pointer;
  }
  .checkbox-opt input { accent-color: var(--blue); width: 16px; height: 16px; flex-shrink: 0; }
  .checkbox-opt.selected { border-color: var(--blue); background: #EAF1F8; }
  .id-row { margin-top: 12px; }
  .id-row:first-child { margin-top: 0; }
  .id-label {
    display:block; font-size: 12.5px; font-weight: 700; color: #6b6156; margin-bottom: 5px;
  }
  .required-mark { color: var(--red); }
  footer {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: #fff;
    border-top: 1px solid var(--line);
    padding: 12px 16px;
    display: flex;
    justify-content: center;
  }
  button#calcBtn {
    background: var(--green);
    color: #fff;
    border: none;
    padding: 13px 28px;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    width: 100%;
    max-width: 528px;
    transition: opacity 0.15s;
  }
  button#calcBtn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }
  #result {
    display: none;
    max-width: 560px;
    margin: 0 auto;
    padding: 20px 16px 60px;
  }
  .result-card {
    border-radius: 12px;
    padding: 26px 22px;
    text-align: center;
    color: #fff;
  }
  .result-card .name {
    font-size: 14px;
    opacity: 0.9;
    margin-bottom: 12px;
  }
  .result-card .score {
    font-family: Georgia, serif;
    font-size: 46px;
    font-weight: 700;
    line-height: 1;
    margin-bottom: 4px;
  }
  .result-card .maxscore {
    font-size: 13px;
    opacity: 0.85;
    margin-bottom: 14px;
  }
  .result-card .label {
    font-size: 18px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-bottom: 10px;
  }
  .result-card .action {
    font-size: 14.5px;
    line-height: 1.5;
    background: rgba(255,255,255,0.15);
    border-radius: 8px;
    padding: 12px 14px;
    margin-top: 6px;
  }
  .result-card .refcode {
    font-size: 11.5px;
    opacity: 0.8;
    margin-top: 10px;
    letter-spacing: 0.03em;
  }
  .risk-low { background: var(--green); }
  .risk-mod { background: var(--amber); }
  .risk-high { background: #C05A1E; }
  .risk-vhigh { background: var(--red); }
  .risk-alert { background: var(--red); }
  .block-head { margin: 26px 0 10px; }
  .block-head .block-num { font-size: 11.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ochre); }
  .block-head .section-title { margin-top: 2px; }
  .block-head .section-sub { font-size: 13px; color: #555; margin-top: 6px; line-height: 1.45; }
  .block-head.alert .section-title { color: var(--red); border-bottom-color: var(--red); }
  .block-head.alert .section-sub { background: #FBECEA; border-left: 4px solid var(--red); padding: 8px 10px; border-radius: 6px; color: #5a1d17; }
  .q-hint { font-size: 12.5px; color: #666; margin: -4px 0 8px; font-style: italic; }
  .opt-tag { font-weight: 400; color: #888; text-transform: none; letter-spacing: 0; }
  .question.is-hidden { display: none; }
  .bmi-row { display: flex; gap: 10px; flex-wrap: wrap; }
  .bmi-field { flex: 1 1 120px; display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 600; color: #444; }
  .bmi-field input { font-size: 16px; padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 8px; background: #fff; }
  .bmi-field input:disabled { background: #f1f0ed; color: #999; }
  .bmi-ns { margin-top: 10px; }
  .bmi-out { margin-top: 8px; font-size: 13.5px; font-weight: 700; color: var(--green); min-height: 1em; }
  .next-steps { background: #fff; border: 1.5px solid var(--green); border-radius: 12px; padding: 14px 16px; margin: 14px 0; }
  .next-steps.alert { border-color: var(--red); background: #FBECEA; }
  .next-steps .ns-title { font-weight: 800; color: var(--green); font-size: 15px; margin-bottom: 8px; }
  .next-steps.alert .ns-title { color: var(--red); }
  .next-steps ul { margin: 0; padding-left: 18px; }
  .next-steps li { margin-bottom: 8px; font-size: 14px; }
  .next-steps li span { display: block; font-size: 12.5px; color: #555; }
  .next-steps p { margin: 0; font-size: 14px; line-height: 1.5; }
  .ns-arg { margin-top: 8px; font-size: 13px; background: var(--cream); border-radius: 8px; padding: 8px 10px; }
  .exams-box { background: #fff; border: 1.5px solid var(--blue); border-radius: 12px; padding: 14px 16px; margin: 14px 0; }
  .exams-box .ns-title { color: var(--blue); }
  .ex-sub { font-size: 12.5px; color: #555; margin-bottom: 8px; line-height: 1.45; }
  .ex-group { font-size: 12px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; color: var(--blue); margin: 10px 0 4px; }
  .ex-row { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; border-bottom: 1px solid var(--line); cursor: pointer; font-size: 14px; }
  .ex-row input { width: 20px; height: 20px; flex: none; margin-top: 1px; accent-color: var(--blue); }
  .ex-row em { display: block; font-style: normal; font-size: 12.5px; color: #555; margin-top: 2px; line-height: 1.4; }
  .ex-note { font-size: 12.5px; color: #555; margin: 10px 0 0; line-height: 1.45; }
  .ex-refs { margin-top: 12px; font-size: 11.5px; color: #555; line-height: 1.45; }
  .ex-refs ol { margin: 4px 0 0; padding-left: 18px; }
  .ex-refs li { margin-bottom: 5px; word-break: break-word; }
  .disclaimer {
    font-size: 12px;
    color: #6b6156;
    margin-top: 18px;
    text-align: center;
    line-height: 1.5;
    padding: 0 8px;
  }
  .result-actions {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-top: 20px;
  }
  button.pdf-btn {
    background: var(--blue);
    color: #fff;
    border: none;
    padding: 14px 20px;
    border-radius: 8px;
    font-size: 15.5px;
    font-weight: 700;
    cursor: pointer;
  }
  button.pdf-btn.crm {
    background: var(--ochre);
  }
  .pdf-tip {
    font-size: 12px;
    color: #6b6156;
    line-height: 1.45;
    text-align: center;
    padding: 2px 6px;
  }
  .pdf-status {
    font-size: 13px;
    text-align: center;
    padding: 8px 10px;
    color: #6b6156;
  }
  .pdf-status.err {
    color: var(--red);
    font-weight: 600;
    background: #FCEBEA;
    border-radius: 8px;
  }
  .pdf-link-box {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 12px;
    background: #EAF1F8;
    border: 1px solid #BFD6EA;
    border-radius: 10px;
  }
  a.pdf-link {
    display: block;
    text-align: center;
    background: var(--blue);
    color: #fff !important;
    text-decoration: none;
    padding: 12px 14px;
    border-radius: 8px;
    font-size: 14.5px;
    font-weight: 700;
  }
  button.pdf-link { border: none; cursor: pointer; font-family: inherit; width: 100%; }
  button.pdf-link.share-pdf { background: var(--whatsapp); }
  a.pdf-link.secondary {
    background: #fff;
    color: var(--blue) !important;
    border: 1.5px solid var(--blue);
  }
  .pdf-status-hint {
    font-size: 12px;
    color: #4a5a6a;
    text-align: center;
  }
  .restart {
    display: block;
    text-align: center;
    background: none;
    border: 1px solid var(--line);
    color: var(--ink);
    padding: 10px 20px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
  }
  .review-btn {
    display: block;
    text-align: center;
    background: none;
    border: 1px dashed var(--line);
    color: #6b6156;
    padding: 9px 20px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13.5px;
  }
  .share-section {
    margin-top: 6px;
    padding: 14px 14px 16px;
    background: #EAF6EF;
    border: 1px solid #BEDFC9;
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .share-title {
    font-size: 15px;
    font-weight: 800;
    color: var(--whatsapp-dark);
  }
  .share-sub {
    font-size: 12px;
    color: #4a5a4f;
    line-height: 1.5;
  }
  .share-label {
    font-size: 12.5px;
    font-weight: 700;
    color: var(--ink);
    margin-top: 2px;
  }
  #waPhoneInput {
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    font-size: 14.5px;
    font-family: inherit;
  }
  .share-hint {
    font-size: 11.5px;
    color: var(--red);
    min-height: 14px;
  }
  button.share-btn {
    background: var(--whatsapp);
    color: #fff;
    border: none;
    padding: 12px 16px;
    border-radius: 8px;
    font-size: 14.5px;
    font-weight: 700;
    cursor: pointer;
  }
  button.share-btn.secondary {
    background: #fff;
    color: var(--whatsapp-dark);
    border: 1.5px solid var(--whatsapp);
  }
  .share-box {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 12px;
    background: #fff;
    border: 1px solid #BEDFC9;
    border-radius: 10px;
  }
  .share-box textarea {
    width: 100%;
    min-height: 110px;
    padding: 10px;
    border: 1px solid var(--line);
    border-radius: 8px;
    font-family: inherit;
    font-size: 13.5px;
    resize: vertical;
  }
  .share-steps {
    font-size: 12px;
    color: #4a5a4f;
    line-height: 1.5;
    background: #F4FAF6;
    border-radius: 8px;
    padding: 8px 10px;
  }
  a.share-wa-link {
    display: block;
    text-align: center;
    background: var(--whatsapp);
    color: #fff !important;
    text-decoration: none;
    padding: 12px 14px;
    border-radius: 8px;
    font-size: 14.5px;
    font-weight: 700;
  }

  /* ================= Triagens salvas no celular ================= */
  #savedArea { position: fixed; inset: 0; z-index: 70; overflow-y: auto; background: var(--cream); color: var(--ink); display: none; }
  #savedArea.open { display: block; }
  .sv-top { position: sticky; top: 0; z-index: 3; display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--green); color: #fff; padding: 12px 16px; }
  .sv-top h2 { font-size: 15px; margin: 0; font-weight: 700; }
  .sv-top button { background: rgba(255,255,255,0.14); color: #fff; border: 1px solid rgba(255,255,255,0.45); border-radius: 8px; padding: 7px 11px; font-size: 13px; cursor: pointer; font-family: inherit; }
  .sv-wrap { max-width: 560px; margin: 0 auto; padding: 12px 16px 56px; }
  .sv-sum { font-size: 14px; padding: 6px 2px; }
  .sv-sync { width: 100%; margin-top: 8px; background: var(--green); color: #fff; border: none; border-radius: 8px; padding: 12px; font-size: 14.5px; font-weight: 600; cursor: pointer; font-family: inherit; }
  .sv-sync:disabled { opacity: 0.6; }
  .sv-note { font-size: 13px; color: #6b6156; margin-top: 10px; line-height: 1.45; }
  .sv-item { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-top: 10px; }
  .sv-main { display: flex; flex-direction: column; gap: 2px; min-width: 0; font-size: 13px; color: #6b6156; }
  .sv-main strong { font-size: 14.5px; color: var(--ink); overflow-wrap: anywhere; }
  .sv-chip { flex: none; font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 20px; }
  .sv-pdfs { display: flex; flex-wrap: wrap; gap: 6px; flex-basis: 100%; }
  .sv-pdfs button { background: var(--blue); color: #fff; border: none; border-radius: 8px; padding: 8px 12px; font-size: 13px; cursor: pointer; font-family: inherit; }
  .sv-item { flex-wrap: wrap; }
  .sv-chip.ok { background: var(--green-light); color: var(--green); }
  .sv-chip.wait { background: #FBF0E2; color: var(--ochre-dark); }

  /* ================= Área restrita — painel de gráficos ================= */
  #adminArea {
    --viz-surface: #ffffff;
    --viz-page: #f6f5f1;
    --viz-text-1: #0b0b0b;
    --viz-text-2: #52514e;
    --viz-text-3: #7d7b75;
    --viz-grid: #e7e5df;
    --viz-track: #f0efec;
    --viz-1: #2a78d6;
    --st-good: #0ca30c; --st-warn: #fab219; --st-serious: #ec835a; --st-critical: #d03b3b;
    position: fixed; inset: 0; z-index: 60; overflow-y: auto;
    background: var(--viz-page); color: var(--viz-text-1);
    display: none;
  }
  #adminArea.open { display: block; }
  body.admin-open { overflow: hidden; }
  .adm-top {
    position: sticky; top: 0; z-index: 3;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    background: var(--green); color: #fff; padding: 12px 16px;
  }
  .adm-top h2 { font-size: 15.5px; margin: 0; font-weight: 700; }
  .adm-top button {
    background: rgba(255,255,255,0.14); color: #fff; border: 1px solid rgba(255,255,255,0.45);
    border-radius: 8px; padding: 7px 11px; font-size: 13px; cursor: pointer; white-space: nowrap; font-family: inherit;
  }
  .adm-wrap { max-width: 760px; margin: 0 auto; padding: 4px 16px 56px; }
  .adm-card { background: var(--viz-surface); border: 1px solid var(--viz-grid); border-radius: 12px; padding: 14px; margin-top: 12px; }
  .adm-card h3 { font-size: 15px; margin: 0 0 3px; color: var(--viz-text-1); font-weight: 700; }
  .adm-sub { font-size: 12px; color: var(--viz-text-2); margin: 0 0 10px; line-height: 1.45; }
  .adm-note { font-size: 12px; color: var(--viz-text-2); background: #f1efe9; border-radius: 8px; padding: 10px 12px; line-height: 1.55; margin-top: 12px; }
  .adm-form label { display: block; font-size: 13px; font-weight: 700; margin: 12px 0 5px; }
  .adm-form input {
    width: 100%; box-sizing: border-box; padding: 11px 12px; border: 1px solid var(--line);
    border-radius: 8px; font-size: 15px; font-family: inherit; background: #fff;
  }
  .adm-btn {
    display: block; width: 100%; margin-top: 14px; background: var(--green); color: #fff; border: none;
    border-radius: 8px; padding: 13px; font-size: 15px; font-weight: 700; cursor: pointer; font-family: inherit;
  }
  .adm-btn:disabled { opacity: 0.6; cursor: wait; }
  .adm-btn.danger { background: #fff; color: #b23a2e; border: 1px solid #e3b6b0; font-weight: 600; }
  .adm-err { color: #b23a2e; font-size: 13px; margin-top: 8px; min-height: 16px; }
  .adm-filters { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .adm-filters label { flex: 1 1 150px; font-size: 11.5px; color: var(--viz-text-2); display: flex; flex-direction: column; gap: 4px; }
  .adm-filters select {
    padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px; font-size: 13.5px;
    background: #fff; font-family: inherit; color: var(--viz-text-1);
  }

  .ct-item { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 0; border-top: 1px solid var(--viz-grid); }
  .ct-main { display: flex; flex-direction: column; gap: 3px; min-width: 0; font-size: 12.5px; color: var(--viz-text-2); }
  .ct-main strong { font-size: 14px; color: var(--viz-text-1); overflow-wrap: anywhere; }
  .ct-phone { font-variant-numeric: tabular-nums; }
  .ct-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 2px; }
  .ct-tag { background: var(--viz-track); color: var(--viz-text-2); border-radius: 12px; padding: 2px 8px; font-size: 11.5px; }
  .ct-risk { border-radius: 12px; padding: 2px 8px; font-size: 11.5px; font-weight: 700; color: #fff; }
  .ct-risk.low { background: #2f7d4f; } .ct-risk.mod { background: #a8731b; } .ct-risk.high { background: #c05a1e; } .ct-risk.alert { background: #b23a2e; }
  .ct-wa { flex: none; background: #1F9B57; color: #fff !important; text-decoration: none; border: none; border-radius: 8px; padding: 9px 12px; font-size: 13px; font-weight: 700; cursor: pointer; font-family: inherit; }
  .kpi-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 12px; }
  @media (min-width: 640px) { .kpi-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
  .kpi { background: var(--viz-surface); border: 1px solid var(--viz-grid); border-radius: 12px; padding: 12px; }
  .kpi .k-label { font-size: 12px; color: var(--viz-text-2); line-height: 1.3; }
  .kpi .k-value { font-size: 26px; font-weight: 600; margin-top: 4px; color: var(--viz-text-1); }
  .kpi .k-foot { font-size: 11.5px; color: var(--viz-text-3); margin-top: 2px; }
  .hb-row { margin: 9px 0; }
  .hb-label { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; font-size: 12.5px; color: var(--viz-text-1); margin-bottom: 4px; }
  .hb-label .hb-key { display: inline-flex; align-items: center; gap: 6px; }
  .hb-label .hb-dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .hb-label .hb-val { color: var(--viz-text-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .hb-track { height: 14px; background: var(--viz-track); border-radius: 0 4px 4px 0; }
  .hb-fill { height: 100%; border-radius: 0 4px 4px 0; }
  .adm-table { width: 100%; border-collapse: collapse; font-size: 12.5px; margin-top: 8px; }
  .adm-table th, .adm-table td { text-align: left; padding: 6px; border-bottom: 1px solid #eeece6; }
  .adm-table th { color: var(--viz-text-2); font-weight: 600; }
  .adm-table .num { text-align: right; font-variant-numeric: tabular-nums; }
  details.adm-tbl { margin-top: 8px; }
  details.adm-tbl summary { font-size: 12px; color: var(--viz-text-2); cursor: pointer; padding: 4px 0; }
  .adm-empty { font-size: 13px; color: var(--viz-text-3); padding: 18px 0; text-align: center; }
  .area-wrap { position: relative; touch-action: pan-y; }
  .area-wrap svg { display: block; width: 100%; height: auto; overflow: visible; }
  .area-tip {
    position: absolute; top: 0; pointer-events: none; display: none; z-index: 2;
    background: #1f1f1d; color: #fff; font-size: 12px; line-height: 1.35; padding: 6px 9px; border-radius: 6px; white-space: nowrap;
  }
  .hm { display: grid; gap: 2px; margin-top: 4px; }
  .hm-h { color: var(--viz-text-2); font-size: 11.5px; text-align: center; padding: 2px 0 4px; }
  .hm-r { color: var(--viz-text-2); font-size: 11.5px; padding-right: 6px; display: flex; align-items: center; white-space: nowrap; }
  .hm-cell { border-radius: 4px; text-align: center; padding: 9px 2px; font-size: 12.5px; font-variant-numeric: tabular-nums; font-weight: 600; }
  .hm-legend { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--viz-text-2); margin-top: 8px; }
  .hm-legend i { display: inline-block; width: 18px; height: 10px; border-radius: 2px; }
  .danger-zone { display: none; }
  .danger-zone.show { display: block; }

</style>
<body>
<style>
  /* Versão online (página do Claude): sem instalação; o PDF é salvo pela própria plataforma */
  #installBtn, .pdf-tip { display: none !important; }
  .online-note {
    font-size: 12.5px; line-height: 1.5; color: #6b6156; background: #fff;
    border: 1px dashed var(--line); border-radius: 8px; padding: 10px 12px;
  }
  footer { padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px)); }
  .progress-wrap { top: env(safe-area-inset-top, 0px); }
  .adm-top { top: 0; padding-top: calc(12px + env(safe-area-inset-top, 0px)); }
</style>

    { id: 'I1', type: 'multi', q: 'Gostaria de fazer algum destes serviços?', hint: 'Pode marcar mais de um.', opts: ['Exames de sangue', 'Eletrocardiograma', 'Consulta pelo celular', 'Consulta presencial', 'Nenhum agora'] },
    { id: 'I2', q: 'Prefere fazer os exames em casa ou no laboratório?', opts: ['Em casa', 'No laboratório', 'Tanto faz'] },
    { id: 'I3', q: 'Se a MAVI tivesse uma mensalidade com desconto em exames todo ano e consulta pelo celular, para o(a) senhor(a) e a família, teria interesse?', opts: ['Sim', 'Talvez', 'Não'] },
  ]},
];
const ITEMS = FORM.flatMap(b => b.items.map(it => Object.assign({ block: b.id }, it)));
const ITEM = Object.fromEntries(ITEMS.map(it => [it.id, it]));
const ALERT_IDS = ['A1', 'A2', 'A3', 'A4'];
const CLINICAL_BLOCKS = ['alert', 'perfil', 'doencas', 'habitos', 'familia'];
const SALES_BLOCKS = ['acesso', 'interesse'];
const MAX_SCORE = ITEMS.reduce((a, it) => a + (it.type === 'bmi' ? 2 : it.pts ? Math.max(...it.pts) : 0), 0);
const MUNICIPIOS = ["Custódia-PE", "Triunfo-PE", "Fátima (Flores)-PE", "Tavares-PB", "Outro"];

// ---------------- Estado ----------------
const ANS = {}; // ANS[id] = índice; multi = [índices]; P3 = {peso, altura, ns}
let resultComputed = null;

const formArea = document.getElementById('formArea');
const calcBtn = document.getElementById('calcBtn');
const progressFill = document.getElementById('progressFill');
const progressLabel = document.getElementById('progressLabel');

function idVal(id) { const el = document.getElementById(id); return el ? el.value.trim() : ""; }
function isChecked(id) { const el = document.getElementById(id); return !!(el && el.checked); }

function isVisible(it) {
  if (!it.showIf) return true;
  return Object.entries(it.showIf).every(([k, v]) => ANS[k] === v);
}
function isAnswered(it) {
  const a = ANS[it.id];
  if (it.type === 'multi') return Array.isArray(a) && a.length > 0;
  if (it.type === 'bmi') return !!a && (a.ns || (bmiOf(a) !== null));
  return a !== undefined && a !== null;
}
function parseNum(v) { const n = parseFloat(String(v || '').replace(',', '.')); return isFinite(n) ? n : null; }
function bmiOf(a) {
  if (!a || a.ns) return null;
  const peso = parseNum(a.peso); let alt = parseNum(a.altura);
  if (!peso || !alt) return null;
  if (alt < 3) alt = alt * 100; // aceita 1,65
  if (peso < 20 || peso > 300 || alt < 100 || alt > 230) return null;
  const m = alt / 100;
  return peso / (m * m);
}
function bmiPts(b) { return b === null ? 0 : b >= 30 ? 2 : b >= 25 ? 1 : 0; }
function fmtDec(n) { return n.toFixed(1).replace('.', ','); }
function bmiText(a) {
  if (!a) return 'Não respondido';
  if (a.ns) return 'Não sabe peso ou altura';
  const b = bmiOf(a);
  if (b === null) return 'Valores incompletos';
  const cat = b >= 30 ? 'obesidade' : b >= 25 ? 'sobrepeso' : b < 18.5 ? 'abaixo do peso' : 'peso adequado';
  return `Peso ${a.peso} kg · altura ${a.altura} cm · IMC ${fmtDec(b)} (${cat})`;
}
function optText(it) {
  const a = ANS[it.id];
  if (it.type === 'bmi') return bmiText(a);
  if (it.type === 'multi') return Array.isArray(a) && a.length ? a.map(i => it.opts[i]).join(', ') : 'Não respondido';
  return (a === undefined || a === null) ? 'Não respondido' : it.opts[a];
}

function itemPoints(it) {
  if (it.type === 'bmi') return bmiPts(bmiOf(ANS[it.id]));
  if (!it.pts || !isVisible(it)) return 0;
  const a = ANS[it.id];
  return (a === undefined || a === null) ? 0 : (it.pts[a] || 0);
}
function computeScore() { return ITEMS.reduce((s, it) => s + itemPoints(it), 0); }
function hasAlert() { return ALERT_IDS.some(id => ANS[id] === 0); }

function classifyV2(total) {
  if (hasAlert()) return { riskClass: 'risk-alert', label: 'Procurar avaliação médica',
    action: 'Há sinal de alerta. Oriente a pessoa a procurar avaliação médica o quanto antes. Se houver dor no peito agora, ligue 192 (SAMU).' };
  if (ANS.D1 === 0) return { riskClass: 'risk-high', label: 'Risco alto',
    action: 'Já tem doença do coração: precisa de acompanhamento médico regular e exames de controle.' };
  if (total <= 5) return { riskClass: 'risk-low', label: 'Risco baixo',
    action: 'Poucos pontos de atenção. Vale manter o check-up periódico.' };
  if (total <= 10) return { riskClass: 'risk-mod', label: 'Risco moderado',
    action: 'Alguns pontos merecem atenção. Recomendamos avaliação com exames.' };
  return { riskClass: 'risk-high', label: 'Risco alto',
    action: 'Vários pontos de atenção. Recomendamos avaliação médica com exames em breve.' };
}

const C4_ARG = ['Pacote com preço fechado e parcelado', 'Coleta em casa', 'Horário marcado e resultado no WhatsApp',
  'Agendamento rápido e consulta pelo celular', 'Orientação com médico pelo celular', null];

// Regras dos próximos passos (documento de revisão médica). Com sinal de alerta: nenhuma oferta.
function nextSteps() {
  if (hasAlert()) return { steps: [], argument: null, promo: false };
  const s = [];
  const add = (title, why) => { if (!s.some(x => x.title === title)) s.push({ title, why }); };
  if (ANS.D1 === 0) add('Acompanhamento do coração', 'Já teve doença do coração.');
  if (ANS.D6 === 0 && (ANS.D7 === 2 || ANS.D7 === 3)) add('Exames de controle e consulta', 'Toma remédio todo dia e não faz exames de controle há mais de 1 ano.');
  if ((ANS.D2 === 1 || ANS.D2 === 2) && [1, 2, 3].includes(ANS.C2)) add('Eletrocardiograma com laudo', 'Tem pressão alta e não fez eletrocardiograma no último ano.');
  if (ANS.D3 === 3 || ANS.D4 === 3) add('Glicemia e perfil de colesterol', 'Nunca mediu ou não sabe o açúcar ou o colesterol.');
  if (ANS.C5 === 2 || ANS.C5 === 3) add('Exames de sangue básicos', 'Não faz exames de sangue há mais de 2 anos.');
  if (ANS.P2 >= 1 && [1, 2, 3].includes(ANS.C1)) add('Check-up básico', 'Tem 40 anos ou mais e não passa por consulta há mais de 1 ano.');
  if (ANS.F1 === 0) add('Check-up do coração', 'Pai, mãe ou irmão teve infarto ou derrame.');
  if (ANS.F2 >= 1) add('Pacote para a família', 'Outras pessoas da casa tomam remédio ou precisam de exames.');
  if (ANS.I2 === 0) add('Coleta em casa', 'Prefere fazer os exames em casa.');
  if (ANS.I3 === 0 || ANS.I3 === 1) add('Mensalidade MAVI com dependentes', 'Mostrou interesse em exames todo ano com mensalidade.');
  const argument = (ANS.C4 !== undefined && ANS.C4 !== null) ? C4_ARG[ANS.C4] : null;
  return { steps: s, argument, promo: ANS.C6 === 2 };
}

// EXAMES DE LABORATÓRIO E ELETROCARDIOGRAMA SUGERIDOS (conforme as respostas)
// Não é sinal de alerta e não altera pontuação nem classificação.
// É sugestão para avaliação médica; não é pedido de exames.

const EX_REFS = {
  HAS20: 'Barroso WKS, et al. Diretrizes Brasileiras de Hipertensão Arterial - 2020 (Quadro 4.4, exames de rotina; albuminúria em hipertensos de maior risco). Arq Bras Cardiol. 2021;116(3):516-658. doi:10.36660/abc.20201238 (PMID 33909761)',
  HAS24: 'McEvoy JW, et al. 2024 ESC Guidelines for the management of elevated blood pressure and hypertension. Eur Heart J. 2024;45(38):3912-4018. doi:10.1093/eurheartj/ehae178 (PMID 39210715)',
  DIS25: 'Rached FH, et al. Diretriz Brasileira de Dislipidemias e Prevenção da Aterosclerose - 2025. Arq Bras Cardiol. 2025;122(9):e20250640. doi:10.36660/abc.20250640 (PMID 41379178)',
  PREV21: 'Visseren FLJ, et al. 2021 ESC Guidelines on cardiovascular disease prevention in clinical practice (seção 3.1, avaliação de risco). Eur Heart J. 2021;42(34):3227-3337. doi:10.1093/eurheartj/ehab484 (PMID 34458905)',
  ADA2: 'American Diabetes Association. 2. Diagnosis and Classification of Diabetes: Standards of Care in Diabetes-2025 (recomendações 2.10 a 2.12, rastreamento a partir dos 35 anos). Diabetes Care. 2025;48(Suppl 1):S27-S49. doi:10.2337/dc25-S002 (PMID 39651986)',
  ADA10: 'American Diabetes Association. 10. Cardiovascular Disease and Risk Management: Standards of Care in Diabetes-2025. Diabetes Care. 2025;48(Suppl 1):S207-S238. doi:10.2337/dc25-S010 (PMID 39651970)',
  KDIGO: 'KDIGO 2024 Clinical Practice Guideline for the Evaluation and Management of Chronic Kidney Disease. Kidney Int. 2024;105(4S):S117-S314. doi:10.1016/j.kint.2023.10.018 (PMID 38490803)',
  CCS24: 'Vrints C, et al. 2024 ESC Guidelines for the management of chronic coronary syndromes (avaliação inicial: ECG, perfil lipídico, função renal, hemoglobina). Eur Heart J. 2024;45(36):3415-3537. doi:10.1093/eurheartj/ehae177 (PMID 39210710)',
  AF24: 'Van Gelder IC, et al. 2024 ESC Guidelines for the management of atrial fibrillation (ECG de 12 derivações; exames de base). Eur Heart J. 2024;45(36):3314-3414. doi:10.1093/eurheartj/ehae176 (PMID 39210723)',
  HF21: 'McDonagh TA, et al. 2021 ESC Guidelines for the diagnosis and treatment of acute and chronic heart failure (seção 4, diagnóstico: ECG, peptídeos natriuréticos, exames básicos). Eur Heart J. 2021;42(36):3599-3726. doi:10.1093/eurheartj/ehab368 (PMID 34447992)',
  SYNC18: 'Brignole M, et al. 2018 ESC Guidelines for the diagnosis and management of syncope (seção 4.1.1, avaliação inicial com ECG). Eur Heart J. 2018;39(21):1883-1948. doi:10.1093/eurheartj/ehy037 (PMID 29562304)',
  USPSTF18: 'US Preventive Services Task Force. Screening for Cardiovascular Disease Risk With Electrocardiography: Recommendation Statement. JAMA. 2018;319(22):2308-2314. doi:10.1001/jama.2018.6848 (PMID 29896632)',
};
let EXAM_OFF = {}; // EXAM_OFF[id] = true quando o profissional desmarca o exame

const EXAM_OPT_IDS = ['bnp', 'hemo', 'tsh']; // opcionais: vêm desmarcados
function examOffDefault() { return Object.fromEntries(EXAM_OPT_IDS.map(i => [i, true])); }

function examSuggestions(rec) {
  const A = rec ? rec.ans : ANS;
  const bmi = rec ? (rec.bmiCat === 2 ? 30 : rec.bmiCat === 1 ? 27 : null) : bmiOf(ANS.P3);
  const f = {
    age40: A.P2 >= 1,
    hasHAS: A.D2 === 1 || A.D2 === 2,
    dm: A.D3 === 2,
    glucHigh: A.D3 === 1,
    glucUnk: A.D3 === 3,
    colHigh: A.D4 === 1 || A.D4 === 2,
    renal: A.D5 === 0,
    cvd: A.D1 === 0,
    over: bmi !== null && bmi >= 25,
    obese: bmi !== null && bmi >= 30,
    smoke: A.H1 === 2,
    sed: A.H2 === 2,
    fam: A.F1 === 0,
    chest: A.A1 === 0, dysp: A.A2 === 0, sync: A.A3 === 0, palp: A.A4 === 0,
    ctrlLate: A.D6 === 0 && (A.D7 === 2 || A.D7 === 3),
  };
  const list = [];
  const add = (id, type, name, why, refs, opt) => {
    let e = list.find(x => x.id === id);
    if (!e) { e = { id, type, name, why: [], refs: [], opt: !!opt }; list.push(e); }
    why.forEach(w => { if (!e.why.includes(w)) e.why.push(w); });
    refs.forEach(r => { if (!e.refs.includes(r)) e.refs.push(r); });
  };

  // ---- Eletrocardiograma ----
  if (f.hasHAS) add('ecg', 'ecg', 'Eletrocardiograma de repouso', ['pressão alta: exame de rotina da avaliação inicial'], ['HAS20', 'HAS24']);
  if (f.chest) add('ecg', 'ecg', 'Eletrocardiograma de repouso', ['dor ou aperto no peito aos esforços'], ['CCS24']);
  if (f.palp) add('ecg', 'ecg', 'Eletrocardiograma de repouso', ['coração disparado ou descompassado'], ['AF24']);
  if (f.sync) add('ecg', 'ecg', 'Eletrocardiograma de repouso', ['desmaio ou quase desmaio'], ['SYNC18']);
  if (f.dysp) add('ecg', 'ecg', 'Eletrocardiograma de repouso', ['falta de ar fora do normal'], ['HF21']);
  if (f.cvd) add('ecg', 'ecg', 'Eletrocardiograma de repouso', ['doença do coração já conhecida'], ['CCS24']);

  // ---- Perfil lipídico: só com fator de risco (sem regra de idade) ----
  const lipWhy = [];
  if (f.hasHAS) lipWhy.push('pressão alta');
  if (f.dm) lipWhy.push('diabetes');
  if (f.colHigh) lipWhy.push('colesterol alto já informado');
  if (f.cvd) lipWhy.push('doença do coração já conhecida');
  if (f.smoke) lipWhy.push('fumo');
  if (f.fam) lipWhy.push('infarto ou AVC em parente próximo');
  if (lipWhy.length) add('lip', 'lab', 'Perfil lipídico (colesterol total, HDL, LDL e triglicerídeos)', lipWhy, f.hasHAS ? ['DIS25', 'PREV21', 'HAS20'] : ['DIS25', 'PREV21']);

  // ---- Glicemia e HbA1c ----
  const rf = f.hasHAS || f.cvd || f.colHigh || f.sed; // fatores de risco para diabetes (ADA, Tabela 2.5)
  const glElig = f.dm || f.glucHigh || f.hasHAS || f.age40 || (f.over && rf);
  const glWhy = [];
  if (f.dm) glWhy.push('diabetes: acompanhamento');
  if (f.glucHigh) glWhy.push('açúcar alto já informado');
  if (f.hasHAS) glWhy.push('pressão alta: exame de rotina da avaliação inicial');
  if (f.age40) glWhy.push('35 anos ou mais: rastreamento de diabetes');
  if (f.over && rf && !f.age40) glWhy.push('sobrepeso ou obesidade com outro fator de risco');
  if (glElig && f.glucUnk) glWhy.push('açúcar nunca medido ou não sabe');
  const glRefs = (f.hasHAS ? ['HAS20'] : []).concat(['ADA2']).concat(f.dm ? ['ADA10'] : []);
  if (glWhy.length) {
    add('gli', 'lab', 'Glicemia de jejum', glWhy, glRefs);
    add('hba1c', 'lab', 'Hemoglobina glicada (HbA1c)', glWhy, glRefs);
  }

  // ---- Rins ----
  const crWhy = [];
  if (f.renal) crWhy.push('problema nos rins já informado');
  if (f.hasHAS) crWhy.push('pressão alta: exame de rotina da avaliação inicial');
  if (f.dm) crWhy.push('diabetes');
  if (f.cvd) crWhy.push('doença do coração já conhecida');
  if (crWhy.length) add('cr', 'lab', 'Creatinina com taxa de filtração glomerular estimada', crWhy, f.hasHAS ? ['HAS20', 'KDIGO'] : ['KDIGO', 'CCS24']);

  const urWhy = [];
  if (f.renal) urWhy.push('problema nos rins já informado');
  if (f.hasHAS) urWhy.push('pressão alta: exame de rotina da avaliação inicial');
  if (f.dm) urWhy.push('diabetes');
  if (urWhy.length) add('urina', 'lab', 'Urina tipo 1', urWhy, f.hasHAS ? ['HAS20', 'KDIGO'] : ['KDIGO']);

  // albumina/creatinina: hipertenso só com diabetes ou 2+ fatores de risco (SBC 2020)
  const nRf = [f.smoke, f.colHigh, f.obese, f.fam, f.sed].filter(Boolean).length;
  const acrWhy = [];
  if (f.renal) acrWhy.push('problema nos rins já informado');
  if (f.dm) acrWhy.push('diabetes');
  if (f.hasHAS && nRf >= 2) acrWhy.push('pressão alta com dois ou mais outros fatores de risco');
  if (acrWhy.length) add('acr', 'lab', 'Relação albumina/creatinina na urina', acrWhy, f.hasHAS ? ['HAS20', 'KDIGO'] : ['KDIGO']);

  if (f.hasHAS) add('k', 'lab', 'Potássio e ácido úrico', ['pressão alta: exames de rotina da avaliação inicial'], ['HAS20']);

  // ---- Opcionais (falta de ar): vêm desmarcados ----
  if (f.dysp) {
    add('bnp', 'lab', 'NT-proBNP (opcional: se houver suspeita de insuficiência cardíaca)', ['falta de ar fora do normal'], ['HF21'], true);
    add('hemo', 'lab', 'Hemograma completo (opcional)', ['falta de ar fora do normal'], ['HF21', 'CCS24'], true);
  }
  if (f.dysp || f.palp) add('tsh', 'lab', 'TSH (opcional: função da tireoide)', [f.dysp ? 'falta de ar fora do normal' : null, f.palp ? 'coração disparado ou descompassado' : null].filter(Boolean), (f.dysp ? ['HF21'] : []).concat(f.palp ? ['AF24'] : []), true);

  if (f.ctrlLate) ['lip', 'gli', 'cr'].forEach(id => {
    const e = list.find(x => x.id === id);
    if (e && !e.why.includes('exames de controle atrasados com uso diário de remédio')) e.why.push('exames de controle atrasados com uso diário de remédio');
  });

  return list;
}

function examNoteHTML(list) {
  if (list.some(x => x.type === 'ecg')) return '';
  return 'Pelas respostas, não há indicação de eletrocardiograma. Em adulto sem sintomas e com baixo risco, o eletrocardiograma de rotina não é recomendado (USPSTF 2018).';
}
function examIncluded(list) { return list.filter(x => !EXAM_OFF[x.id]); }
function examRefKeys(list) {
  const keys = [];
  list.forEach(x => x.refs.forEach(r => { if (!keys.includes(r)) keys.push(r); }));
  if (!list.some(x => x.type === 'ecg') && !keys.includes('USPSTF18')) keys.push('USPSTF18');
  return keys;
}
function examWhyText(x, keys) {
  return 'Motivo: ' + x.why.join('; ') + '. [' + x.refs.map(r => keys.indexOf(r) + 1).join(', ') + ']';
}

function examsHTML() {
  const list = examSuggestions();
  const keys = examRefKeys(list);
  const labs = list.filter(x => x.type === 'lab'), ecg = list.filter(x => x.type === 'ecg');
  const row = x => `<label class="ex-row"><input type="checkbox" class="ex-chk" data-id="${x.id}" ${EXAM_OFF[x.id] ? '' : 'checked'}><span><strong>${escapeHtml(x.name)}</strong><em>${escapeHtml(examWhyText(x, keys))}</em></span></label>`;
  const note = examNoteHTML(list);
  const body = (ecg.length ? `<div class="ex-group">Eletrocardiograma</div>${ecg.map(row).join('')}` : '')
    + (labs.length ? `<div class="ex-group">Exames de laboratório</div>${labs.map(row).join('')}` : '')
    + (!list.length ? '<p>Nenhum exame de laboratório sugerido pelas respostas.</p>' : '')
    + (note ? `<p class="ex-note">${escapeHtml(note)} [${keys.indexOf('USPSTF18') + 1}]</p>` : '');
  return `<div class="exams-box"><div class="ns-title">Exames e eletrocardiograma sugeridos</div>
    <div class="ex-sub">Sugestão para avaliação médica, conforme as respostas. Não é pedido de exames e não altera a pontuação. Desmarque o que não quiser no relatório.</div>
    ${body}
    <div class="ex-refs"><strong>Referências</strong><ol>${keys.map(k => `<li>${escapeHtml(EX_REFS[k])}</li>`).join('')}</ol></div></div>`;
}

function examsPrintHTML() {
  const list = examIncluded(examSuggestions());
  const all = examSuggestions();
  const keys = examRefKeys(all);
  let html = `<div class="pw-section-h">Exames e eletrocardiograma sugeridos</div>
    <div class="pw-q"><div class="pw-opt">Sugestão para avaliação médica, conforme as respostas. Não é pedido de exames nem diagnóstico.</div></div>`;
  if (!list.length) html += `<div class="pw-q"><div class="pw-opt">Nenhum exame sugerido pelas respostas.</div></div>`;
  list.forEach(x => {
    html += `<div class="pw-q"><div class="pw-qtext">${x.type === 'ecg' ? '[ECG] ' : '[Laboratório] '}${escapeHtml(x.name)}</div><div class="pw-opt">${escapeHtml(examWhyText(x, keys))}</div></div>`;
  });
  const note = examNoteHTML(all);
  if (note) html += `<div class="pw-q"><div class="pw-opt">${escapeHtml(note)} [${keys.indexOf('USPSTF18') + 1}]</div></div>`;
  const used = examRefKeys(list.length ? list : []);
  const refKeys = keys;
  html += `<div class="pw-q"><div class="pw-qtext">Referências</div>${refKeys.map((k, i) => `<div class="pw-opt">${i + 1}. ${escapeHtml(EX_REFS[k])}</div>`).join('')}</div>`;
  return html;
}

function pdfExams(pdf, flow) {
  const all = examSuggestions();
  const list = examIncluded(all);
  const keys = examRefKeys(all);
  pdfSection(pdf, flow, 'Exames e eletrocardiograma sugeridos');
  flow.para('Sugestão para avaliação médica, conforme as respostas. Não é pedido de exames nem diagnóstico.', { size: 9, color: PDF_C.gray, lh: 1.4 });
  flow.gap(4);
  if (!list.length) { flow.para('Nenhum exame sugerido pelas respostas.', { size: 9.5, lh: 1.4 }); flow.gap(4); }
  list.forEach(x => {
    pdfQuestion(pdf, flow, (x.type === 'ecg' ? '[ECG] ' : '[Laboratório] ') + x.name, [], 0, [examWhyText(x, keys)]);
  });
  const note = examNoteHTML(all);
  if (note) { flow.para(note + ' [' + (keys.indexOf('USPSTF18') + 1) + ']', { size: 9, color: PDF_C.gray, lh: 1.4 }); flow.gap(4); }
  flow.gap(2);
  flow.para('Referências', { size: 9.5, lh: 1.4 });
  keys.forEach((k, i) => { flow.para((i + 1) + '. ' + EX_REFS[k], { size: 8, color: PDF_C.gray, lh: 1.35 }); flow.gap(2); });
  flow.gap(4);
}

function optionHTML(it, j, label) {
  const multi = it.type === 'multi';
  return `<label class="option" data-q="${it.id}" data-oi="${j}"><input type="${multi ? 'checkbox' : 'radio'}" name="q_${it.id}" value="${j}" tabindex="-1"> ${label}</label>`;
}
function itemHTML(it) {
  const tag = it.optional ? ' <span class="opt-tag">· opcional</span>' : '';
  let body;
  if (it.type === 'bmi') {
    body = `<div class="bmi-row">
        <label class="bmi-field">Peso (kg)<input type="text" inputmode="decimal" id="bmiPeso" placeholder="Ex: 72" autocomplete="off"></label>
        <label class="bmi-field">Altura (cm)<input type="text" inputmode="decimal" id="bmiAltura" placeholder="Ex: 165" autocomplete="off"></label>
      </div>
      <label class="option bmi-ns"><input type="checkbox" id="bmiNs"> Não sabe peso ou altura</label>
      <div class="bmi-out" id="bmiOut"></div>`;
  } else {
    body = `<div class="options">${it.opts.map((o, j) => optionHTML(it, j, o)).join('')}</div>`;
  }
  return `<div class="question${it.optional ? ' optional' : ''}${isVisible(it) ? '' : ' is-hidden'}" data-qwrap="${it.id}">

      <h3>${it.q}</h3>
      ${it.hint ? `<div class="q-hint">${it.hint}</div>` : ''}

function syncItemDom(id) {
  const it = ITEM[id];
  if (!it || it.type === 'bmi') return;
  const a = ANS[id];
  document.querySelectorAll(`.option[data-q="${id}"]`).forEach(opt => {
    const j = +opt.dataset.oi;
    const on = it.type === 'multi' ? (Array.isArray(a) && a.includes(j)) : a === j;
    opt.classList.toggle('selected', on);
    const inp = opt.querySelector('input'); if (inp) inp.checked = on;
  });
}

function syncBmiDom() {
  const a = ANS.P3 || {};
  const p = document.getElementById('bmiPeso'), h = document.getElementById('bmiAltura'), ns = document.getElementById('bmiNs');
  if (!p) return;
  if (document.activeElement !== p) p.value = a.peso || '';
  if (document.activeElement !== h) h.value = a.altura || '';
  ns.checked = !!a.ns;
  ns.closest('.option').classList.toggle('selected', !!a.ns);
  p.disabled = h.disabled = !!a.ns;
  const out = document.getElementById('bmiOut');
  const b = bmiOf(a);
  if (a.ns) out.textContent = 'Sem peso: a tela vai sugerir medir na coleta.';
  else if (b !== null) out.textContent = bmiText(a).split(' · ').pop();
  else if (a.peso || a.altura) out.textContent = 'Preencha peso (20 a 300 kg) e altura (100 a 230 cm).';
  else out.textContent = '';
}

function updateVisibility() {
  ITEMS.forEach(it => {
    if (!it.showIf) return;
    const vis = isVisible(it);
    const el = document.querySelector(`[data-qwrap="${it.id}"]`);
    if (el) el.classList.toggle('is-hidden', !vis);
    if (!vis && ANS[it.id] !== undefined) { delete ANS[it.id]; syncItemDom(it.id); }
  });
}

// Delegação de eventos (registrada uma vez só)
formArea.addEventListener('click', (e) => {
  const opt = e.target.closest('.option[data-q]');
  if (!opt) return;
  e.preventDefault();
  const id = opt.dataset.q, oi = +opt.dataset.oi, it = ITEM[id];
  if (it.type === 'multi') {
    const NONE = it.opts.length - 1;
    let arr = Array.isArray(ANS[id]) ? ANS[id].slice() : [];
    if (arr.includes(oi)) arr = arr.filter(x => x !== oi);
    else if (oi === NONE) arr = [NONE];
    else { arr = arr.filter(x => x !== NONE); arr.push(oi); arr.sort((x, y) => x - y); }
    ANS[id] = arr;
  } else {
    ANS[id] = oi;
  }
  syncItemDom(id);
  updateVisibility();
  updateProgress();
  saveDraft();
});
formArea.addEventListener('input', (e) => {
  const t = e.target;
  if (t.id === 'bmiPeso' || t.id === 'bmiAltura') {
    const a = Object.assign({}, ANS.P3 || {});
    a[t.id === 'bmiPeso' ? 'peso' : 'altura'] = t.value.trim();
    a.ns = false;
    ANS.P3 = a;
    syncBmiDom();
  }
  if (['respondentName', 'respondentPhone', 'bmiPeso', 'bmiAltura'].includes(t.id)) { updateProgress(); saveDraft(); }
});
formArea.addEventListener('change', (e) => {
  const t = e.target;
  if (t.id === 'bmiNs') {
    ANS.P3 = t.checked ? { ns: true } : {};
    syncBmiDom();
  }
  if (['bmiNs', 'respondentCity', 'consentCheck', 'consentContact'].includes(t.id)) { updateProgress(); saveDraft(); }
});

    clearTimeout(clearArmedTimer);
    btn.dataset.armed = '';

function resetAll() {

// Fica salvo apenas neste aparelho/navegador, para não perder o preenchimento
// se o app for fechado no meio da entrevista. Nada é enviado a servidores.
function saveDraft() {
  try {
    const draft = {
      v: 2,
      name: idVal('respondentName'),
      phone: idVal('respondentPhone'),
      city: idVal('respondentCity'),
      consent: isChecked('consentCheck'),
      consentContact: isChecked('consentContact'),
      ans: ANS,
      recordId: currentRecordId,
      recordCreatedAt: currentRecordCreatedAt,
      savedAt: new Date().toISOString(),
    };
    localStorage.setItem(DRAFT_KEY, JSON.stringify(draft));
  } catch (e) { /* localStorage indisponível — segue sem rascunho */ }
}

function restoreDraft() {
  let draft;
  try { draft = JSON.parse(localStorage.getItem(DRAFT_KEY) || 'null'); } catch (e) { draft = null; }
  if (!draft || draft.v !== 2) return;
  if (draft.name) document.getElementById('respondentName').value = draft.name;
  if (draft.phone) document.getElementById('respondentPhone').value = draft.phone;
  if (draft.city) document.getElementById('respondentCity').value = draft.city;
  if (draft.consent) document.getElementById('consentCheck').checked = true;
  if (draft.consentContact) document.getElementById('consentContact').checked = true;
  if (draft.recordId) { currentRecordId = draft.recordId; currentRecordCreatedAt = draft.recordCreatedAt || null; }
  if (draft.ans) Object.keys(draft.ans).forEach(k => { if (ITEM[k]) ANS[k] = draft.ans[k]; });
}

// --- Documento 2: Ficha de relacionamento (identificação, autorizações, acesso, interesse, próximos passos) ---
function crmMetaRows(dateStr, timeStr) {
  const rows = [['Nome completo', idVal('respondentName') || 'Não informado'], ['Telefone', idVal('respondentPhone') || 'Não informado']];
  if (idVal('respondentCity')) rows.push(['Município', idVal('respondentCity')]);
  rows.push(['Código de referência', `${resultComputed ? resultComputed.refCode : '—'} (o mesmo da Triagem de Saúde deste participante)`]);
  rows.push(['Data/hora do preenchimento', `${dateStr} às ${timeStr}`]);
  rows.push(['Registro (LGPD)', isChecked('consentCheck') ? 'autorizado' : 'não autorizado']);
  rows.push(['Contato da MAVI pelo WhatsApp', isChecked('consentContact') ? 'autorizado' : 'NÃO autorizado — não incluir na lista de retorno']);
  if (resultComputed) rows.push(['Resultado da triagem', scoreLine()]);
  return rows;
}
function nextStepLines() {
  if (hasAlert()) return ['Sinal de alerta: não oferecer venda. Orientar avaliação médica o quanto antes (192 se dor no peito agora).'];
  const ns = nextSteps();
  const out = ns.steps.map(s => `${s.title} — ${s.why}`);
  if (!out.length) out.push('Nenhum exame pendente identificado. Manter check-up periódico.');
  if (ANS.P3 && ANS.P3.ns) out.push('Medir peso e altura na coleta.');
  if (ns.argument) out.push('Argumento para o captador: ' + ns.argument + '.');
  if (ns.promo) out.push('Costuma esperar promoção: destacar o preço do pacote.');
  return out;
}
function buildCrmPrintHTML() {
  const { dateStr, timeStr } = pdfMeta();
  let html = `
    <div class="pw-header">
      <img src="data:image/png;base64,${LOGO_HEADER_B64}" alt="MAVI">
      <div class="pw-titles"><h1>Ficha de Relacionamento</h1><p>MAVI Assistência à Saúde — documento gerado em ${dateStr} às ${timeStr}</p></div>
    </div>
    <div class="pw-meta">${crmMetaRows(dateStr, timeStr).map(([k, v]) => `<div><strong>${k}:</strong> ${escapeHtml(v)}</div>`).join('')}</div>
    <div class="pw-section-h">Próximos passos sugeridos</div>
    ${nextStepLines().map(l => `<div class="pw-q"><div class="pw-opt">• ${escapeHtml(l)}</div></div>`).join('')}`;
  html += itemsPrintHTML(CRM_DOC_ITEMS);
  html += `<div class="pw-disclaimer">${CRM_DISCLAIMER}</div>
    <div class="pw-footer"><img src="data:image/png;base64,${MARK_SMALL_B64}" alt="MAVI"><div>MAVI Assistência à Saúde — ficha de relacionamento, não é documento clínico. Gerado em ${dateStr} às ${timeStr}.</div></div>`;
  return html;
}

// GERADOR DE PDF PRÓPRIO (sem bibliotecas externas, funciona offline)
// Monta um PDF A4 de verdade com as fontes padrão do PDF (Helvetica),
// a logo MAVI em JPEG, quebra de linha e de página automáticas.
// =====================================================================
const CP1252_EXTRA = { 0x20AC:0x80, 0x201A:0x82, 0x0192:0x83, 0x201E:0x84, 0x2026:0x85, 0x2020:0x86, 0x2021:0x87, 0x02C6:0x88, 0x2030:0x89, 0x0160:0x8A, 0x2039:0x8B, 0x0152:0x8C, 0x017D:0x8E, 0x2018:0x91, 0x2019:0x92, 0x201C:0x93, 0x201D:0x94, 0x2022:0x95, 0x2013:0x96, 0x2014:0x97, 0x02DC:0x98, 0x2122:0x99, 0x0161:0x9A, 0x203A:0x9B, 0x0153:0x9C, 0x017E:0x9E, 0x0178:0x9F };
const PDF_REPLACE = { '≥': '>=', '≤': '<=', '✓': 'v', '☒': 'X', '☐': '' };

function pdfEnc(str) {
  let out = '';
  for (const ch of String(str)) {
    if (PDF_REPLACE[ch] !== undefined) { out += PDF_REPLACE[ch]; continue; }
    const c = ch.codePointAt(0);
    if (c === 9 || c === 10 || c === 13) { out += ' '; continue; }
    if (c >= 32 && c < 127) { out += ch; continue; }
    if (c >= 0xA0 && c <= 0xFF) { out += String.fromCharCode(c); continue; }
    if (CP1252_EXTRA[c]) { out += String.fromCharCode(CP1252_EXTRA[c]); continue; }
    if (c >= 0x1F000 || (c >= 0x2600 && c <= 0x27BF) || c === 0xFE0F || c === 0x200D) continue; // emojis
    out += '?';
  }
  return out;
}
function pdfEsc(s) { return s.replace(/\\/g, '\\\\').replace(/\(/g, '\\(').replace(/\)/g, '\\)'); }
function pdfTextWidth(encoded, font, size) {
  const tbl = PDF_WIDTHS[font];
  let w = 0;
  for (let i = 0; i < encoded.length; i++) {
    const c = encoded.charCodeAt(i);
    w += (c >= 32 && c <= 255 ? (tbl[c - 32] || 556) : 556);
  }
  return w * size / 1000;
}
function pdfWrap(text, font, size, maxW) {
  const lines = [];
  String(text).split(/\n/).forEach(par => {
    const words = pdfEnc(par).split(' ').filter(w => w.length);
    let line = '';
    words.forEach(word => {
      const tryLine = line ? line + ' ' + word : word;
      if (pdfTextWidth(tryLine, font, size) <= maxW) { line = tryLine; return; }
      if (line) lines.push(line);
      // palavra maior que a linha: quebra por caracteres
      let rest = word;
      while (pdfTextWidth(rest, font, size) > maxW) {
        let k = rest.length;
        while (k > 1 && pdfTextWidth(rest.slice(0, k), font, size) > maxW) k--;
        lines.push(rest.slice(0, k)); rest = rest.slice(k);
      }
      line = rest;
    });
    lines.push(line);
  });
  return lines;
}

class MiniPDF {
  constructor() {
    this.W = 595.28; this.H = 841.89;
    this.pages = []; this.images = {}; this.meta = null;
    this.newPage();
  }
  newPage() { this.cur = []; this.pages.push(this.cur); }
  n(v) { return (Math.round(v * 100) / 100).toString(); }
  rgb(c) { return c.map(v => this.n(v / 255)).join(' '); }
  textEnc(x, y, enc, font, size, color) {
    this.cur.push(`BT /${font} ${this.n(size)} Tf ${this.rgb(color || [0, 0, 0])} rg ${this.n(x)} ${this.n(this.H - y)} Td (${pdfEsc(enc)}) Tj ET`);
  }
  text(x, y, str, font, size, color) { this.textEnc(x, y, pdfEnc(str), font, size, color); }
  rect(x, y, w, h, o) {
    const ops = [];
    if (o.fill) ops.push(`${this.rgb(o.fill)} rg`);
    if (o.stroke) ops.push(`${this.rgb(o.stroke)} RG ${this.n(o.lw || 1)} w`);
    ops.push(`${this.n(x)} ${this.n(this.H - y - h)} ${this.n(w)} ${this.n(h)} re ${o.fill && o.stroke ? 'B' : o.fill ? 'f' : 'S'}`);
    this.cur.push('q ' + ops.join(' ') + ' Q');
  }
  line(x1, y1, x2, y2, color, lw) {
    this.cur.push(`q ${this.rgb(color)} RG ${this.n(lw || 1)} w ${this.n(x1)} ${this.n(this.H - y1)} m ${this.n(x2)} ${this.n(this.H - y2)} l S Q`);
  }
  addImage(name, img) { this.images[name] = img; }
  image(name, x, y, w, h) {
    this.cur.push(`q ${this.n(w)} 0 0 ${this.n(h)} ${this.n(x)} ${this.n(this.H - y - h)} cm /${name} Do Q`);
  }
  output() {
    const objs = [];
    const add = (s) => { objs.push(s); return objs.length; };
    const catalog = add(null), pagesObj = add(null);
    const fonts = {
      F1: add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>'),
      F2: add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>'),
      F3: add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Oblique /Encoding /WinAnsiEncoding >>'),
    };
    const imgRefs = {};
    Object.entries(this.images).forEach(([name, img]) => {
      const bin = atob(img.b64);
      imgRefs[name] = add(`<< /Type /XObject /Subtype /Image /Width ${img.w} /Height ${img.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${bin.length} >>\nstream\n${bin}\nendstream`);
    });
    const fontRes = Object.entries(fonts).map(([k, v]) => `/${k} ${v} 0 R`).join(' ');
    const imgRes = Object.entries(imgRefs).map(([k, v]) => `/${k} ${v} 0 R`).join(' ');
    const kids = [];
    this.pages.forEach(ops => {
      const content = ops.join('\n');
      const c = add(`<< /Length ${content.length} >>\nstream\n${content}\nendstream`);
      kids.push(add(`<< /Type /Page /Parent ${pagesObj} 0 R /MediaBox [0 0 ${this.n(this.W)} ${this.n(this.H)}] /Resources << /Font << ${fontRes} >> /XObject << ${imgRes} >> >> /Contents ${c} 0 R >>`));
    });
    const infoRef = this.meta ? add(`<< /Producer (MAVI Triagem) /Keywords (${this.meta}) >>`) : 0;
    objs[catalog - 1] = `<< /Type /Catalog /Pages ${pagesObj} 0 R >>`;
    objs[pagesObj - 1] = `<< /Type /Pages /Kids [${kids.map(k => k + ' 0 R').join(' ')}] /Count ${kids.length} >>`;
    let out = '%PDF-1.4\n%\xE2\xE3\xCF\xD3\n';
    const offsets = [];
    objs.forEach((o, i) => { offsets.push(out.length); out += `${i + 1} 0 obj\n${o}\nendobj\n`; });
    const xref = out.length;
    out += `xref\n0 ${objs.length + 1}\n0000000000 65535 f \n` + offsets.map(o => String(o).padStart(10, '0') + ' 00000 n \n').join('');
    out += `trailer\n<< /Size ${objs.length + 1} /Root ${catalog} 0 R${infoRef ? ` /Info ${infoRef} 0 R` : ''} >>\nstartxref\n${xref}\n%%EOF\n`;
    const bytes = new Uint8Array(out.length);
    for (let i = 0; i < out.length; i++) bytes[i] = out.charCodeAt(i) & 0xFF;
    return bytes;
  }
}

const PDF_C = { ink: [17, 17, 17], gray: [85, 85, 85], light: [119, 119, 119], green: [47, 93, 79], red: [170, 51, 51], cream: [250, 247, 241], line: [204, 204, 204] };
const PDF_M = { left: 42, right: 42, top: 42, bottom: 60 };

class PdfFlow {
  constructor(pdf) { this.pdf = pdf; this.y = PDF_M.top; this.x = PDF_M.left; this.w = pdf.W - PDF_M.left - PDF_M.right; }
  space(h) { if (this.y + h > this.pdf.H - PDF_M.bottom) { this.pdf.newPage(); this.y = PDF_M.top; } }
  para(text, o = {}) {
    const font = o.font || 'F1', size = o.size || 10, lh = size * (o.lh || 1.35), indent = o.indent || 0;
    pdfWrap(text, font, size, this.w - indent).forEach(l => {
      this.space(lh);
      this.pdf.textEnc(this.x + indent, this.y + size, l, font, size, o.color || PDF_C.ink);
      this.y += lh;
    });
  }
  gap(h) { this.y += h; }
}

function pdfHeader(pdf, flow, title, dateStr, timeStr) {
  const lw = 128, lh = lw * PDF_LOGO.h / PDF_LOGO.w;
  pdf.image('Logo', flow.x, flow.y, lw, lh);
  const tx = flow.x + lw + 16;
  pdf.line(tx - 8, flow.y + 4, tx - 8, flow.y + lh - 4, PDF_C.line, 0.8);
  pdf.text(tx, flow.y + lh / 2 - 2, title, 'F2', 15, PDF_C.green);
  pdf.text(tx, flow.y + lh / 2 + 13, `MAVI Assistência à Saúde — documento gerado em ${dateStr} às ${timeStr}`, 'F1', 8.5, PDF_C.gray);
  flow.y += lh + 8;
  pdf.line(flow.x, flow.y, flow.x + flow.w, flow.y, PDF_C.green, 2);
  flow.y += 14;
}

function pdfMetaBox(pdf, flow, rows) {
  const size = 9.5, lh = 13.5, pad = 9;
  const lines = [];
  rows.forEach(([label, value]) => {
    const lab = pdfEnc(label + ': ');
    const lw = pdfTextWidth(lab, 'F2', size);
    const wrapped = pdfWrap(value, 'F1', size, flow.w - 2 * pad - lw);
    wrapped.forEach((l, i) => lines.push({ lab: i === 0 ? lab : '', lw, val: l }));
  });
  const h = lines.length * lh + 2 * pad - 3;
  flow.space(h);
  pdf.rect(flow.x, flow.y, flow.w, h, { fill: PDF_C.cream, stroke: PDF_C.line, lw: 0.8 });
  let y = flow.y + pad + size;
  lines.forEach(l => {
    if (l.lab) pdf.textEnc(flow.x + pad, y, l.lab, 'F2', size, PDF_C.ink);
    pdf.textEnc(flow.x + pad + l.lw, y, l.val, 'F1', size, PDF_C.ink);
    y += lh;
  });
  flow.y += h + 14;
}

function pdfSection(pdf, flow, title) {
  flow.space(40);
  flow.gap(4);
  pdf.text(flow.x, flow.y + 10, title.toUpperCase(), 'F2', 10, PDF_C.green);
  flow.y += 15;
  pdf.line(flow.x, flow.y, flow.x + flow.w, flow.y, PDF_C.green, 1.4);
  flow.y += 9;
}

// Bloco de pergunta: mantém pergunta + alternativas juntas na mesma página.
function pdfQuestion(pdf, flow, qtext, opts, markedIdx, extraLines) {
  const qSize = 10, oSize = 9.5, qlh = 13, olh = 12.5;
  const qLines = pdfWrap(qtext, 'F2', qSize, flow.w);
  const optLines = opts.map((o, j) => pdfWrap(o, (Array.isArray(markedIdx) ? markedIdx.includes(j) : j === markedIdx) ? 'F2' : 'F1', oSize, flow.w - 18));
  const extra = (extraLines || []).map(t => pdfWrap(t, 'F3', oSize, flow.w - 6));
  const isMarked = j => Array.isArray(markedIdx) ? markedIdx.includes(j) : j === markedIdx;
  const notAnswered = markedIdx === -1;
  const h = qLines.length * qlh + (notAnswered ? olh : optLines.reduce((a, l) => a + l.length * olh, 0)) + extra.reduce((a, l) => a + l.length * olh, 0) + 8;
  flow.space(Math.min(h, pdf.H - PDF_M.top - PDF_M.bottom));
  qLines.forEach(l => { flow.space(qlh); pdf.textEnc(flow.x, flow.y + qSize, l, 'F2', qSize, PDF_C.ink); flow.y += qlh; });
  flow.y += 1;
  if (notAnswered) {
    flow.space(olh);
    pdf.text(flow.x + 4, flow.y + oSize, 'Não respondido', 'F3', oSize, PDF_C.red);
    flow.y += olh;
  } else {
    optLines.forEach((ls, j) => {
      const marked = isMarked(j);
      ls.forEach((l, k) => {
        flow.space(olh);
        if (k === 0) {
          const bx = flow.x + 4, by = flow.y + 2.5, bs = 7.5;
          pdf.rect(bx, by, bs, bs, { stroke: PDF_C.ink, lw: 0.7 });
          if (marked) { pdf.line(bx + 1.4, by + 1.4, bx + bs - 1.4, by + bs - 1.4, PDF_C.ink, 1.1); pdf.line(bx + bs - 1.4, by + 1.4, bx + 1.4, by + bs - 1.4, PDF_C.ink, 1.1); }
        }
        pdf.textEnc(flow.x + 18, flow.y + oSize, l, marked ? 'F2' : 'F1', oSize, PDF_C.ink);
        flow.y += olh;
      });
    });
  }
  extra.forEach(ls => ls.forEach(l => { flow.space(olh); pdf.textEnc(flow.x + 6, flow.y + oSize, l, 'F3', oSize, PDF_C.gray); flow.y += olh; }));
  flow.y += 8;
}

function pdfDisclaimer(pdf, flow, text) {
  flow.space(30);
  flow.gap(4);
  pdf.line(flow.x, flow.y, flow.x + flow.w, flow.y, PDF_C.line, 0.8);
  flow.gap(7);
  flow.para(text, { size: 8.3, color: PDF_C.gray, lh: 1.45 });
}

function pdfFooters(pdf, note) {
  const total = pdf.pages.length;
  pdf.pages.forEach((ops, i) => {
    pdf.cur = ops;
    const y = pdf.H - 34;
    pdf.line(PDF_M.left, y - 6, pdf.W - PDF_M.right, y - 6, PDF_C.line, 0.6);
    pdf.image('Mark', PDF_M.left, y - 1, 14, 14);
    const enc = pdfEnc(note);
    pdf.textEnc(PDF_M.left + 19, y + 9, enc, 'F1', 7.5, PDF_C.light);
    const pg = pdfEnc(`Página ${i + 1} de ${total}`);
    pdf.textEnc(pdf.W - PDF_M.right - pdfTextWidth(pg, 'F1', 7.5), y + 9, pg, 'F1', 7.5, PDF_C.light);
  });
}

function newMaviPdf() {
  const pdf = new MiniPDF();
  pdf.addImage('Logo', PDF_LOGO);
  pdf.addImage('Mark', PDF_MARK);
  return pdf;

function pdfItems(pdf, flow, items) {
  let lastBlock = null;
  items.forEach(it => {
    if (!isVisible(it)) return;
    if (it.block !== lastBlock) { pdfSection(pdf, flow, blockTitleOf(it.block)); lastBlock = it.block; }
    if (it.type === 'bmi') pdfQuestion(pdf, flow, `${it.id}. ${it.q}`, [bmiText(ANS.P3)], 0);
    else pdfQuestion(pdf, flow, `${it.id}. ${it.q}`, it.opts, docItemMarks(it));
  });
}

function setPdfStatus(container, text, isError) {
  container.innerHTML = `<div class="pdf-status ${isError ? 'err' : ''}">${text}</div>`;

function buildStandaloneDoc(innerHtml, fileTitle) {
  return `<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8">`
    + `<meta name="viewport" content="width=device-width, initial-scale=1">`
    + `<title>${fileTitle}</title><style>${PRINT_STYLES}</style></head><body>`
    + `<div class="no-print"><button id="printNowBtn">🖨️ Imprimir / Salvar como PDF</button>`
    + `<span class="hint">Na caixa que abrir, em "Destino" ou "Impressora", escolha "Salvar como PDF".</span></div>`
    + `<div class="pw-wrap">${innerHtml}</div>`
    + `<script>document.getElementById('printNowBtn').addEventListener('click', function(){ window.print(); });<\/script>`
    + `<\/body><\/html>`;
}

function generateDocument(kind, boxId) {
  const isRisk = kind === 'risk';
  const statusBox = document.getElementById(boxId || (isRisk ? 'riskPdfArea' : 'crmPdfArea'));
  setPdfStatus(statusBox, '⏳ Preparando o documento...', false);

  let innerHtml, fileTitle;
  try {
    const today = new Date();
    const y = today.getFullYear(), m = String(today.getMonth()+1).padStart(2,'0'), d = String(today.getDate()).padStart(2,'0');
    if (isRisk) {
      innerHtml = buildRiskPrintHTML();
      fileTitle = `MAVI_Triagem_Saude_${y}-${m}-${d}`;
    } else {
      innerHtml = buildCrmPrintHTML();
      fileTitle = `MAVI_Ficha_Relacionamento_${y}-${m}-${d}`;
    }
  } catch (e) {
    setPdfStatus(statusBox, '⚠️ Não foi possível montar o documento. Detalhe: ' + e.message, true);
    return;
  }

  // PDF de verdade, gerado aqui mesmo (sem impressão do navegador)
  let pdfBytes = null;
  try { pdfBytes = isRisk ? buildRiskPDF() : buildCrmPDF(); } catch (e) { console.warn('PDF não gerado:', e && e.message); }
  const pdfName = fileTitle + '.pdf';

  // Dentro de uma página do Claude, impressão e links de download são bloqueados:
  // o arquivo é entregue pela própria plataforma, com confirmação.
  if (window.claude && typeof window.claude.use === 'function') {
    if (!pdfBytes) { setPdfStatus(statusBox, '⚠️ Não foi possível gerar o PDF.', true); return; }
    setPdfStatus(statusBox, '⏳ Confirme o salvamento do PDF na janela que vai aparecer…', false);
    window.claude.use('downloads').then(async (dl) => {
      if (!dl) { setPdfStatus(statusBox, '⚠️ Salvar arquivos não está disponível nesta tela.', true); return; }
      try {
        await dl.save({ filename: pdfName, data: new Blob([pdfBytes], { type: 'application/pdf' }) });
        setPdfStatus(statusBox, '✅ PDF salvo no aparelho (pasta Download).', false);
      } catch (e) {
        const code = e && e.code;
        setPdfStatus(statusBox, code === 'declined' ? 'Salvamento cancelado. Toque no botão de novo para tentar.' : '⚠️ Não foi possível salvar o PDF (' + (code || 'erro') + ').', code !== 'declined');
      }
    });
    return;
  }

  let blobUrl;
  try {
    const fullHtml = buildStandaloneDoc(innerHtml, fileTitle);
    const blob = new Blob([fullHtml], { type: 'text/html' });
    blobUrl = URL.createObjectURL(blob);
  } catch (e) {
    setPdfStatus(statusBox, '⚠️ Não foi possível preparar o arquivo. Detalhe: ' + e.message, true);
    return;
  }

  // PDF pronto para baixar e, onde o aparelho permitir, para enviar direto
  // (o Android abre a lista de apps, com o WhatsApp, já com o arquivo anexado).
  let pdfUrl = null, pdfFile = null, canSharePdf = false;
  if (pdfBytes) {
    try {
      pdfUrl = URL.createObjectURL(new Blob([pdfBytes], { type: 'application/pdf' }));
      pdfFile = new File([pdfBytes], pdfName, { type: 'application/pdf' });
      canSharePdf = !!(navigator.canShare && navigator.canShare({ files: [pdfFile] }));
    } catch (e) { canSharePdf = false; }
  }

  // Links reais: o usuário toca neles como em qualquer link (não dependem de
  // janelas abertas por script, que alguns celulares bloqueiam em silêncio).
  statusBox.innerHTML = `
    <div class="pdf-link-box">
      <a class="pdf-link" href="${blobUrl}" target="_blank" rel="noopener">👁️ Toque aqui para abrir o documento</a>
      <a class="pdf-link secondary" ${pdfUrl ? `href="${pdfUrl}" download="${pdfName}"` : `href="${blobUrl}" download="${fileTitle}.html"`}>⬇️ ${pdfUrl ? 'Ou baixe o PDF pronto' : 'Ou baixe o arquivo'}</a>
      ${canSharePdf ? `<button class="pdf-link share-pdf" type="button">📤 Enviar PDF (WhatsApp e outros apps)</button>` : ''}
      <div class="pdf-status-hint">Dentro do documento, toque em "Imprimir / Salvar como PDF".</div>
    </div>
  `;
  const shareBtn = statusBox.querySelector('.share-pdf');
  if (shareBtn) {
    shareBtn.addEventListener('click', async () => {
      try {
        // Só o arquivo: nenhum dado de saúde vai no texto da mensagem.
        await navigator.share({ files: [pdfFile], title: pdfName });
      } catch (e) { /* o usuário cancelou ou o app não aceitou: nada é enviado */ }
    });
  }
}

function digitsOnly(s) { return (s || '').replace(/\D/g, ''); }

// Retorna { ok, digits, msg } — número vazio é válido (abre o seletor de
// contato do WhatsApp); número preenchido precisa ter DDI + DDD + número.
function checkWaPhone(raw) {
  const d = digitsOnly(raw);
  if (!d) return { ok: true, digits: '' };
  if (d.length < 12 || d.length > 13) {
    return { ok: false, digits: d, msg: 'Número incompleto: inclua o código do país (55) e o DDD. Ex.: 55 87 98888-7766.' };
  }
  return { ok: true, digits: d };
}

// =====================================================================
// ÁREA RESTRITA — registro local cifrado + painel de gráficos
// =====================================================================
// Como funciona:
// - Na primeira vez, o administrador cria uma senha neste aparelho. É gerado
//   um par de chaves RSA-OAEP 2048 (SHA-256). A chave privada é guardada
//   CIFRADA (AES-GCM 256) com uma chave derivada da senha por PBKDF2-SHA256
//   (600.000 iterações, salt aleatório de 16 bytes). A senha nunca é salva.
// - Cada questionário concluído é cifrado com a chave PÚBLICA no momento em
//   que o resultado aparece (AES-GCM 256 com chave nova por registro; essa
//   chave é protegida com RSA-OAEP). Nem quem preencheu consegue reabrir.
// - Só são guardadas respostas de múltipla escolha, município, pontuação e
//   data. NÃO são guardados nome, telefone, peso/altura exatos nem textos livres.
// - Ao entrar com a senha, a chave privada é aberta só em memória (não
//   exportável) e os registros são decifrados para montar os gráficos. Ao
//   sair, por inatividade (10 min) ou ao fechar, tudo some da memória.
// Limitações reais: quem souber a senha e tiver o aparelho vê os dados;
// limpar os dados do Chrome ou desinstalar o app apaga os registros; a senha
// não pode ser recuperada.

const DB_NAME = 'mavi_triagem_db';
const FORM_VERSION = '2026-10-v2';
const PBKDF2_ITER = 600000;
const RSA_GEN = { name: 'RSA-OAEP', modulusLength: 2048, publicExponent: new Uint8Array([1, 0, 1]), hash: 'SHA-256' };
let currentRecordId = null;
let currentRecordCreatedAt = null;
let adminPrivKey = null;
let adminRecords = [];
let adminUnreadable = 0;
let adminIdleTimer = null;
let adminFailedTries = 0;
let adminBlockedUntil = 0;
const adminFilters = { period: 'all', city: '', age: '' };

function cryptoAvailable() {
  return !!(window.crypto && crypto.subtle && window.indexedDB);
}

function openDb() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, 3);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains('records')) db.createObjectStore('records', { keyPath: 'id' });
      if (!db.objectStoreNames.contains('meta')) db.createObjectStore('meta', { keyPath: 'k' });
      if (!db.objectStoreNames.contains('saved')) db.createObjectStore('saved', { keyPath: 'id' });
      if (!db.objectStoreNames.contains('pdfs')) db.createObjectStore('pdfs', { keyPath: 'id' });
      if (!db.objectStoreNames.contains('imported')) db.createObjectStore('imported', { keyPath: 'id' });
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function idb(store, mode, op) {
  const db = await openDb();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, mode);
    const req = op(tx.objectStore(store));
    tx.oncomplete = () => { db.close(); resolve(req ? req.result : undefined); };

const metaGet = (k) => idb('meta', 'readonly', s => s.get(k)).then(v => (v ? v.v : null));
const metaPut = (k, v) => idb('meta', 'readwrite', s => s.put({ k, v }));

async function deriveKek(password, salt, iterations) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt, iterations, hash: 'SHA-256' },
    base, { name: 'AES-GCM', length: 256 }, false, ['wrapKey', 'unwrapKey']);
}

async function adminSetup(password) {
  const cloud = await getCloud();
  if (cloud) return cloudAdminSetup(cloud, password);
  const pair = await crypto.subtle.generateKey(RSA_GEN, true, ['encrypt', 'decrypt']);
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const kek = await deriveKek(password, salt, PBKDF2_ITER);
  const wrappedPriv = await crypto.subtle.wrapKey('pkcs8', pair.privateKey, kek, { name: 'AES-GCM', iv });
  const pubSpki = await crypto.subtle.exportKey('spki', pair.publicKey);
  await metaPut('admin', {
    v: 1,
    alg: 'RSA-OAEP-2048/SHA-256 + AES-GCM-256; senha: PBKDF2-SHA256',
    iter: PBKDF2_ITER,
    salt, iv,
    wrappedPriv: new Uint8Array(wrappedPriv),
    pubSpki: new Uint8Array(pubSpki),
    createdAt: new Date().toISOString(),
  });
  try { if (navigator.storage && navigator.storage.persist) await navigator.storage.persist(); } catch (e) {}
}

async function adminUnlock(password) {
  const cloud = await getCloud();
  if (cloud) return cloudAdminUnlock(cloud, password);
  const cfg = await metaGet('admin');
  if (!cfg) throw new Error('not-configured');
  const kek = await deriveKek(password, cfg.salt, cfg.iter || PBKDF2_ITER);
  try {
    return await crypto.subtle.unwrapKey('pkcs8', cfg.wrappedPriv, kek, { name: 'AES-GCM', iv: cfg.iv },
      { name: 'RSA-OAEP', hash: 'SHA-256' }, false, ['decrypt']);
  } catch (e) {
    throw new Error('wrong-password');
  }
}

async function getAdminPublicKey() {
  const cfg = await metaGet('admin');
  if (!cfg) return null;
  return crypto.subtle.importKey('spki', cfg.pubSpki, { name: 'RSA-OAEP', hash: 'SHA-256' }, false, ['encrypt']);
}

async function encryptRecord(pub, obj, id) {
  const raw = crypto.getRandomValues(new Uint8Array(32));
  const key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['encrypt']);
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const aad = new TextEncoder().encode(id); // amarra o conteúdo cifrado ao seu identificador
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv, additionalData: aad }, key,
    new TextEncoder().encode(JSON.stringify(obj)));
  const ek = await crypto.subtle.encrypt({ name: 'RSA-OAEP' }, pub, raw);
  raw.fill(0);
  return { iv, ek: new Uint8Array(ek), ct: new Uint8Array(ct) };
}

async function decryptRecord(priv, rec) {
  const raw = await crypto.subtle.decrypt({ name: 'RSA-OAEP' }, priv, rec.ek);
  const key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
  const pt = await crypto.subtle.decrypt(
    { name: 'AES-GCM', iv: rec.iv, additionalData: new TextEncoder().encode(rec.id) }, key, rec.ct);
  const obj = JSON.parse(new TextDecoder().decode(pt));
  if (obj.id !== rec.id) throw new Error('id-mismatch');
  return obj;
}

async function deliverPdf(bytes, name) {
  const blob = new Blob([bytes], { type: 'application/pdf' });
  if (window.claude && typeof window.claude.use === 'function') {
    const dl = await window.claude.use('downloads');
    if (!dl) throw new Error('indisponivel');
    await dl.save({ filename: name, data: blob });
    return;
  }
  const file = new File([bytes], name, { type: 'application/pdf' });
  if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: name }); return; }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 60000);
}

async function aesKeyEncrypt(key, id, bytes) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv, additionalData: new TextEncoder().encode(id) }, key, bytes));
  return { iv, ct };
}
async function aesKeyDecrypt(key, id, iv, ct) {
  return new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-GCM', iv, additionalData: new TextEncoder().encode(id) }, key, ct));
}

// PDFs anexados na área restrita: cifrados com a chave pública da coordenação.
async function encryptBytes(pub, bytes, id) {
  const raw = crypto.getRandomValues(new Uint8Array(32));
  const key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['encrypt']);
  const e = await aesKeyEncrypt(key, id, bytes);
  const ek = new Uint8Array(await crypto.subtle.encrypt({ name: 'RSA-OAEP' }, pub, raw));
  raw.fill(0);
  return { iv: e.iv, ek, ct: e.ct };
}
async function decryptBytes(priv, id, rec) {
  const raw = await crypto.subtle.decrypt({ name: 'RSA-OAEP' }, priv, rec.ek);
  const key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
  return aesKeyDecrypt(key, id, rec.iv, rec.ct);
}
async function sha8(bytes) {
  const h = new Uint8Array(await crypto.subtle.digest('SHA-256', bytes));
  return Array.from(h.slice(0, 6)).map(b => b.toString(16).padStart(2, '0')).join('');
}

let adminPdfs = [];
async function storeImportedPdf(recId, bytes) {
  if (bytes.length > 700000) throw new Error('grande');
  const id = recId + '_' + await sha8(bytes);
  const meta = { recId, size: bytes.length, savedAt: new Date().toISOString() };
  const cloud = await getCloud();
  if (cloud) {
    const pub = await cloudPublicKey(cloud);
    if (!pub) throw new Error('no-key');
    const e = await encryptBytes(pub, bytes, id);
    await cloud.db.doc(`inbox/${cloud.uid}`).set({ updatedAt: meta.savedAt });
    await cloud.db.doc(`inbox/${cloud.uid}/pdfs/${id}`).set({ v: 1, iv: b64enc(e.iv), ek: b64enc(e.ek), ct: b64enc(e.ct) });
    await cloud.db.doc(`inbox/${cloud.uid}/pdfmeta/${id}`).set(meta);
    return;
  }
  const pub = await getAdminPublicKey();
  if (!pub) throw new Error('no-key');
  const e = await encryptBytes(pub, bytes, id);
  await idb('imported', 'readwrite', st => st.put({ id, ...meta, ...e }));
}
async function loadAdminPdfMeta() {
  try {
    const cloud = await getCloud();
    if (cloud) {
      const q = await cloud.db.collection(`inbox/${cloud.uid}/pdfmeta`).get();
