<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2F5D4F">
<meta name="description" content="Triagem de risco cardiovascular e histórico de saúde MAVI — funciona offline">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MAVI Triagem">
<title>MAVI Triagem Cardiovascular</title>
<style>
  :root {
    --ochre: #B5732A;
    --ochre-dark: #8C551D;
    --green: #2F5D4F;
    --green-light: #EAF1EE;
    --cream: #FBF6EE;
    --ink: #2A241C;
    --line: #E3D8C4;
    --red: #B23A2E;
    --amber: #C68A1F;
    --blue: #1E4F7A;
    --whatsapp: #1F9B57;
    --whatsapp-dark: #167A43;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--cream);
    color: var(--ink);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    line-height: 1.4;
  }
  header {
    background: var(--green);
    color: var(--cream);
    padding: 20px 20px 22px;
    text-align: center;
  }
  header img.logo {
    max-width: 230px;
    width: 70%;
    height: auto;
    margin-bottom: 10px;
    background: #fff;
    border-radius: 10px;
    padding: 8px 14px;
  }
  header .brand {
    font-size: 13px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    opacity: 0.75;
    margin-bottom: 6px;
  }
  header h1 {
    font-family: Georgia, 'Times New Roman', serif;
    font-weight: 600;
    font-size: 23px;
    margin: 0 0 6px;
  }
  header p {
    margin: 0;
    font-size: 13.5px;
    opacity: 0.85;
    max-width: 420px;
    margin: 0 auto;
  }
  #offlineBadge { display:none; margin-top:10px; font-size:12px; background:rgba(255,255,255,0.15); padding:4px 10px; border-radius:20px; display:inline-block; }
  a.perfil-link {
    display:block; background:var(--green-light); color:var(--green); text-align:center; text-decoration:none;
    padding:12px; font-size:14px; font-weight:600; border-bottom:1px solid var(--line);
  }
  button#installBtn {
    display:none; width:100%; background:var(--ochre); color:#fff; border:none;
    padding:12px; font-size:14px; font-weight:600; cursor:pointer;
  }
  .toolbar {
    max-width: 560px;
    margin: 0 auto;
    padding: 10px 16px 0;
    display: flex;
    justify-content: space-between;
  }
  .consent-row { display: flex; gap: 10px; align-items: flex-start; margin-top: 12px; padding: 10px 12px; background: #fff; border: 1px solid var(--line); border-radius: 8px; font-size: 13px; line-height: 1.45; cursor: pointer; }
  .consent-row input { width: 20px; height: 20px; flex: none; margin-top: 1px; accent-color: var(--green); }
  .send-status { font-size: 13px; line-height: 1.45; margin-top: 10px; padding: 0 4px; text-align: center; }
  .send-status:empty { display: none; }
  .send-status.ok { color: var(--green); font-weight: 600; }
  .send-status.wait { color: #8a6a1c; }
  .send-status.err { color: var(--red); font-weight: 600; }
  .clear-link.armed { color: var(--red) !important; font-weight: 700; }
  .clear-link {
    background: none;
    border: none;
    color: #8a6a4a;
    font-size: 12.5px;
    text-decoration: underline;
    cursor: pointer;
    padding: 6px 2px;
  }
  main {
    max-width: 560px;
    margin: 0 auto;
    padding: 10px 16px 120px;
  }
  .progress-wrap {
    position: sticky;
    top: 0;
    background: var(--cream);
    padding: 12px 0 10px;
    z-index: 5;
    border-bottom: 1px solid var(--line);
  }
  .progress-bar {
    height: 6px;
    border-radius: 4px;
    background: var(--line);
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: var(--ochre);
    width: 0%;
    transition: width 0.25s ease;
  }
  .progress-label {
    font-size: 12px;
    color: var(--ochre-dark);
    margin-top: 6px;
    font-weight: 600;
    letter-spacing: 0.02em;
  }
  .section-title {
    margin: 26px 0 4px;
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--green);
    border-bottom: 2px solid var(--green);
    padding-bottom: 6px;
  }
  .section-sub {
    font-size: 12.5px;
    color: #6b6156;
    margin: 4px 0 10px;
  }
  .question, .name-field {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 16px 16px 14px;
    margin-top: 14px;
  }
  .question.optional {
    border-style: dashed;
  }
  .question .qnum, .name-field .qnum {
    font-size: 11px;
    color: var(--ochre-dark);
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .question .qnum.extra { color: var(--blue); }
  .opt-tag {
    font-weight: 600;
    color: #8a8070;
    text-transform: none;
    letter-spacing: 0;
  }
  .question h3, .name-field h3 {
    font-size: 15.5px;
    margin: 4px 0 12px;
    font-weight: 600;
  }
  .options {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .option {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    transition: border-color 0.15s, background 0.15s;
  }
  .option:hover { border-color: var(--ochre); }
  .option input { accent-color: var(--ochre); width: 16px; height: 16px; flex-shrink: 0; }
  .option.selected {
    border-color: var(--ochre);
    background: #FBF0E2;
  }
  .conditional-field {
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px dashed var(--line);
    display: none;
  }
  .conditional-field.show { display: block; }
  .conditional-field label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 6px;
    color: var(--ink);
  }
  .conditional-field textarea,
  .conditional-field input[type="text"],
  .name-field input[type="text"],
  .name-field input[type="tel"],
  .name-field select {
    width: 100%;
    padding: 11px 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    font-size: 14px;
    font-family: inherit;
    color: var(--ink);
    background: #fff;
  }
  .conditional-field textarea { min-height: 64px; resize: vertical; }
  .conditional-field textarea:focus,
  .conditional-field input[type="text"]:focus,
  .name-field input:focus,
  .name-field select:focus {
    outline: none;
    border-color: var(--ochre);
  }
  .checkbox-grid {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .checkbox-opt {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    font-size: 13.5px;
    cursor: pointer;
  }
  .checkbox-opt input { accent-color: var(--blue); width: 16px; height: 16px; flex-shrink: 0; }
  .checkbox-opt.selected { border-color: var(--blue); background: #EAF1F8; }
  .id-row { margin-top: 12px; }
  .id-row:first-child { margin-top: 0; }
  .id-label {
    display:block; font-size: 12.5px; font-weight: 700; color: #6b6156; margin-bottom: 5px;
  }
  .required-mark { color: var(--red); }
  footer {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: #fff;
    border-top: 1px solid var(--line);
    padding: 12px 16px;
    display: flex;
    justify-content: center;
  }
  button#calcBtn {
    background: var(--green);
    color: #fff;
    border: none;
    padding: 13px 28px;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    width: 100%;
    max-width: 528px;
    transition: opacity 0.15s;
  }
  button#calcBtn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }
  #result {
    display: none;
    max-width: 560px;
    margin: 0 auto;
    padding: 20px 16px 60px;
  }
  .result-card {
    border-radius: 12px;
    padding: 26px 22px;
    text-align: center;
    color: #fff;
  }
  .result-card .name {
    font-size: 14px;
    opacity: 0.9;
    margin-bottom: 12px;
  }
  .result-card .score {
    font-family: Georgia, serif;
    font-size: 46px;
    font-weight: 700;
    line-height: 1;
    margin-bottom: 4px;
  }
  .result-card .maxscore {
    font-size: 13px;
    opacity: 0.85;
    margin-bottom: 14px;
  }
  .result-card .label {
    font-size: 18px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-bottom: 10px;
  }
  .result-card .action {
    font-size: 14.5px;
    line-height: 1.5;
    background: rgba(255,255,255,0.15);
    border-radius: 8px;
    padding: 12px 14px;
    margin-top: 6px;
  }
  .result-card .refcode {
    font-size: 11.5px;
    opacity: 0.8;
    margin-top: 10px;
    letter-spacing: 0.03em;
  }
  .risk-low { background: var(--green); }
  .risk-mod { background: var(--amber); }
  .risk-high { background: #C05A1E; }
  .risk-vhigh { background: var(--red); }
  .risk-alert { background: var(--red); }
  .block-head { margin: 26px 0 10px; }
  .block-head .block-num { font-size: 11.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ochre); }
  .block-head .section-title { margin-top: 2px; }
  .block-head .section-sub { font-size: 13px; color: #555; margin-top: 6px; line-height: 1.45; }
  .block-head.alert .section-title { color: var(--red); border-bottom-color: var(--red); }
  .block-head.alert .section-sub { background: #FBECEA; border-left: 4px solid var(--red); padding: 8px 10px; border-radius: 6px; color: #5a1d17; }
  .q-hint { font-size: 12.5px; color: #666; margin: -4px 0 8px; font-style: italic; }
  .opt-tag { font-weight: 400; color: #888; text-transform: none; letter-spacing: 0; }
  .question.is-hidden { display: none; }
  .bmi-row { display: flex; gap: 10px; flex-wrap: wrap; }
  .bmi-field { flex: 1 1 120px; display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 600; color: #444; }
  .bmi-field input { font-size: 16px; padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 8px; background: #fff; }
  .bmi-field input:disabled { background: #f1f0ed; color: #999; }
  .bmi-ns { margin-top: 10px; }
  .bmi-out { margin-top: 8px; font-size: 13.5px; font-weight: 700; color: var(--green); min-height: 1em; }
  .next-steps { background: #fff; border: 1.5px solid var(--green); border-radius: 12px; padding: 14px 16px; margin: 14px 0; }
  .next-steps.alert { border-color: var(--red); background: #FBECEA; }
  .next-steps .ns-title { font-weight: 800; color: var(--green); font-size: 15px; margin-bottom: 8px; }
  .next-steps.alert .ns-title { color: var(--red); }
  .next-steps ul { margin: 0; padding-left: 18px; }
  .next-steps li { margin-bottom: 8px; font-size: 14px; }
  .next-steps li span { display: block; font-size: 12.5px; color: #555; }
  .next-steps p { margin: 0; font-size: 14px; line-height: 1.5; }
  .ns-arg { margin-top: 8px; font-size: 13px; background: var(--cream); border-radius: 8px; padding: 8px 10px; }
  .exams-box { background: #fff; border: 1.5px solid var(--blue); border-radius: 12px; padding: 14px 16px; margin: 14px 0; }
  .exams-box .ns-title { color: var(--blue); }
  .ex-sub { font-size: 12.5px; color: #555; margin-bottom: 8px; line-height: 1.45; }
  .ex-group { font-size: 12px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; color: var(--blue); margin: 10px 0 4px; }
  .ex-row { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; border-bottom: 1px solid var(--line); cursor: pointer; font-size: 14px; }
  .ex-row input { width: 20px; height: 20px; flex: none; margin-top: 1px; accent-color: var(--blue); }
  .ex-row em { display: block; font-style: normal; font-size: 12.5px; color: #555; margin-top: 2px; line-height: 1.4; }
  .ex-note { font-size: 12.5px; color: #555; margin: 10px 0 0; line-height: 1.45; }
  .ex-refs { margin-top: 12px; font-size: 11.5px; color: #555; line-height: 1.45; }
  .ex-refs ol { margin: 4px 0 0; padding-left: 18px; }
  .ex-refs li { margin-bottom: 5px; word-break: break-word; }
  .disclaimer {
    font-size: 12px;
    color: #6b6156;
    margin-top: 18px;
    text-align: center;
    line-height: 1.5;
    padding: 0 8px;
  }
  .result-actions {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-top: 20px;
  }
  button.pdf-btn {
    background: var(--blue);
    color: #fff;
    border: none;
    padding: 14px 20px;
    border-radius: 8px;
    font-size: 15.5px;
    font-weight: 700;
    cursor: pointer;
  }
  button.pdf-btn.crm {
    background: var(--ochre);
  }
  .pdf-tip {
    font-size: 12px;
    color: #6b6156;
    line-height: 1.45;
    text-align: center;
    padding: 2px 6px;
  }
  .pdf-status {
    font-size: 13px;
    text-align: center;
    padding: 8px 10px;
    color: #6b6156;
  }
  .pdf-status.err {
    color: var(--red);
    font-weight: 600;
    background: #FCEBEA;
    border-radius: 8px;
  }
  .pdf-link-box {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 12px;
    background: #EAF1F8;
    border: 1px solid #BFD6EA;
    border-radius: 10px;
  }
  a.pdf-link {
    display: block;
    text-align: center;
    background: var(--blue);
    color: #fff !important;
    text-decoration: none;
    padding: 12px 14px;
    border-radius: 8px;
    font-size: 14.5px;
    font-weight: 700;
  }
  button.pdf-link { border: none; cursor: pointer; font-family: inherit; width: 100%; }
  button.pdf-link.share-pdf { background: var(--whatsapp); }
  a.pdf-link.secondary {
    background: #fff;
    color: var(--blue) !important;
    border: 1.5px solid var(--blue);
  }
  .pdf-status-hint {
    font-size: 12px;
    color: #4a5a6a;
    text-align: center;
  }
  .restart {
    display: block;
    text-align: center;
    background: none;
    border: 1px solid var(--line);
    color: var(--ink);
    padding: 10px 20px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
  }
  .review-btn {
    display: block;
    text-align: center;
    background: none;
    border: 1px dashed var(--line);
    color: #6b6156;
    padding: 9px 20px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13.5px;
  }
  .share-section {
    margin-top: 6px;
    padding: 14px 14px 16px;
    background: #EAF6EF;
    border: 1px solid #BEDFC9;
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .share-title {
    font-size: 15px;
    font-weight: 800;
    color: var(--whatsapp-dark);
  }
  .share-sub {
    font-size: 12px;
    color: #4a5a4f;
    line-height: 1.5;
  }
  .share-label {
    font-size: 12.5px;
    font-weight: 700;
    color: var(--ink);
    margin-top: 2px;
  }
  #waPhoneInput {
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    font-size: 14.5px;
    font-family: inherit;
  }
  .share-hint {
    font-size: 11.5px;
    color: var(--red);
    min-height: 14px;
  }
  button.share-btn {
    background: var(--whatsapp);
    color: #fff;
    border: none;
    padding: 12px 16px;
    border-radius: 8px;
    font-size: 14.5px;
    font-weight: 700;
    cursor: pointer;
  }
  button.share-btn.secondary {
    background: #fff;
    color: var(--whatsapp-dark);
    border: 1.5px solid var(--whatsapp);
  }
  .share-box {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 12px;
    background: #fff;
    border: 1px solid #BEDFC9;
    border-radius: 10px;
  }
  .share-box textarea {
    width: 100%;
    min-height: 110px;
    padding: 10px;
    border: 1px solid var(--line);
    border-radius: 8px;
    font-family: inherit;
    font-size: 13.5px;
    resize: vertical;
  }
  .share-steps {
    font-size: 12px;
    color: #4a5a4f;
    line-height: 1.5;
    background: #F4FAF6;
    border-radius: 8px;
    padding: 8px 10px;
  }
  a.share-wa-link {
    display: block;
    text-align: center;
    background: var(--whatsapp);
    color: #fff !important;
    text-decoration: none;
    padding: 12px 14px;
    border-radius: 8px;
    font-size: 14.5px;
    font-weight: 700;
  }

  /* ================= Triagens salvas no celular ================= */
  #savedArea { position: fixed; inset: 0; z-index: 70; overflow-y: auto; background: var(--cream); color: var(--ink); display: none; }
  #savedArea.open { display: block; }
  .sv-top { position: sticky; top: 0; z-index: 3; display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--green); color: #fff; padding: 12px 16px; }
  .sv-top h2 { font-size: 15px; margin: 0; font-weight: 700; }
  .sv-top button { background: rgba(255,255,255,0.14); color: #fff; border: 1px solid rgba(255,255,255,0.45); border-radius: 8px; padding: 7px 11px; font-size: 13px; cursor: pointer; font-family: inherit; }
  .sv-wrap { max-width: 560px; margin: 0 auto; padding: 12px 16px 56px; }
  .sv-sum { font-size: 14px; padding: 6px 2px; }
  .sv-sync { width: 100%; margin-top: 8px; background: var(--green); color: #fff; border: none; border-radius: 8px; padding: 12px; font-size: 14.5px; font-weight: 600; cursor: pointer; font-family: inherit; }
  .sv-sync:disabled { opacity: 0.6; }
  .sv-note { font-size: 13px; color: #6b6156; margin-top: 10px; line-height: 1.45; }
  .sv-item { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-top: 10px; }
  .sv-main { display: flex; flex-direction: column; gap: 2px; min-width: 0; font-size: 13px; color: #6b6156; }
  .sv-main strong { font-size: 14.5px; color: var(--ink); overflow-wrap: anywhere; }
  .sv-chip { flex: none; font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 20px; }
  .sv-pdfs { display: flex; flex-wrap: wrap; gap: 6px; flex-basis: 100%; }
  .sv-pdfs button { background: var(--blue); color: #fff; border: none; border-radius: 8px; padding: 8px 12px; font-size: 13px; cursor: pointer; font-family: inherit; }
  .sv-item { flex-wrap: wrap; }
  .sv-chip.ok { background: var(--green-light); color: var(--green); }
  .sv-chip.wait { background: #FBF0E2; color: var(--ochre-dark); }

  /* ================= Área restrita — painel de gráficos ================= */
  #adminArea {
    --viz-surface: #ffffff;
    --viz-page: #f6f5f1;
    --viz-text-1: #0b0b0b;
    --viz-text-2: #52514e;
    --viz-text-3: #7d7b75;
    --viz-grid: #e7e5df;
    --viz-track: #f0efec;
    --viz-1: #2a78d6;
    --st-good: #0ca30c; --st-warn: #fab219; --st-serious: #ec835a; --st-critical: #d03b3b;
    position: fixed; inset: 0; z-index: 60; overflow-y: auto;
    background: var(--viz-page); color: var(--viz-text-1);
    display: none;
  }
  #adminArea.open { display: block; }
  body.admin-open { overflow: hidden; }
  .adm-top {
    position: sticky; top: 0; z-index: 3;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    background: var(--green); color: #fff; padding: 12px 16px;
  }
  .adm-top h2 { font-size: 15.5px; margin: 0; font-weight: 700; }
  .adm-top button {
    background: rgba(255,255,255,0.14); color: #fff; border: 1px solid rgba(255,255,255,0.45);
    border-radius: 8px; padding: 7px 11px; font-size: 13px; cursor: pointer; white-space: nowrap; font-family: inherit;
  }
  .adm-wrap { max-width: 760px; margin: 0 auto; padding: 4px 16px 56px; }
  .adm-card { background: var(--viz-surface); border: 1px solid var(--viz-grid); border-radius: 12px; padding: 14px; margin-top: 12px; }
  .adm-card h3 { font-size: 15px; margin: 0 0 3px; color: var(--viz-text-1); font-weight: 700; }

<style id="theme3">

  /* ================= TEMA v3 — Mavi+ azul e laranja ================= */
  :root {
    --navy: #0B3A6B; --navy-d: #072A50; --blue: #1A5FA8; --sky: #EEF4FB; --sky-2: #DCE9F7;
    --orange: #F28C28; --orange-d: #C96A0A; --orange-l: #FFF3E3;
    --ochre: #F28C28; --ochre-dark: #C96A0A; --green: #0B3A6B; --green-light: #E3EEF9;
    --cream: #EEF4FB; --ink: #10243C; --line: #D3E0EE; --muted: #5B6F86;
    --ok: #2E9E5B; --warn: #E0A100; --alert: #D03B3B;
    --shadow: 0 8px 24px rgba(11, 58, 107, .10);
  }
  body { background: linear-gradient(180deg, #EEF4FB 0%, #E3EDF8 100%); color: var(--ink); font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif; padding-bottom: 110px; min-height: 100vh; }
  .toolbar { max-width: none; margin: 0; padding: 7px 10px; background: #06284A; justify-content: center; flex-wrap: wrap; gap: 6px; }
  .toolbar .clear-link { color: #D5E6F8; text-decoration: none; font-size: 12.5px; background: rgba(255,255,255,.09); border: 1px solid rgba(255,255,255,.22); border-radius: 999px; padding: 6px 12px; }
  .toolbar .clear-link.armed { color: #fff !important; background: var(--alert); border-color: var(--alert); }
  header.hero { background: #06324F; padding: 0; text-align: center; line-height: 0; }
  header.hero img { display: block; width: 100%; max-width: 640px; height: auto; margin: 0 auto; }
  header.hero #offlineBadge { line-height: 1.3; margin: 0 0 8px; color: #fff; }

  .progress-wrap { max-width: 592px; margin: -8px auto 0; background: #fff; border: 0; border-radius: 26px 26px 0 0; padding: 18px 20px 12px; box-shadow: none; top: 0; }
  .pw-row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .progress-label { margin: 0; font-size: 14px; font-weight: 800; letter-spacing: .02em; color: var(--navy); text-transform: uppercase; }
  .progress-count { font-size: 12.5px; color: var(--muted); font-weight: 600; }
  .progress-bar { height: 8px; border-radius: 6px; background: #DCE5EF; margin-top: 10px; }
  .progress-fill { background: linear-gradient(90deg, var(--navy), var(--blue)); border-radius: 6px; }
  main { display: flow-root; max-width: 592px; margin: 0 auto; background: #fff; padding: 0 20px 28px; border-radius: 0 0 26px 26px; box-shadow: 0 16px 24px -14px rgba(11,58,107,.16); }
  .page { display: none; animation: pg .22s ease; }
  .page.active { display: block; }
  @keyframes pg { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .page { padding-top: 1px; }
  .block-head { margin: 13px 0 4px; }
  .block-head .block-num { display: none; }
  .block-head .section-title { margin: 0; font-size: 20px; letter-spacing: 0; text-transform: none; color: var(--navy); border: 0; padding: 0; font-weight: 800; }
  .block-head .section-title::after { content: ''; display: block; width: 44px; height: 4px; border-radius: 3px; background: var(--orange); margin-top: 8px; }
  .block-head.alert .section-title { color: var(--alert); }
  .block-head.alert .section-title::after { background: var(--alert); }
  .block-head .section-sub { font-size: 13px; color: var(--muted); margin-top: 10px; }
  .block-head.alert .section-sub { background: #FDECEC; border-left: 4px solid var(--alert); color: #6A1F1F; }
  .question, .name-field { background: none; border: 0; border-radius: 0; padding: 0; margin-top: 22px; }
  .name-field { margin-top: 16px; }
  .question.optional { border: 0; }
  .question .qnum, .name-field .qnum { font-size: 22px; font-weight: 800; color: var(--orange); letter-spacing: 0; text-transform: none; line-height: 1; }
  .question .qnum.extra { color: var(--blue); }
  .opt-tag { font-size: 12px; font-weight: 600; color: var(--muted); }
  .question h3, .name-field h3 { font-size: 17.5px; line-height: 1.3; margin: 6px 0 12px; font-weight: 800; color: #0B1B2E; }
  .q-hint { color: var(--muted); }
  .options { gap: 10px; }
  .options.two { display: grid; grid-template-columns: 1fr 1fr; }

function bmiOf(a) {

  if (alt < 3) alt = alt * 100; // aceita 1,65

  if (f.hasHAS) crWhy.push('pressão alta: exame de rotina da avaliação inicial');
  if (f.dm) crWhy.push('diabetes');
  if (f.cvd) crWhy.push('doença do coração já conhecida');
  if (crWhy.length) add('cr', 'lab', 'Creatinina com taxa de filtração glomerular estimada', crWhy, f.hasHAS ? ['HAS20', 'KDIGO'] : ['KDIGO', 'CCS24']);

  // ---- Fígado: TGO e TGP ----
  const tgWhy = [], tgRefs = [];
  if (lipWhy.length) { tgWhy.push('perfil lipídico solicitado: avaliação basal das enzimas hepáticas antes e durante o uso de estatina'); tgRefs.push('DYSL19'); }
  if (f.fatty) tgWhy.push('gordura no fígado já informada');
  if (f.dm) tgWhy.push('diabetes');
  if (f.obese) tgWhy.push('obesidade');
  if (f.alc) tgWhy.push('álcool mais de 2 vezes por semana');
  if (f.fatty || f.dm || f.obese || f.alc) tgRefs.push('MASLD24');
  if (tgWhy.length) add('tgo', 'lab', 'TGO e TGP (AST e ALT)', tgWhy, tgRefs);

  if (f.hasHAS) add('k', 'lab', 'Potássio e ácido úrico', ['pressão alta: exames de rotina da avaliação inicial'], ['HAS20']);

  // ---- Opcionais (falta de ar): vêm desmarcados ----
  if (f.dysp) {
    add('bnp', 'lab', 'NT-proBNP (opcional: se houver suspeita de insuficiência cardíaca)', ['falta de ar fora do normal'], ['HF21'], true);
    add('hemo', 'lab', 'Hemograma completo (opcional)', ['falta de ar fora do normal'], ['HF21', 'CCS24'], true);
  }
  // ---- Outros exames cardíacos (opcionais: vêm desmarcados) ----
  const lpaWhy = [];
  if (f.fam) lpaWhy.push('infarto ou AVC em parente próximo');
  if (f.cvd) lpaWhy.push('doença do coração já conhecida');
  if (f.colHigh) lpaWhy.push('colesterol alto já informado');
  if (lpaWhy.length) add('lpa', 'lab', 'Lipoproteína(a) (opcional: dosar ao menos uma vez na vida)', lpaWhy, ['LPA22', 'DYSL19'], true);
  const abWhy = [];
  if (f.dm) abWhy.push('diabetes');
  if (f.obese) abWhy.push('obesidade');
  if (f.colHigh) abWhy.push('colesterol alto já informado');
  if (f.cvd) abWhy.push('doença do coração já conhecida');
  if (abWhy.length) add('apob', 'lab', 'Apolipoproteína B (opcional)', abWhy, ['DYSL19'], true);
  const pcWhy = [];
  if (f.age40) {
    if (f.hasHAS) pcWhy.push('pressão alta');
    if (f.smoke) pcWhy.push('fumo');
    if (f.over) pcWhy.push('sobrepeso ou obesidade');
    if (f.fam) pcWhy.push('infarto ou AVC em parente próximo');
    if (f.colHigh) pcWhy.push('colesterol alto já informado');
  }
  if (pcWhy.length) add('pcrus', 'lab', 'Proteína C reativa ultrassensível (opcional)', pcWhy.map(w => '40 anos ou mais com ' + w), ['CRP03'], true);
  if (f.dysp || f.cvd) add('echo', 'card', 'Ecocardiograma transtorácico (opcional)', [f.dysp ? 'falta de ar fora do normal' : null, f.cvd ? 'doença do coração já conhecida' : null].filter(Boolean), (f.dysp ? ['HF21'] : []).concat(f.cvd ? ['CCS24'] : []), true);
  if (f.chest) add('ergo', 'card', 'Teste ergométrico (opcional)', ['dor ou aperto no peito aos esforços'], ['CCS24'], true);

  if (f.dysp || f.palp) add('tsh', 'lab', 'TSH (opcional: função da tireoide)', [f.dysp ? 'falta de ar fora do normal' : null, f.palp ? 'coração disparado ou descompassado' : null].filter(Boolean), (f.dysp ? ['HF21'] : []).concat(f.palp ? ['AF24'] : []), true);

  if (f.ctrlLate) ['lip', 'gli', 'cr'].forEach(id => {
    const e = list.find(x => x.id === id);
    if (e && !e.why.includes('exames de controle atrasados com uso diário de remédio')) e.why.push('exames de controle atrasados com uso diário de remédio');
  });

  return list;
}

function examNoteHTML(list) {
  if (list.some(x => x.type === 'ecg')) return '';
  return 'Pelas respostas, não há indicação de eletrocardiograma. Em adulto sem sintomas e com baixo risco, o eletrocardiograma de rotina não é recomendado (USPSTF 2018).';
}
function examIncluded(list) { return list.filter(x => !EXAM_OFF[x.id]); }
function examRefKeys(list) {
  const keys = [];
  list.forEach(x => x.refs.forEach(r => { if (!keys.includes(r)) keys.push(r); }));
  if (!list.some(x => x.type === 'ecg') && !keys.includes('USPSTF18')) keys.push('USPSTF18');
  return keys;
}
function examWhyText(x, keys) {

}
function examTag(x) { return x.type === 'ecg' ? 'ECG' : x.type === 'card' ? 'CARDÍACO' : 'LABORATÓRIO'; }

function examsHTML() {

function pdfExams(pdf, flow) {
  const all = examSuggestions();

}

function optionHTML(it, j, label) {

function itemHTML(it) {

  let body;
  const txtHTML = it.text ? `<div class="conditional-field${textVisible(it) ? ' show' : ''}" data-textwrap="${it.id}">
        <label for="txt_${it.id}">${it.text.label}</label>
        <input type="text" id="txt_${it.id}" data-txt="${it.id}" placeholder="${it.text.ph || ''}"${it.text.numeric ? ' inputmode="decimal"' : ''} maxlength="${it.text.numeric ? 20 : 200}" autocomplete="off">
      </div>` : '';

    body = txtHTML;
  } else if (it.type === 'bmi') {

}

function syncTextDom() {
  ITEMS.forEach(it => {
    if (!it.text) return;
    const wrap = document.querySelector(`[data-textwrap="${it.id}"]`);
    if (wrap) wrap.classList.toggle('show', textVisible(it));
    const inp = document.getElementById('txt_' + it.id);
    if (inp && document.activeElement !== inp) inp.value = TXT[it.id] || '';
  });
}
function syncItemDom(id) {
  const it = ITEM[id];
  if (!it || it.type === 'bmi' || it.type === 'text') return;
  const a = ANS[id];
  document.querySelectorAll(`.option[data-q="${id}"]`).forEach(opt => {
    const j = +opt.dataset.oi;
    const on = it.type === 'multi' ? (Array.isArray(a) && a.includes(j)) : a === j;
    opt.classList.toggle('selected', on);
    const inp = opt.querySelector('input'); if (inp) inp.checked = on;
  });
}

function syncBmiDom() {
  const a = ANS.P3 || {};
  const p = document.getElementById('bmiPeso'), h = document.getElementById('bmiAltura'), ns = document.getElementById('bmiNs');
  if (!p) return;
  if (document.activeElement !== p) p.value = a.peso || '';
  if (document.activeElement !== h) h.value = a.altura || '';
  ns.checked = !!a.ns;
  ns.closest('.option').classList.toggle('selected', !!a.ns);
  p.disabled = h.disabled = !!a.ns;
  const out = document.getElementById('bmiOut');
  const b = bmiOf(a);
  if (a.ns) out.textContent = 'Sem peso: a tela vai sugerir medir na coleta.';
  else if (b !== null) out.textContent = bmiText(a).split(' · ').pop();
  else if (a.peso || a.altura) out.textContent = 'Preencha peso (20 a 300 kg) e altura (100 a 230 cm).';
  else out.textContent = '';
}

function updateVisibility() {
  ITEMS.forEach(it => {
    if (!it.showIf) return;
    const vis = isVisible(it);
    const el = document.querySelector(`[data-qwrap="${it.id}"]`);
    if (el) el.classList.toggle('is-hidden', !vis);
    if (!vis && ANS[it.id] !== undefined) { delete ANS[it.id]; syncItemDom(it.id); }
  });
  ITEMS.forEach(it => { if (it.text && !textVisible(it) && TXT[it.id]) delete TXT[it.id]; });
  syncTextDom();
}

// Delegação de eventos (registrada uma vez só)
formArea.addEventListener('click', (e) => {
  const opt = e.target.closest('.option[data-q]');
  if (!opt) return;
  e.preventDefault();
  const id = opt.dataset.q, oi = +opt.dataset.oi, it = ITEM[id];
  if (it.type === 'multi') {
    const NONE = it.opts.length - 1;
    let arr = Array.isArray(ANS[id]) ? ANS[id].slice() : [];
    if (arr.includes(oi)) arr = arr.filter(x => x !== oi);
    else if (oi === NONE) arr = [NONE];
    else { arr = arr.filter(x => x !== NONE); arr.push(oi); arr.sort((x, y) => x - y); }
    ANS[id] = arr;
  } else {
    ANS[id] = oi;
  }
  syncItemDom(id);
  updateVisibility();
  updateProgress();
  saveDraft();
});
// Caixas de autorização: marcar/desmarcar livremente (toque no quadrado ou no texto)
formArea.addEventListener('click', (e) => {
  const row = e.target.closest('.consent-row');
  if (!row) return;
  const box = row.querySelector('input[type=checkbox]');
  if (!box || e.target === box) return;
  e.preventDefault();
  box.checked = !box.checked;
  box.dispatchEvent(new Event('change', { bubbles: true }));
});
formArea.addEventListener('input', (e) => {
  const t = e.target;
  if (t.id === 'bmiPeso' || t.id === 'bmiAltura') {
    const a = Object.assign({}, ANS.P3 || {});
    a[t.id === 'bmiPeso' ? 'peso' : 'altura'] = t.value.trim();
    a.ns = false;
    ANS.P3 = a;
    syncBmiDom();
  }
  if (t.dataset && t.dataset.txt) { TXT[t.dataset.txt] = t.value; updateProgress(); saveDraft(); }
  if (['respondentName', 'respondentPhone', 'respondentCity', 'bmiPeso', 'bmiAltura'].includes(t.id)) { updateProgress(); saveDraft(); }
});
formArea.addEventListener('change', (e) => {
  const t = e.target;
  if (t.id === 'bmiNs') {
    ANS.P3 = t.checked ? { ns: true } : {};
    syncBmiDom();
  }
  if (['bmiNs', 'respondentCity', 'consentCheck', 'consentContact'].includes(t.id)) { updateProgress(); saveDraft(); }
});

// ---------------- Progresso / validação ----------------
function requiredItems() { return ITEMS.filter(it => !it.optional && isVisible(it)); }

// ---------------- Perguntas em blocos (uma página por bloco) ----------------
const PAGE_N = FORM.length + 1;           // página 0 = identificação; depois um bloco por página
let curPage = 0;
const backBtn = document.getElementById('backBtn');
const progressCount = document.getElementById('progressCount');
function pageComplete(p) {
  if (p === 0) return !!(idVal('respondentName') && idVal('respondentPhone') && isChecked('consentCheck'));
  return FORM[p - 1].items.every(it => it.optional || !isVisible(it) || isAnswered(it));
}
function allComplete() { for (let p = 0; p < PAGE_N; p++) if (!pageComplete(p)) return false; return true; }
function firstIncomplete() { for (let p = 0; p < PAGE_N; p++) if (!pageComplete(p)) return p; return -1; }
function updateNav() {
  const last = curPage === PAGE_N - 1;
  calcBtn.textContent = last ? 'Ver resultado' : 'Próximo bloco';
  backBtn.hidden = curPage === 0;
  const ok = last ? allComplete() : pageComplete(curPage);
  calcBtn.classList.toggle('is-off', !ok);
}
function showPage(n) {
  curPage = Math.max(0, Math.min(PAGE_N - 1, n));
  document.querySelectorAll('#formArea .page').forEach(el => el.classList.toggle('active', +el.dataset.page === curPage));
  updateProgress();
  window.scrollTo(0, 0);
}
function updateProgress() {
  const req = requiredItems();
  const done = req.filter(isAnswered).length;
  progressFill.style.width = Math.round(done / req.length * 100) + '%';
  progressLabel.textContent = curPage === 0 ? 'Identificação' : `Perguntas · Bloco ${curPage} de ${FORM.length}`;
  progressCount.textContent = `${done} de ${req.length} respondidas`;
  updateNav();
}
let toastT;
function toast(msg) {
  let el = document.getElementById('toast');
  if (!el) {
    el = document.createElement('div'); el.id = 'toast'; el.setAttribute('role', 'status');
    el.style.cssText = 'position:fixed;left:50%;bottom:96px;transform:translateX(-50%);max-width:88vw;background:#10243C;color:#fff;padding:11px 18px;border-radius:14px;font-size:14px;font-weight:600;z-index:80;box-shadow:0 8px 20px rgba(0,0,0,.25);text-align:center;transition:opacity .2s;';
    document.body.appendChild(el);
  }
  el.textContent = msg; el.style.opacity = '1'; el.style.display = 'block';
  clearTimeout(toastT);
  toastT = setTimeout(() => { el.style.opacity = '0'; setTimeout(() => { el.style.display = 'none'; }, 220); }, 2800);
}
function flagMissing(p) {
  const page = document.querySelector(`#formArea .page[data-page="${p}"]`);
  if (!page) return;
  let target = null;
  if (p === 0) {
    if (!idVal('respondentName')) target = document.getElementById('respondentName');
    else if (!idVal('respondentPhone')) target = document.getElementById('respondentPhone');
    else target = document.querySelector('label[for="consentCheck"]');
    toast(!isChecked('consentCheck') && idVal('respondentName') && idVal('respondentPhone') ? 'Marque a autorização para continuar.' : 'Preencha nome, telefone e a autorização para continuar.');
  } else {
    const it = FORM[p - 1].items.find(x => !x.optional && isVisible(x) && !isAnswered(x));
    if (it) target = page.querySelector(`[data-qwrap="${it.id}"]`);
    toast('Responda a pergunta destacada para continuar.');
  }
  if (target) {
    target.scrollIntoView({ block: 'center', behavior: 'smooth' });
    const box = target.closest('.question') || target.closest('.id-row') || target;
    box.classList.remove('page-shake'); void box.offsetWidth; box.classList.add('page-shake');
    if (target.focus && /^(INPUT|SELECT|TEXTAREA)$/.test(target.tagName)) { try { target.focus({ preventScroll: true }); } catch (e) {} }
  }
}

calcBtn.addEventListener('click', () => {
  if (curPage < PAGE_N - 1) {
    if (pageComplete(curPage)) showPage(curPage + 1); else flagMissing(curPage);
    return;
  }
  if (allComplete()) { showResult(computeScore()); return; }
  const p = firstIncomplete();
  if (p >= 0 && p !== curPage) { showPage(p); setTimeout(() => flagMissing(p), 60); } else if (p >= 0) flagMissing(p);
});

// Fica salvo apenas neste aparelho/navegador, para não perder o preenchimento

function saveDraft() {
  try {
    const draft = {
      v: 2,
      name: idVal('respondentName'),
      phone: idVal('respondentPhone'),
      city: idVal('respondentCity'),
      consent: isChecked('consentCheck'),
      consentContact: isChecked('consentContact'),
      ans: ANS,
      txt: TXT,
      recordId: currentRecordId,
      recordCreatedAt: currentRecordCreatedAt,
      savedAt: new Date().toISOString(),
    };
    localStorage.setItem(DRAFT_KEY, JSON.stringify(draft));
  } catch (e) { /* localStorage indisponível — segue sem rascunho */ }
}

function restoreDraft() {
  let draft;
  try { draft = JSON.parse(localStorage.getItem(DRAFT_KEY) || 'null'); } catch (e) { draft = null; }
  if (!draft || draft.v !== 2) return;
  if (draft.name) document.getElementById('respondentName').value = draft.name;
  if (draft.phone) document.getElementById('respondentPhone').value = draft.phone;
  if (draft.city) document.getElementById('respondentCity').value = draft.city;
  if (draft.consent) document.getElementById('consentCheck').checked = true;
  if (draft.consentContact) document.getElementById('consentContact').checked = true;
  if (draft.recordId) { currentRecordId = draft.recordId; currentRecordCreatedAt = draft.recordCreatedAt || null; }
  if (draft.ans) Object.keys(draft.ans).forEach(k => { if (ITEM[k]) ANS[k] = draft.ans[k]; });
  if (draft.txt) Object.keys(draft.txt).forEach(k => { if (ITEM[k] && ITEM[k].text && typeof draft.txt[k] === 'string') TXT[k] = draft.txt[k].slice(0, 200); });
}

function docItemMarks(it) {
  const a = ANS[it.id];
  if (it.type === 'multi') return Array.isArray(a) && a.length ? a : -1;
  if (a === undefined || a === null) return -1;
  return a;
}
function blockTitleOf(id) { const b = FORM.find(x => x.id === id); return b ? b.title : ''; }
function itemsPrintHTML(items) {
  let html = '', lastBlock = null;
  items.forEach(it => {
    if (!isVisible(it)) return;
    if (it.block !== lastBlock) { html += `<div class="pw-section-h">${escapeHtml(blockTitleOf(it.block))}</div>`; lastBlock = it.block; }
    html += `<div class="pw-q"><div class="pw-qtext">${numOf(it)}. ${escapeHtml(it.q)}</div>`;
    if (it.type === 'text') {
      html += txtOf(it) ? `<div class="pw-opt marked">${escapeHtml(txtOf(it))}</div>` : `<div class="pw-not-answered">Não respondido</div>`;
    } else if (it.type === 'bmi') {
      html += `<div class="pw-opt marked">${escapeHtml(bmiText(ANS.P3))}</div>`;
    } else {
      const m = docItemMarks(it);
      if (m === -1) html += `<div class="pw-not-answered">Não respondido</div>`;
      else it.opts.forEach((opt, j) => {
        const on = Array.isArray(m) ? m.includes(j) : m === j;
        html += `<div class="pw-opt ${on ? 'marked' : ''}">${on ? '☒' : '☐'} ${escapeHtml(opt)}</div>`;
      });
      if (it.text && txtOf(it)) html += `<div class="pw-opt marked">${escapeHtml(it.text.label)} ${escapeHtml(txtOf(it))}</div>`;
    }
    html += `</div>`;
  });
  return html;
}

// Gera o documento como um link de verdade (não window.open / não script abrindo
// janela) — em alguns navegadores e configurações do Android, chamadas de script
// para abrir janelas são bloqueadas de forma TOTALMENTE silenciosa, sem erro
// algum para capturar. Um <a> real, tocado pelo próprio usuário, é o único
// mecanismo que o navegador nunca intercepta dessa forma: é a mesma coisa que
// tocar em qualquer link de uma página.
//
// Também evitamos depender de alert() para avisos: em alguns navegadores dentro
// de apps (WebViews) o alert() pode não aparecer. Em vez disso, o status é

const CP1252_EXTRA = { 0x20AC:0x80, 0x201A:0x82, 0x0192:0x83, 0x201E:0x84, 0x2026:0x85, 0x2020:0x86, 0x2021:0x87, 0x02C6:0x88, 0x2030:0x89, 0x0160:0x8A, 0x2039:0x8B, 0x0152:0x8C, 0x017D:0x8E, 0x2018:0x91, 0x2019:0x92, 0x201C:0x93, 0x201D:0x94, 0x2022:0x95, 0x2013:0x96, 0x2014:0x97, 0x02DC:0x98, 0x2122:0x99, 0x0161:0x9A, 0x203A:0x9B, 0x0153:0x9C, 0x017E:0x9E, 0x0178:0x9F };
const PDF_REPLACE = { '≥': '>=', '≤': '<=', '✓': 'v', '☒': 'X', '☐': '' };

function pdfEnc(str) {
  let out = '';
  for (const ch of String(str)) {
    if (PDF_REPLACE[ch] !== undefined) { out += PDF_REPLACE[ch]; continue; }
    const c = ch.codePointAt(0);
    if (c === 9 || c === 10 || c === 13) { out += ' '; continue; }
    if (c >= 32 && c < 127) { out += ch; continue; }
    if (c >= 0xA0 && c <= 0xFF) { out += String.fromCharCode(c); continue; }
    if (CP1252_EXTRA[c]) { out += String.fromCharCode(CP1252_EXTRA[c]); continue; }
    if (c >= 0x1F000 || (c >= 0x2600 && c <= 0x27BF) || c === 0xFE0F || c === 0x200D) continue; // emojis
    out += '?';
  }
  return out;
}
function pdfEsc(s) { return s.replace(/\\/g, '\\\\').replace(/\(/g, '\\(').replace(/\)/g, '\\)'); }
function pdfTextWidth(encoded, font, size) {
  const tbl = PDF_WIDTHS[font];
  let w = 0;
  for (let i = 0; i < encoded.length; i++) {
    const c = encoded.charCodeAt(i);
    w += (c >= 32 && c <= 255 ? (tbl[c - 32] || 556) : 556);
  }
  return w * size / 1000;
}
function pdfWrap(text, font, size, maxW) {
  const lines = [];
  String(text).split(/\n/).forEach(par => {
    const words = pdfEnc(par).split(' ').filter(w => w.length);
    let line = '';
    words.forEach(word => {
      const tryLine = line ? line + ' ' + word : word;
      if (pdfTextWidth(tryLine, font, size) <= maxW) { line = tryLine; return; }
      if (line) lines.push(line);
      // palavra maior que a linha: quebra por caracteres
      let rest = word;
      while (pdfTextWidth(rest, font, size) > maxW) {
        let k = rest.length;
        while (k > 1 && pdfTextWidth(rest.slice(0, k), font, size) > maxW) k--;
        lines.push(rest.slice(0, k)); rest = rest.slice(k);
      }
      line = rest;
    });
    lines.push(line);
  });
  return lines;
}

class MiniPDF {
  constructor() {
    this.W = 595.28; this.H = 841.89;
    this.pages = []; this.images = {}; this.meta = null;
    this.newPage();
  }
  newPage() { this.cur = []; this.pages.push(this.cur); }
  n(v) { return (Math.round(v * 100) / 100).toString(); }
  rgb(c) { return c.map(v => this.n(v / 255)).join(' '); }
  textEnc(x, y, enc, font, size, color) {
    this.cur.push(`BT /${font} ${this.n(size)} Tf ${this.rgb(color || [0, 0, 0])} rg ${this.n(x)} ${this.n(this.H - y)} Td (${pdfEsc(enc)}) Tj ET`);
  }
  text(x, y, str, font, size, color) { this.textEnc(x, y, pdfEnc(str), font, size, color); }
  rect(x, y, w, h, o) {
    const ops = [];
    if (o.fill) ops.push(`${this.rgb(o.fill)} rg`);
    if (o.stroke) ops.push(`${this.rgb(o.stroke)} RG ${this.n(o.lw || 1)} w`);
    ops.push(`${this.n(x)} ${this.n(this.H - y - h)} ${this.n(w)} ${this.n(h)} re ${o.fill && o.stroke ? 'B' : o.fill ? 'f' : 'S'}`);
    this.cur.push('q ' + ops.join(' ') + ' Q');
  }
  line(x1, y1, x2, y2, color, lw) {
    this.cur.push(`q ${this.rgb(color)} RG ${this.n(lw || 1)} w ${this.n(x1)} ${this.n(this.H - y1)} m ${this.n(x2)} ${this.n(this.H - y2)} l S Q`);
  }
  addImage(name, img) { this.images[name] = img; }
  image(name, x, y, w, h) {
    this.cur.push(`q ${this.n(w)} 0 0 ${this.n(h)} ${this.n(x)} ${this.n(this.H - y - h)} cm /${name} Do Q`);
  }
  output() {
    const objs = [];
    const add = (s) => { objs.push(s); return objs.length; };
    const catalog = add(null), pagesObj = add(null);
    const fonts = {
      F1: add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>'),
      F2: add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>'),
      F3: add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Oblique /Encoding /WinAnsiEncoding >>'),
    };
    const imgRefs = {};
    Object.entries(this.images).forEach(([name, img]) => {
      const bin = atob(img.b64);
      imgRefs[name] = add(`<< /Type /XObject /Subtype /Image /Width ${img.w} /Height ${img.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${bin.length} >>\nstream\n${bin}\nendstream`);
    });
    const fontRes = Object.entries(fonts).map(([k, v]) => `/${k} ${v} 0 R`).join(' ');
    const imgRes = Object.entries(imgRefs).map(([k, v]) => `/${k} ${v} 0 R`).join(' ');
    const kids = [];
    this.pages.forEach(ops => {
      const content = ops.join('\n');
      const c = add(`<< /Length ${content.length} >>\nstream\n${content}\nendstream`);
      kids.push(add(`<< /Type /Page /Parent ${pagesObj} 0 R /MediaBox [0 0 ${this.n(this.W)} ${this.n(this.H)}] /Resources << /Font << ${fontRes} >> /XObject << ${imgRes} >> >> /Contents ${c} 0 R >>`));
    });
    const infoRef = this.meta ? add(`<< /Producer (MAVI Triagem) /Keywords (${this.meta}) >>`) : 0;
    objs[catalog - 1] = `<< /Type /Catalog /Pages ${pagesObj} 0 R >>`;
    objs[pagesObj - 1] = `<< /Type /Pages /Kids [${kids.map(k => k + ' 0 R').join(' ')}] /Count ${kids.length} >>`;
    let out = '%PDF-1.4\n%\xE2\xE3\xCF\xD3\n';
    const offsets = [];
    objs.forEach((o, i) => { offsets.push(out.length); out += `${i + 1} 0 obj\n${o}\nendobj\n`; });
    const xref = out.length;
    out += `xref\n0 ${objs.length + 1}\n0000000000 65535 f \n` + offsets.map(o => String(o).padStart(10, '0') + ' 00000 n \n').join('');
    out += `trailer\n<< /Size ${objs.length + 1} /Root ${catalog} 0 R${infoRef ? ` /Info ${infoRef} 0 R` : ''} >>\nstartxref\n${xref}\n%%EOF\n`;
    const bytes = new Uint8Array(out.length);
    for (let i = 0; i < out.length; i++) bytes[i] = out.charCodeAt(i) & 0xFF;
    return bytes;
  }
}

const PDF_C = { ink: [16, 36, 60], gray: [80, 96, 118], light: [120, 135, 155], green: [11, 58, 107], red: [201, 48, 44], cream: [238, 245, 252], line: [205, 218, 232], orange: [242, 140, 40], blue: [26, 95, 168] };
const PDF_M = { left: 42, right: 42, top: 42, bottom: 60 };

class PdfFlow {
  constructor(pdf) { this.pdf = pdf; this.y = PDF_M.top; this.x = PDF_M.left; this.w = pdf.W - PDF_M.left - PDF_M.right; }
  space(h) { if (this.y + h > this.pdf.H - PDF_M.bottom) { this.pdf.newPage(); this.pdf.pageChrome(); this.y = 50; } }
  para(text, o = {}) {
    const font = o.font || 'F1', size = o.size || 10, lh = size * (o.lh || 1.35), indent = o.indent || 0;
    pdfWrap(text, font, size, this.w - indent).forEach(l => {
      this.space(lh);
      this.pdf.textEnc(this.x + indent, this.y + size, l, font, size, o.color || PDF_C.ink);
      this.y += lh;
    });
  }
  gap(h) { this.y += h; }
}

// ---- Primitivas extras (cantos arredondados, círculo, faixa de topo) ----
MiniPDF.prototype.paintPath = function (p, o) {
  const ops = [];
  if (o.fill) ops.push(`${this.rgb(o.fill)} rg`);
  if (o.stroke) ops.push(`${this.rgb(o.stroke)} RG ${this.n(o.lw || 1)} w`);
  ops.push(p.join(' '));
  ops.push(o.fill && o.stroke ? 'B' : o.fill ? 'f' : 'S');
  this.cur.push('q ' + ops.join(' ') + ' Q');
};
MiniPDF.prototype.rrect = function (x, y, w, h, r, o) {
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  const k = 0.5523 * r, n = v => this.n(v);
  const X0 = x, X1 = x + w, Y0 = this.H - y, Y1 = this.H - y - h;
  this.paintPath([
    `${n(X0 + r)} ${n(Y0)} m`, `${n(X1 - r)} ${n(Y0)} l`,
    `${n(X1 - r + k)} ${n(Y0)} ${n(X1)} ${n(Y0 - r + k)} ${n(X1)} ${n(Y0 - r)} c`,
    `${n(X1)} ${n(Y1 + r)} l`,
    `${n(X1)} ${n(Y1 + r - k)} ${n(X1 - r + k)} ${n(Y1)} ${n(X1 - r)} ${n(Y1)} c`,
    `${n(X0 + r)} ${n(Y1)} l`,
    `${n(X0 + r - k)} ${n(Y1)} ${n(X0)} ${n(Y1 + r - k)} ${n(X0)} ${n(Y1 + r)} c`,
    `${n(X0)} ${n(Y0 - r)} l`,
    `${n(X0)} ${n(Y0 - r + k)} ${n(X0 + r - k)} ${n(Y0)} ${n(X0 + r)} ${n(Y0)} c h`,
  ], o);
};
MiniPDF.prototype.circle = function (cx, cy, r, o) {
  const k = 0.5523 * r, n = v => this.n(v), X = cx, Y = this.H - cy;
  this.paintPath([
    `${n(X + r)} ${n(Y)} m`,
    `${n(X + r)} ${n(Y + k)} ${n(X + k)} ${n(Y + r)} ${n(X)} ${n(Y + r)} c`,
    `${n(X - k)} ${n(Y + r)} ${n(X - r)} ${n(Y + k)} ${n(X - r)} ${n(Y)} c`,
    `${n(X - r)} ${n(Y - k)} ${n(X - k)} ${n(Y - r)} ${n(X)} ${n(Y - r)} c`,
    `${n(X + k)} ${n(Y - r)} ${n(X + r)} ${n(Y - k)} ${n(X + r)} ${n(Y)} c h`,
  ], o);
};
// Imagem de largura total, presa ao topo da página e cortada na altura bh.
MiniPDF.prototype.bannerImage = function (name, img, bh) {
  const ih = this.W * img.h / img.w;
  this.cur.push(`q 0 ${this.n(this.H - bh)} ${this.n(this.W)} ${this.n(bh)} re W n ${this.n(this.W)} 0 0 ${this.n(ih)} 0 ${this.n(this.H - ih)} cm /${name} Do Q`);
};
// Faixa fina no topo das páginas seguintes.
MiniPDF.prototype.pageChrome = function () {
  if (!this.titleTxt) return;
  this.rect(0, 0, this.W, 28, { fill: PDF_C.green });
  this.rect(0, 28, this.W, 2.2, { fill: PDF_C.orange });
  this.text(PDF_M.left, 18.5, 'Mavi', 'F2', 11, [255, 255, 255]);
  this.text(PDF_M.left + pdfTextWidth('Mavi', 'F2', 11) + 1, 18.5, '+', 'F2', 11, PDF_C.orange);
  const t = pdfEnc(this.titleTxt);
  this.textEnc(this.W - PDF_M.right - pdfTextWidth(t, 'F1', 8.5), 17.5, t, 'F1', 8.5, [214, 228, 245]);
};
const PDF_BANNER_H = 168;

function pdfMetaBox(pdf, flow, rows) {
  const size = 9.5, lh = 13.5, pad = 11;
  const lines = [];
  rows.forEach(([label, value]) => {
    const lab = pdfEnc(label + ': ');
    const lw = pdfTextWidth(lab, 'F2', size);
    const wrapped = pdfWrap(value, 'F1', size, flow.w - 2 * pad - lw - 4);
    wrapped.forEach((l, i) => lines.push({ lab: i === 0 ? lab : '', lw, val: l }));
  });
  const h = lines.length * lh + 2 * pad - 3;
  flow.space(h);
  pdf.rrect(flow.x, flow.y, flow.w, h, 9, { fill: PDF_C.cream, stroke: PDF_C.line, lw: 0.8 });

}

// Bloco de pergunta: mantém pergunta + alternativas juntas na mesma página.
function pdfQuestion(pdf, flow, qtext, opts, markedIdx, extraLines) {
  const qSize = 10, oSize = 9.5, qlh = 13, olh = 13;
  const qLines = pdfWrap(qtext, 'F2', qSize, flow.w);
  const isMarked = j => Array.isArray(markedIdx) ? markedIdx.includes(j) : j === markedIdx;
  const optLines = opts.map((o, j) => pdfWrap(o, isMarked(j) ? 'F2' : 'F1', oSize, flow.w - 22));
  const extra = (extraLines || []).map(t => pdfWrap(t, 'F3', oSize, flow.w - 6));
  const notAnswered = markedIdx === -1;
  const h = qLines.length * qlh + (notAnswered ? olh : optLines.reduce((a, l) => a + l.length * olh, 0)) + extra.reduce((a, l) => a + l.length * olh, 0) + 8;
  flow.space(Math.min(h, pdf.H - PDF_M.top - PDF_M.bottom));
  qLines.forEach(l => { flow.space(qlh); pdf.textEnc(flow.x, flow.y + qSize, l, 'F2', qSize, PDF_C.ink); flow.y += qlh; });
  flow.y += 2;
  if (notAnswered) {
    flow.space(olh);
    pdf.text(flow.x + 4, flow.y + oSize, 'Não respondido', 'F3', oSize, PDF_C.red);
    flow.y += olh;
  } else {
    optLines.forEach((ls, j) => {
      const marked = isMarked(j);
      ls.forEach((l, k) => {
        flow.space(olh);
        if (k === 0) {
          const cx = flow.x + 8, cy = flow.y + 6.2;
          if (marked) { pdf.circle(cx, cy, 4.3, { fill: PDF_C.orange, stroke: PDF_C.orange, lw: 0.8 }); pdf.circle(cx, cy, 1.5, { fill: [255, 255, 255] }); }
          else pdf.circle(cx, cy, 4.3, { stroke: [150, 165, 188], lw: 0.9 });
        }
        pdf.textEnc(flow.x + 20, flow.y + oSize, l, marked ? 'F2' : 'F1', oSize, marked ? PDF_C.green : PDF_C.gray);
        flow.y += olh;
      });
    });
  }
  extra.forEach(ls => ls.forEach(l => { flow.space(olh); pdf.textEnc(flow.x + 6, flow.y + oSize, l, 'F3', oSize, PDF_C.gray); flow.y += olh; }));
  flow.y += 9;
}

// ---- Estimativa de risco em 10 anos (Pooled Cohort Equations + fatores extras da literatura) ----
function pceRisk(male, age, tc, hdl, sbp, treated, smoker, dm) {
  const la = Math.log(age), ltc = Math.log(tc), lh = Math.log(hdl), ls = Math.log(sbp);
  if (male) {
    const x = 12.344 * la + 11.853 * ltc - 2.664 * la * ltc - 7.990 * lh + 1.769 * la * lh + (treated ? 1.797 : 1.764) * ls + (smoker ? 7.837 - 1.795 * la : 0) + (dm ? 0.658 : 0);
    return 1 - Math.pow(0.9144, Math.exp(x - 61.18));
  }
  const x = -29.799 * la + 4.884 * la * la + 13.540 * ltc - 3.114 * la * ltc - 13.578 * lh + 3.149 * la * lh + (treated ? 2.019 : 1.957) * ls + (smoker ? 7.574 - 1.665 * la : 0) + (dm ? 0.661 : 0);
  return 1 - Math.pow(0.9665, Math.exp(x + 29.18));
}
function fmtRiskPct(v) {
  if (v < 1) return '<1%';
  return (v >= 10 ? String(Math.round(v)) : v.toFixed(1).replace('.', ',')) + '%';
}
function riskBand(v) {
  return v < 5 ? 'faixa baixa (menos de 5%)' : v < 7.5 ? 'faixa limítrofe (5% a menos de 7,5%)' : v < 20 ? 'faixa intermediária (7,5% a menos de 20%)' : 'faixa alta (20% ou mais)';
}
function riskEstimate() {
  const A = ANS;
  if (A.D1 === 0) return { secondary: true };
  if (A.P1 === undefined || A.P1 === null || A.P2 === undefined || A.P2 === null) return { missing: true };
  const male = A.P1 === 1, ageUsed = [40, 45, 55, 65, 75][A.P2];
  const bmi = bmiOf(A.P3);
  // fatores de entrada
  const F = {
    htn: A.D2 === 1 || A.D2 === 2, dm: A.D3 === 2, smoke: A.H1 >= 2,
    chol: A.D4 === 1 || A.D4 === 2, kid: A.D5 === 0, fam: A.F1 === 0,
    sed: A.H2 === 2 ? 1.16 : A.H2 === 1 ? 1.08 : 1, emo: A.D10n === 2,
    obese: bmi !== null && bmi >= 30, over: bmi !== null && bmi >= 25 && bmi < 30,
  };
  const treated = A.D6 === 0;
  const sbpOf = on => !on.htn ? 120 : (A.D2 === 1 ? 128 : 150);
  const lipOf = on => !on.chol ? [180, 50] : (A.D4 === 1 ? [220, 48] : [250, 45]);
  const calc = on => {
    const [tc, hdl] = lipOf(on);
    let v = pceRisk(male, ageUsed, tc, hdl, sbpOf(on), on.htn && treated, on.smoke, on.dm) * 100;
    if (on.fam) v *= 1.5;
    v *= on.sed;
    if (on.obese) v *= 1.10; else if (on.over) v *= 1.04;
    if (on.emo) v *= 1.5;
    if (on.kid) v *= 1.4;
    return v;
  };
  const total = calc(F), ref = calc({ htn: false, dm: false, smoke: false, chol: false, kid: false, fam: false, sed: 1, emo: false, obese: false, over: false });
  const inc = key => { const off = Object.assign({}, F, { [key]: (key === 'sed' ? 1 : false) }); if (key === 'obese' || key === 'over') { off.obese = false; off.over = false; } return Math.round((total / calc(off) - 1) * 100); };
  const rows = [];
  const add = (label, answer, key, refs, note) => rows.push({ label, answer, inc: key ? inc(key) : null, refs, note });
  const ans = id => optText(ITEM[id]);
  // Linhas: só as respostas que mudam o risco entram com porcentagem; as demais ficam explicadas sem número.
  if (F.htn) add('Pressão alta', ans('D2'), 'htn', ['PCE13', 'IH04']); else if (A.D2 === 3) add('Pressão', ans('D2'), null, ['HAS20'], 'Não entra no cálculo. Medir a pressão pode mudar o resultado.');
  if (F.dm) add('Diabetes', ans('D3'), 'dm', ['PCE13', 'IH04']); else if (A.D3 === 1 || A.D3 === 3) add('Açúcar no sangue', ans('D3'), null, ['ADA2'], 'Não entra no cálculo. Medir a glicemia pode mudar o resultado.');
  if (F.chol) add('Colesterol alto', ans('D4'), 'chol', ['PCE13', 'IH04']); else if (A.D4 === 3) add('Colesterol', ans('D4'), null, ['DIS25'], 'Não entra no cálculo. Medir o colesterol pode mudar o resultado.');
  if (F.smoke) add('Fumo', ans('H1'), 'smoke', ['PCE13', 'IH04']);
  if (F.sed > 1) add('Pouca atividade física', ans('H2'), 'sed', ['IH04']);
  if (F.obese || F.over) add(F.obese ? 'Obesidade' : 'Sobrepeso', bmiText(A.P3), F.obese ? 'obese' : 'over', ['BMI11'], 'Efeito do peso isolado, já descontados pressão, açúcar e colesterol.');
  if (F.fam) add('Infarto ou AVC na família', ans('F1'), 'fam', ['FAM04'], 'Valor conservador: o estudo mostrou risco maior (2 a 2,6 vezes) quando o evento foi precoce.');
  if (F.emo) add('Emocional ruim', ans('D10n'), 'emo', ['DEP06'], 'Não é diagnóstico de depressão. Usamos valor abaixo do encontrado para depressão (1,8 vez).');
  if (F.kid) add('Problema nos rins', ans('D5'), 'kid', ['CKD04']);
  if (A.H3 === 2) add('Fritura, salgadinho ou refrigerante', ans('H3'), null, ['IH04'], 'Não entra no cálculo (sem número validado para esta pergunta), mas pesa na prevenção.');
  if (A.H4 === 1) add('Bebida alcoólica', ans('H4'), null, ['PREV21'], 'Não entra no cálculo. Reduzir o álcool ajuda a pressão e o peso.');
  return { total: Math.min(total, 60), capped: total > 60, ref, male, ageUsed, under40: A.P2 === 0, band: riskBand(Math.min(total, 60)), rows };
}
function riskRefKeys(est) { const k = ['PCE13']; (est.rows || []).forEach(r => r.refs.forEach(x => { if (!k.includes(x)) k.push(x); })); return k; }
function riskPctHTML() {
  const est = riskEstimate(), keys = est.rows ? riskRefKeys(est) : [];
  let body;
  if (est.secondary) body = `<p class="rk-sub">Quem já teve infarto, AVC, angina, stent, ponte ou tem insuficiência cardíaca já está em faixa de risco alto. O cálculo em porcentagem vale para quem ainda não teve esses problemas. O caminho é acompanhamento médico regular.</p>`;
  else if (est.missing) body = `<p class="rk-sub">Para calcular a estimativa, responda sexo e idade.</p>`;
  else body = `<div class="rk-big">${fmtRiskPct(est.total)}</div>
      <div class="rk-sub">chance estimada de infarto ou AVC nos próximos 10 anos, ${est.band}${est.capped ? '. Valor limitado a 60% pelo método' : ''}.</div>
      <div class="rk-ref">Pessoa da mesma idade e sexo, sem nenhum fator de risco: <strong>${fmtRiskPct(est.ref)}</strong>.${est.under40 ? ' Abaixo de 40 anos, o método usa 40 anos e pode superestimar.' : ''}</div>
      ${est.rows.length ? est.rows.map(r => `<div class="rk-row"><div class="a">${escapeHtml(r.label)}: ${escapeHtml(r.answer)}<small>${r.note ? escapeHtml(r.note) + ' ' : ''}[${r.refs.map(x => keys.indexOf(x) + 1).join(', ')}]</small></div>${r.inc === null ? '<div class="v n">sem soma</div>' : `<div class="v">+${r.inc}%</div>`}</div>`).join('') : '<p class="rk-sub">Nenhuma resposta aumenta o risco acima da referência.</p>'}
      <div class="rk-note">O aumento de cada linha é o quanto o risco total sobe por causa daquela resposta, mantendo as outras. As porcentagens se multiplicam e por isso não somam. É uma estimativa educativa baseada em respostas, sem medidas de pressão e colesterol, e não é diagnóstico. Os métodos tendem a superestimar o risco em parte da população brasileira. A decisão é do médico.</div>
      <div class="rk-note"><strong>Referências</strong><br>${keys.map((k, i) => `${i + 1}. ${escapeHtml(EX_REFS[k])}`).join('<br>')}</div>`;
  return `<div class="rk-card"><h3>Etapa 1 · Risco cardíaco em porcentagem</h3>${body}</div>`;
}

    'Consumo diário de frutas e verduras teve risco de infarto 30% menor (OR 0,70) no INTERHEART; as diretrizes europeias de prevenção recomendam alimentação com mais vegetais e menos gordura saturada e sal.', ['IH04', 'PREV21']);
  if (A.D10n === 2) push('Cuidar do emocional', `Você respondeu: ${optText(ITEM.D10n)}.`,
    ['Conversar com alguém de confiança e procurar a unidade de saúde ou o psicólogo.', 'Manter sono regular, atividade física e contato com pessoas.', 'Se houver pensamento de se ferir, ligar para o CVV 188 (24 horas) ou SAMU 192.'],
    'Depressão se associou a risco 1,8 vez maior de doença do coração. A triagem de depressão em adultos é recomendada pela força-tarefa americana de prevenção.', ['DEP06', 'PHQ03', 'DEP23']);
  if (A.F1 === 0) push('Família com infarto ou AVC', `Você respondeu: ${optText(ITEM.F1)}.`,
    ['Contar ao médico quem teve o evento e com que idade.', 'Fazer check-up cedo: pressão, glicemia e colesterol.', 'Avisar parentes próximos para também se cuidarem.'],
    'Ter pai ou mãe com doença do coração precoce dobrou o risco de evento (OR 2,0 em homens e 1,7 em mulheres, após ajustes).', ['FAM04', 'PREV21']);
  if (A.D5 === 0) push('Cuidar dos rins', `Você respondeu: ${optText(ITEM.D5)}.`,
    ['Fazer creatinina e exame de urina com albumina, e seguir com o médico.', 'Controlar pressão e açúcar, que protegem os rins.', 'Evitar anti-inflamatórios sem orientação.'],
    'Rim com menor função se associou a mais eventos cardiovasculares (1,4 vez com filtração entre 45 e 59).', ['CKD04', 'KDIGO']);
  if (!out.length) push('Manter os bons hábitos', 'Suas respostas não apontaram fatores de risco que possamos ligar a uma ação específica.',
    ['Manter atividade física, alimentação equilibrada e não fumar.', 'Medir pressão, glicemia e colesterol periodicamente, conforme orientação médica.'],
    'As diretrizes de prevenção recomendam manter o estilo de vida saudável e reavaliar o risco periodicamente.', ['PREV21', 'PA20']);
  return out;
}
function preventionRefKeys(list) { const k = []; list.forEach(a => a.refs.forEach(r => { if (!k.includes(r)) k.push(r); })); return k; }

function bindPdfSelection() {
  const all = document.getElementById('selAll'), parts = ['selRisk', 'selPrev', 'selExams'].map(id => document.getElementById(id));
  all.addEventListener('change', () => { if (all.checked) parts.forEach(c => c.checked = false); else if (!parts.some(c => c.checked)) all.checked = true; });
  parts.forEach(c => c.addEventListener('change', () => { if (c.checked) all.checked = false; else if (!parts.some(x => x.checked)) all.checked = true; }));
  const area = document.getElementById('selPdfArea');
  const withSel = fn => { const sel = readPdfSelection(); if (!sel) { setPdfStatus(area, 'Marque ao menos uma opção.', true); return; } PDF_SECTIONS = sel; try { fn(); } finally { PDF_SECTIONS = { risk: true, prev: true, exams: true }; } };
  document.getElementById('selGenBtn').addEventListener('click', () => withSel(() => generateDocument('risk', 'selPdfArea')));
  document.getElementById('selShareBtn').addEventListener('click', () => withSel(async () => {
    const sel = PDF_SECTIONS;
    let bytes, file;
    try { PDF_SECTIONS = sel; bytes = buildRiskPDF(); } catch (e) { setPdfStatus(area, 'Não foi possível gerar o PDF.', true); return; }
    const name = 'MAVI_Triagem_Saude' + pdfSecSuffix() + '.pdf';
    try { file = new File([bytes], name, { type: 'application/pdf' }); } catch (e) { file = null; }
    if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: name }); setPdfStatus(area, 'Escolha o WhatsApp ou o e-mail na tela que abriu.', false); } catch (e) { setPdfStatus(area, 'Envio cancelado.', false); }
      return;
    }
    generateDocument('risk', 'selPdfArea');
    area.insertAdjacentHTML('beforeend', `<a class="share-wa-link" href="${waLink('', 'Triagem MAVI — PDF em anexo.')}" target="_blank" rel="noopener">📲 Abrir o WhatsApp e anexar o PDF salvo</a>`);
  }));
}

function pdfRiskStage(pdf, flow) {

  if (est.secondary) { flow.para('Quem já teve infarto, AVC, angina, stent, ponte ou tem insuficiência cardíaca já está em faixa de risco alto. O cálculo em porcentagem vale para quem ainda não teve esses problemas. O caminho é acompanhamento médico regular.', { size: 9.5, lh: 1.4 }); flow.gap(4); return; }
  if (est.missing) { flow.para('Estimativa em porcentagem não calculada: sexo e idade não informados.', { size: 9.5, lh: 1.4 }); flow.gap(4); return; }
  const keys = riskRefKeys(est);
  flow.para(`Estimativa: ${fmtRiskPct(est.total)} de chance de infarto ou AVC nos próximos 10 anos, ${est.band}.`, { font: 'F2', size: 11, lh: 1.4 });
  flow.para(`Referência (mesma idade e sexo, sem fatores de risco): ${fmtRiskPct(est.ref)}.${est.under40 ? ' Abaixo de 40 anos o método usa 40 anos e pode superestimar.' : ''}`, { size: 9.3, color: PDF_C.gray, lh: 1.4 });
  flow.gap(4);
  flow.para('Por que este risco: aumento de risco por resposta', { font: 'F2', size: 9.8, color: PDF_C.green });
  flow.gap(2);
  if (!est.rows.length) { flow.para('Nenhuma resposta aumenta o risco acima da referência.', { size: 9.3, lh: 1.4 }); }
  est.rows.forEach(r => {
    flow.para(`• ${r.label}: ${r.answer} — ${r.inc === null ? 'sem soma no cálculo' : '+' + r.inc + '% de risco'} [${r.refs.map(x => keys.indexOf(x) + 1).join(', ')}]${r.note ? '. ' + r.note : ''}`, { size: 9.3, lh: 1.4, indent: 6 });
    flow.gap(2);
  });

  flow.para('O aumento de cada resposta é o quanto o risco total sobe por causa dela, mantendo as outras; as porcentagens se multiplicam e não somam. Estimativa educativa a partir de respostas, sem medidas de pressão e colesterol; não é diagnóstico. Os métodos tendem a superestimar o risco em parte da população brasileira. A decisão é do médico.', { size: 8.5, color: PDF_C.gray, lh: 1.4 });

function buildRiskPDF() {
  const { dateStr, timeStr } = pdfMeta();
  const pdf = newMaviPdf(), flow = new PdfFlow(pdf);
  const SEL = PDF_SECTIONS;
  pdfHeader(pdf, flow, 'Triagem de Saúde do Coração', dateStr, timeStr);
  pdfMetaBox(pdf, flow, [
    ['Nome completo', idVal('respondentName') || 'Não informado'],
    ['Código de referência', resultComputed ? resultComputed.refCode : '—'],
    ['Data/hora do preenchimento', `${dateStr} às ${timeStr}`],
  ]);
  if (resultComputed && SEL.risk) {
    const col = resultComputed.alert ? PDF_RISK['risk-alert'] : (PDF_RISK[resultComputed.riskClass] || PDF_C.green);
    const headLines = pdfWrap(scoreLine(), 'F2', 13, flow.w - 28);
    const actLines = pdfWrap(resultComputed.action, 'F1', 9.5, flow.w - 28);
    const h = 18 + headLines.length * 16 + 4 + actLines.length * 12.5 + 12;
    flow.space(h);
    pdf.rrect(flow.x, flow.y, flow.w, h, 12, { fill: col });
    let y = flow.y + 26;
    headLines.forEach(l => { pdf.textEnc(flow.x + 14, y, l, 'F2', 13, [255, 255, 255]); y += 16; });
    y += 2;
    actLines.forEach(l => { pdf.textEnc(flow.x + 14, y, l, 'F1', 9.5, [255, 255, 255]); y += 12.5; });
    flow.y += h + 16;

  if (SEL.prev) pdfPreventionStage(pdf, flow);
  if (SEL.exams) pdfExams(pdf, flow);

function setPdfStatus(container, text, isError) {
  container.innerHTML = `<div class="pdf-status ${isError ? 'err' : ''}">${text}</div>`;
}

function buildStandaloneDoc(innerHtml, fileTitle) {
  return `<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8">`
    + `<meta name="viewport" content="width=device-width, initial-scale=1">`
    + `<title>${fileTitle}</title><style>${PRINT_STYLES}</style></head><body>`
    + `<div class="no-print"><button id="printNowBtn">🖨️ Imprimir / Salvar como PDF</button>`
    + `<span class="hint">Na caixa que abrir, em "Destino" ou "Impressora", escolha "Salvar como PDF".</span></div>`
    + `<div class="pw-wrap">${innerHtml}</div>`
    + `<script>document.getElementById('printNowBtn').addEventListener('click', function(){ window.print(); });<\/script>`
    + `<\/body><\/html>`;
}

function generateDocument(kind, boxId) {
  const isRisk = kind === 'risk';
  const statusBox = document.getElementById(boxId || (isRisk ? 'riskPdfArea' : 'crmPdfArea'));
  setPdfStatus(statusBox, '⏳ Preparando o documento...', false);

  let innerHtml, fileTitle;
  try {
    const today = new Date();
    const y = today.getFullYear(), m = String(today.getMonth()+1).padStart(2,'0'), d = String(today.getDate()).padStart(2,'0');
    if (isRisk) {
      innerHtml = buildRiskPrintHTML();
      fileTitle = `MAVI_Triagem_Saude${pdfSecSuffix()}_${y}-${m}-${d}`;
    } else {
      innerHtml = buildCrmPrintHTML();
      fileTitle = `MAVI_Ficha_Relacionamento_${y}-${m}-${d}`;
    }
  } catch (e) {
    setPdfStatus(statusBox, '⚠️ Não foi possível montar o documento. Detalhe: ' + e.message, true);
    return;
  }

  // PDF de verdade, gerado aqui mesmo (sem impressão do navegador)
  let pdfBytes = null;
  try { pdfBytes = isRisk ? buildRiskPDF() : buildCrmPDF(); } catch (e) { console.warn('PDF não gerado:', e && e.message); }
  const pdfName = fileTitle + '.pdf';

  // Dentro de uma página do Claude, impressão e links de download são bloqueados:
  // o arquivo é entregue pela própria plataforma, com confirmação.
  if (window.claude && typeof window.claude.use === 'function') {
    if (!pdfBytes) { setPdfStatus(statusBox, '⚠️ Não foi possível gerar o PDF.', true); return; }
    setPdfStatus(statusBox, '⏳ Confirme o salvamento do PDF na janela que vai aparecer…', false);
    window.claude.use('downloads').then(async (dl) => {
      if (!dl) { setPdfStatus(statusBox, '⚠️ Salvar arquivos não está disponível nesta tela.', true); return; }
      try {
        await dl.save({ filename: pdfName, data: new Blob([pdfBytes], { type: 'application/pdf' }) });
        setPdfStatus(statusBox, '✅ PDF salvo no aparelho (pasta Download).', false);
      } catch (e) {
        const code = e && e.code;
        setPdfStatus(statusBox, code === 'declined' ? 'Salvamento cancelado. Toque no botão de novo para tentar.' : '⚠️ Não foi possível salvar o PDF (' + (code || 'erro') + ').', code !== 'declined');
      }
    });
    return;
  }

  let blobUrl;
  try {
    const fullHtml = buildStandaloneDoc(innerHtml, fileTitle);
    const blob = new Blob([fullHtml], { type: 'text/html' });
    blobUrl = URL.createObjectURL(blob);
  } catch (e) {
    setPdfStatus(statusBox, '⚠️ Não foi possível preparar o arquivo. Detalhe: ' + e.message, true);
    return;
  }

  // PDF pronto para baixar e, onde o aparelho permitir, para enviar direto
  // (o Android abre a lista de apps, com o WhatsApp, já com o arquivo anexado).
  let pdfUrl = null, pdfFile = null, canSharePdf = false;
  if (pdfBytes) {
    try {
      pdfUrl = URL.createObjectURL(new Blob([pdfBytes], { type: 'application/pdf' }));
      pdfFile = new File([pdfBytes], pdfName, { type: 'application/pdf' });
      canSharePdf = !!(navigator.canShare && navigator.canShare({ files: [pdfFile] }));
    } catch (e) { canSharePdf = false; }
  }

  // Links reais: o usuário toca neles como em qualquer link (não dependem de
  // janelas abertas por script, que alguns celulares bloqueiam em silêncio).
  statusBox.innerHTML = `
    <div class="pdf-link-box">
      <a class="pdf-link" href="${blobUrl}" target="_blank" rel="noopener">👁️ Toque aqui para abrir o documento</a>
      <a class="pdf-link secondary" ${pdfUrl ? `href="${pdfUrl}" download="${pdfName}"` : `href="${blobUrl}" download="${fileTitle}.html"`}>⬇️ ${pdfUrl ? 'Ou baixe o PDF pronto' : 'Ou baixe o arquivo'}</a>
      ${canSharePdf ? `<button class="pdf-link share-pdf" type="button">📤 Enviar PDF (WhatsApp e outros apps)</button>` : ''}
      <div class="pdf-status-hint">Dentro do documento, toque em "Imprimir / Salvar como PDF".</div>
    </div>
  `;
  const shareBtn = statusBox.querySelector('.share-pdf');
  if (shareBtn) {
    shareBtn.addEventListener('click', async () => {
      try {
        // Só o arquivo: nenhum dado de saúde vai no texto da mensagem.
        await navigator.share({ files: [pdfFile], title: pdfName });
      } catch (e) { /* o usuário cancelou ou o app não aceitou: nada é enviado */ }
    });
  }
}

// ---------------- Compartilhamento pelo WhatsApp ----------------
// IMPORTANTE (limitação técnica real, sem solução puramente client-side e
// offline): este app não tem como gerar um arquivo PDF "de verdade" em
// JavaScript puro sem depender de uma biblioteca externa (ex.: jsPDF), que
// não pode ser baixada neste ambiente sem acesso à internet. O PDF real só
// existe depois que o usuário toca em "Imprimir / Salvar como PDF" dentro do
// documento (ação do próprio navegador) — e, a partir daí, o arquivo salvo
// não fica acessível para este script anexar automaticamente em nenhum app.
// Por isso, o compartilhamento aqui é SEMPRE assistido: preparamos a
// mensagem e abrimos o WhatsApp já com o texto pronto, mas o anexo do PDF é
// um passo manual do usuário dentro do WhatsApp — exatamente como o próprio
// WhatsApp exige para qualquer app que não tenha integração direta com a
// WhatsApp Business Platform. Nunca afirmamos que o PDF foi enviado.

const COORD_WA = '5587981144473'; // WhatsApp da coordenação MAVI

function digitsOnly(s) { return (s || '').replace(/\D/g, ''); }

// Retorna { ok, digits, msg } — número vazio é válido (abre o seletor de
// contato do WhatsApp); número preenchido precisa ter DDI + DDD + número.
function checkWaPhone(raw) {
  const d = digitsOnly(raw);
  if (!d) return { ok: true, digits: '' };
  if (d.length < 12 || d.length > 13) {
    return { ok: false, digits: d, msg: 'Número incompleto: inclua o código do país (55) e o DDD. Ex.: 55 87 98888-7766.' };
  }
  return { ok: true, digits: d };
}

function validateWaPhoneField() {
  const v = checkWaPhone(document.getElementById('waPhoneInput').value);
  document.getElementById('waPhoneHint').textContent = v.ok ? '' : v.msg;
  return v;
}

function waLink(digits, text) {
  const encoded = encodeURIComponent(text);
  return digits ? `https://wa.me/${digits}?text=${encoded}` : `https://wa.me/?text=${encoded}`;
}

// Mantém os links de WhatsApp já abertos na tela sincronizados com o que o
// usuário digitar (número ou texto da mensagem), sem precisar tocar de novo
// nos botões "Preparar".
function refreshWaLinks() {
  const v = checkWaPhone(document.getElementById('waPhoneInput').value);
  ['waFullMsg', 'waSummaryMsg'].forEach(taId => {
    const ta = document.getElementById(taId);
    const link = document.getElementById(taId === 'waFullMsg' ? 'waFullLink' : 'waSummaryLink');
    if (ta && link) link.href = waLink(v.ok ? v.digits : '', ta.value);
  });
}

// =====================================================================
// ÁREA RESTRITA — registro local cifrado + painel de gráficos
// =====================================================================
// Como funciona:
// - Na primeira vez, o administrador cria uma senha neste aparelho. É gerado
//   um par de chaves RSA-OAEP 2048 (SHA-256). A chave privada é guardada
//   CIFRADA (AES-GCM 256) com uma chave derivada da senha por PBKDF2-SHA256
//   (600.000 iterações, salt aleatório de 16 bytes). A senha nunca é salva.
// - Cada questionário concluído é cifrado com a chave PÚBLICA no momento em
//   que o resultado aparece (AES-GCM 256 com chave nova por registro; essa
//   chave é protegida com RSA-OAEP). Nem quem preencheu consegue reabrir.
// - São guardadas as respostas, município, pontuação, data e os poucos campos
//   digitados do questionário (ex.: 'Qual doença?'). NÃO são guardados nome
//   (fora da lista de contato autorizada), peso/altura exatos nem outros textos livres.
// - Ao entrar com a senha, a chave privada é aberta só em memória (não
//   exportável) e os registros são decifrados para montar os gráficos. Ao
//   sair, por inatividade (10 min) ou ao fechar, tudo some da memória.
// Limitações reais: quem souber a senha e tiver o aparelho vê os dados;
// limpar os dados do Chrome ou desinstalar o app apaga os registros; a senha
// não pode ser recuperada.

const DB_NAME = 'mavi_triagem_db';
const FORM_VERSION = '2026-10-v3';
const PBKDF2_ITER = 600000;
const RSA_GEN = { name: 'RSA-OAEP', modulusLength: 2048, publicExponent: new Uint8Array([1, 0, 1]), hash: 'SHA-256' };
let currentRecordId = null;
let currentRecordCreatedAt = null;
let adminPrivKey = null;
let adminRecords = [];
let adminQ2 = [];
let adminUnreadable = 0;
let adminIdleTimer = null;
let adminFailedTries = 0;
let adminBlockedUntil = 0;
