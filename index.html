function cryptoAvailable() {
  return !!(window.crypto && crypto.subtle && window.indexedDB);
}

function openDb() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, 3);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains('records')) db.createObjectStore('records', { keyPath: 'id' });
      if (!db.objectStoreNames.contains('meta')) db.createObjectStore('meta', { keyPath: 'k' });
      if (!db.objectStoreNames.contains('saved')) db.createObjectStore('saved', { keyPath: 'id' });
      if (!db.objectStoreNames.contains('pdfs')) db.createObjectStore('pdfs', { keyPath: 'id' });
      if (!db.objectStoreNames.contains('imported')) db.createObjectStore('imported', { keyPath: 'id' });
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function idb(store, mode, op) {
  const db = await openDb();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, mode);
    const req = op(tx.objectStore(store));
    tx.oncomplete = () => { db.close(); resolve(req ? req.result : undefined); };
    tx.onerror = () => { db.close(); reject(tx.error); };
    tx.onabort = () => { db.close(); reject(tx.error); };
  });
}
const metaGet = (k) => idb('meta', 'readonly', s => s.get(k)).then(v => (v ? v.v : null));
const metaPut = (k, v) => idb('meta', 'readwrite', s => s.put({ k, v }));

async function deriveKek(password, salt, iterations) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt, iterations, hash: 'SHA-256' },
    base, { name: 'AES-GCM', length: 256 }, false, ['wrapKey', 'unwrapKey']);
}

async function adminSetup(password) {
  const cloud = await getCloud();
  if (cloud) return cloudAdminSetup(cloud, password);
  const pair = await crypto.subtle.generateKey(RSA_GEN, true, ['encrypt', 'decrypt']);
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const kek = await deriveKek(password, salt, PBKDF2_ITER);
  const wrappedPriv = await crypto.subtle.wrapKey('pkcs8', pair.privateKey, kek, { name: 'AES-GCM', iv });
  const pubSpki = await crypto.subtle.exportKey('spki', pair.publicKey);
  await metaPut('admin', {
    v: 1,
    alg: 'RSA-OAEP-2048/SHA-256 + AES-GCM-256; senha: PBKDF2-SHA256',
    iter: PBKDF2_ITER,
    salt, iv,
    wrappedPriv: new Uint8Array(wrappedPriv),
    pubSpki: new Uint8Array(pubSpki),
    createdAt: new Date().toISOString(),
  });
  try { if (navigator.storage && navigator.storage.persist) await navigator.storage.persist(); } catch (e) {}
}

async function adminUnlock(password) {
  const cloud = await getCloud();
  if (cloud) return cloudAdminUnlock(cloud, password);
  const cfg = await metaGet('admin');
  if (!cfg) throw new Error('not-configured');
  const kek = await deriveKek(password, cfg.salt, cfg.iter || PBKDF2_ITER);
  try {
    return await crypto.subtle.unwrapKey('pkcs8', cfg.wrappedPriv, kek, { name: 'AES-GCM', iv: cfg.iv },
      { name: 'RSA-OAEP', hash: 'SHA-256' }, false, ['decrypt']);
  } catch (e) {
    throw new Error('wrong-password');
  }
}

async function getAdminPublicKey() {
  const cfg = await metaGet('admin');
  if (!cfg) return null;
  return crypto.subtle.importKey('spki', cfg.pubSpki, { name: 'RSA-OAEP', hash: 'SHA-256' }, false, ['encrypt']);
}

async function encryptRecord(pub, obj, id) {
  const raw = crypto.getRandomValues(new Uint8Array(32));
  const key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['encrypt']);
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const aad = new TextEncoder().encode(id); // amarra o conteúdo cifrado ao seu identificador
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv, additionalData: aad }, key,
    new TextEncoder().encode(JSON.stringify(obj)));
  const ek = await crypto.subtle.encrypt({ name: 'RSA-OAEP' }, pub, raw);
  raw.fill(0);
  return { iv, ek: new Uint8Array(ek), ct: new Uint8Array(ct) };
}

async function decryptRecord(priv, rec) {
  const raw = await crypto.subtle.decrypt({ name: 'RSA-OAEP' }, priv, rec.ek);
  const key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
  const pt = await crypto.subtle.decrypt(
    { name: 'AES-GCM', iv: rec.iv, additionalData: new TextEncoder().encode(rec.id) }, key, rec.ct);
  const obj = JSON.parse(new TextDecoder().decode(pt));
  if (obj.id !== rec.id) throw new Error('id-mismatch');
  return obj;
}

// Só o necessário para os gráficos: sem nome, telefone, peso/altura exatos ou textos livres.
function buildRecordPayload() {
  const ans = {};
  ITEMS.forEach(it => {
    if (it.type === 'bmi' || it.type === 'text') return;
    if (!isVisible(it)) { ans[it.id] = null; return; }
    const v = ANS[it.id];
    ans[it.id] = v === undefined ? null : (Array.isArray(v) ? v.slice() : v);
  });
  const b = bmiOf(ANS.P3);
  const txt = {};
  ITEMS.forEach(it => { if (it.text && txtOf(it)) txt[it.id] = txtOf(it).slice(0, 200); });
  return {
    id: currentRecordId,
    formVersion: FORM_VERSION,
    createdAt: currentRecordCreatedAt,
    updatedAt: new Date().toISOString(),
    municipio: idVal('respondentCity') || null,
    consent: true,
    consentAt: currentRecordCreatedAt,
    consentContact: isChecked('consentContact'),
    contact: isChecked('consentContact') ? { name: idVal('respondentName').slice(0, 120), phone: idVal('respondentPhone').replace(/\D/g, '').slice(0, 15) } : null,
    ans,
    txt,
    bmiCat: (ANS.P3 && ANS.P3.ns) ? 'ns' : b === null ? null : b >= 30 ? 2 : b >= 25 ? 1 : 0,
    alert: resultComputed.alert,
    score: resultComputed.total,
    riskClass: resultComputed.riskClass,
    riskLabel: resultComputed.label,
    steps: resultComputed.steps.slice(),
  };
}

// aparelho, nada é guardado. "Revisar e recalcular" atualiza o mesmo
// registro (mesmo identificador) em vez de criar um duplicado.
async function saveRecordLocally() {
  try {
    if (!resultComputed || !currentRecordId || !window.indexedDB || !(window.crypto && crypto.subtle)) return;
    await localSave(buildRecordPayload(), idVal('respondentName'));
    await localSavePdfs();
    refreshSavedBadge();
    const cloud = await getCloud();
    if (cloud) { await cloudSaveRecord(cloud); refreshSavedBadge(); return; }
    showSendStatus('local');
    const pub = await getAdminPublicKey();
    if (!pub) return;
    const enc = await encryptRecord(pub, buildRecordPayload(), currentRecordId);
    await idb('records', 'readwrite', s => s.put({ id: currentRecordId, v: 1, savedAt: new Date().toISOString(), ...enc }));
    saveDraft();
  } catch (e) {
    console.warn('Registro local não salvo:', e && e.name);
  }
}

let devKeyPromise = null;
function getDeviceKey() {
  if (devKeyPromise) return devKeyPromise;
  devKeyPromise = (async () => {
    let k = await metaGet('devkey');
    if (!k) {
      k = await crypto.subtle.generateKey({ name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
      await metaPut('devkey', k);
    }
    return k;
  })();
  devKeyPromise.catch(() => { devKeyPromise = null; });
  return devKeyPromise;
}

async function localSave(payload, name) {
  const key = await getDeviceKey();
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt(
    { name: 'AES-GCM', iv, additionalData: new TextEncoder().encode(payload.id) }, key,
    new TextEncoder().encode(JSON.stringify({ payload, name: name || '' }))));
  await idb('saved', 'readwrite', s => s.put({ id: payload.id, createdAt: payload.createdAt, savedAt: new Date().toISOString(), synced: 0, iv, ct }));
}

async function localOpen(rec) {
  const key = await getDeviceKey();
  const pt = await crypto.subtle.decrypt(
    { name: 'AES-GCM', iv: rec.iv, additionalData: new TextEncoder().encode(rec.id) }, key, rec.ct);
  return JSON.parse(new TextDecoder().decode(pt));
}

async function localMarkSynced(id, savedAt) {
  const r = await idb('saved', 'readonly', s => s.get(id));
  if (r && r.savedAt === savedAt) {
    r.synced = 1; r.syncedAt = new Date().toISOString();
    await idb('saved', 'readwrite', s => s.put(r));
  }
}

let lastSyncErr = null;
let flushP = Promise.resolve();
async function doFlushSaved() {
  const cloud = await getCloud();
  if (!cloud || !cryptoAvailable()) return 0;
  const all = (await idb('saved', 'readonly', s => s.getAll())) || [];
  const pend = all.filter(r => !r.synced);
  if (!pend.length) return 0;
  const pub = await cloudPublicKey(cloud);
  if (!pub) return 0;
  let n = 0;
  for (const r of pend) {
    try {
      const { payload } = await localOpen(r);
      const enc = await encryptRecord(pub, payload, r.id);
      await cloudWrite(cloud, r.id, { v: 1, savedAt: r.savedAt, iv: b64enc(enc.iv), ek: b64enc(enc.ek), ct: b64enc(enc.ct) });
      await localMarkSynced(r.id, r.savedAt);
      n++;
    } catch (e) { lastSyncErr = e && e.code ? e.code : 'erro'; }
  }
  return n;
}
function cloudFlushSaved() {
  const p = flushP.then(doFlushSaved, doFlushSaved);
  flushP = p.catch(() => {});
  return p;
}

// ---------------- PDFs guardados no aplicativo ----------------
async function deliverPdf(bytes, name) {
  const blob = new Blob([bytes], { type: 'application/pdf' });
  if (window.claude && typeof window.claude.use === 'function') {
    const dl = await window.claude.use('downloads');
    if (!dl) throw new Error('indisponivel');
    await dl.save({ filename: name, data: blob });
    return;
  }
  const file = new File([bytes], name, { type: 'application/pdf' });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: name }); return; }
    catch (e) {
      if (e && e.name === 'AbortError') { const x = new Error('cancelado'); x.code = 'declined'; throw x; }
      /* qualquer outro erro do compartilhamento: cai para o download direto */
    }
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 60000);
}

async function aesKeyEncrypt(key, id, bytes) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv, additionalData: new TextEncoder().encode(id) }, key, bytes));
  return { iv, ct };
}
async function aesKeyDecrypt(key, id, iv, ct) {
  return new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-GCM', iv, additionalData: new TextEncoder().encode(id) }, key, ct));
}

// PDFs gerados neste celular: guardados cifrados no aparelho.
async function localSavePdfs() {
  const key = await getDeviceKey();
  for (const [kind, build] of [['risk', buildRiskPDF], ['crm', buildCrmPDF]]) {
    try {
      const id = currentRecordId + ':' + kind;
      const e = await aesKeyEncrypt(key, id, build());
      await idb('pdfs', 'readwrite', st => st.put({ id, recId: currentRecordId, kind, savedAt: new Date().toISOString(), iv: e.iv, ct: e.ct }));
    } catch (e) { console.warn('PDF não guardado:', kind); }
  }
}
async function localGetPdf(id) {
  const r = await idb('pdfs', 'readonly', st => st.get(id));
  if (!r) throw new Error('nao-encontrado');
  return aesKeyDecrypt(await getDeviceKey(), id, r.iv, r.ct);
}

// PDFs anexados na área restrita: cifrados com a chave pública da coordenação.
async function encryptBytes(pub, bytes, id) {
  const raw = crypto.getRandomValues(new Uint8Array(32));
  const key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['encrypt']);
  const e = await aesKeyEncrypt(key, id, bytes);
  const ek = new Uint8Array(await crypto.subtle.encrypt({ name: 'RSA-OAEP' }, pub, raw));
  raw.fill(0);
  return { iv: e.iv, ek, ct: e.ct };
}
async function decryptBytes(priv, id, rec) {
  const raw = await crypto.subtle.decrypt({ name: 'RSA-OAEP' }, priv, rec.ek);
  const key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
  return aesKeyDecrypt(key, id, rec.iv, rec.ct);
}
async function sha8(bytes) {
  const h = new Uint8Array(await crypto.subtle.digest('SHA-256', bytes));
  return Array.from(h.slice(0, 6)).map(b => b.toString(16).padStart(2, '0')).join('');
}

let adminPdfs = [];
async function storeImportedPdf(recId, bytes) {
  if (bytes.length > 700000) throw new Error('grande');
  const id = recId + '_' + await sha8(bytes);
  const meta = { recId, size: bytes.length, savedAt: new Date().toISOString() };
  const cloud = await getCloud();
  if (cloud) {
    const pub = await cloudPublicKey(cloud);
    if (!pub) throw new Error('no-key');
    const e = await encryptBytes(pub, bytes, id);
    await cloud.db.doc(`inbox/${cloud.uid}`).set({ updatedAt: meta.savedAt });
    await cloud.db.doc(`inbox/${cloud.uid}/pdfs/${id}`).set({ v: 1, iv: b64enc(e.iv), ek: b64enc(e.ek), ct: b64enc(e.ct) });
    await cloud.db.doc(`inbox/${cloud.uid}/pdfmeta/${id}`).set(meta);
    return;
  }
  const pub = await getAdminPublicKey();
  if (!pub) throw new Error('no-key');
  const e = await encryptBytes(pub, bytes, id);
  await idb('imported', 'readwrite', st => st.put({ id, ...meta, ...e }));
}
async function loadAdminPdfMeta() {
  try {
    const cloud = await getCloud();
    if (cloud) {
      const q = await cloud.db.collection(`inbox/${cloud.uid}/pdfmeta`).get();
      adminPdfs = q.docs.map(d => ({ id: d.id, ...d.data() }));
    } else {
      const raw = (await idb('imported', 'readonly', st => st.getAll())) || [];
      adminPdfs = raw.map(r => ({ id: r.id, recId: r.recId, size: r.size, savedAt: r.savedAt }));
    }
  } catch (e) { adminPdfs = []; }
  adminPdfs.sort((a, b) => String(b.savedAt).localeCompare(String(a.savedAt)));
}
async function adminGetPdf(id) {
  const cloud = await getCloud();
  if (cloud) {
    const snap = await cloud.db.doc(`inbox/${cloud.uid}/pdfs/${id}`).get();
    if (!snap.exists) throw new Error('nao-encontrado');
    const d = snap.data();
    return decryptBytes(adminPrivKey, id, { iv: b64dec(d.iv), ek: b64dec(d.ek), ct: b64dec(d.ct) });
  }
  const r = await idb('imported', 'readonly', st => st.get(id));
  if (!r) throw new Error('nao-encontrado');
  return decryptBytes(adminPrivKey, id, r);
}

async function cloudWrite(cloud, recId, body) {
  await cloud.db.doc(`inbox/${cloud.uid}`).set({ updatedAt: body.savedAt });
  await cloud.db.doc(`inbox/${cloud.uid}/recs/${recId}`).set(body);
}

async function cloudFlushOutbox() {
  const cloud = await getCloud();
  if (!cloud) return 0;
  const list = outboxRead();
  if (list.length) {
    const left = [];
    for (const item of list) {
      try { await cloudWrite(cloud, item.id, item.body); } catch (e) { left.push(item); }
    }
    outboxWrite(left);
  }
  return cloudFlushSaved();
}

async function cloudAdminSetup(cloud, password) {
  const pair = await crypto.subtle.generateKey(RSA_GEN, true, ['encrypt', 'decrypt']);
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const kek = await deriveKek(password, salt, PBKDF2_ITER);
  const wrappedPriv = new Uint8Array(await crypto.subtle.wrapKey('pkcs8', pair.privateKey, kek, { name: 'AES-GCM', iv }));
  const pubSpki = new Uint8Array(await crypto.subtle.exportKey('spki', pair.publicKey));
  await cloud.db.doc(`data/users/${cloud.uid}/adminkey`).set({ v: 1, iter: PBKDF2_ITER, salt: b64enc(salt), iv: b64enc(iv), wrappedPriv: b64enc(wrappedPriv) });
  await cloud.db.doc('config/admin').set({ v: 1, alg: 'RSA-OAEP-2048/SHA-256 + AES-GCM-256', pubSpki: b64enc(pubSpki), createdAt: new Date().toISOString() });
  try { localStorage.setItem(CLOUD_PUB_KEY, b64enc(pubSpki)); } catch (e) {}
}


// ---------------- Código de recuperação da senha da área restrita ----------------
// A chave privada fica cifrada pela senha. O código de recuperação guarda uma segunda
// cópia cifrada da mesma chave: só quem tem o código consegue redefinir a senha.
const REC_ALPHA = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
function recNew() {
  const u = crypto.getRandomValues(new Uint8Array(20));
  let s = '';
  for (const b of u) s += REC_ALPHA[b % REC_ALPHA.length];
  return s.match(/.{5}/g).join('-');
}
function recNorm(c) { return String(c || '').toUpperCase().replace(/[^A-Z0-9]/g, ''); }
async function recUnwrap(wrapped, kek, iv) {
  return crypto.subtle.unwrapKey('pkcs8', wrapped, kek, { name: 'AES-GCM', iv }, { name: 'RSA-OAEP', hash: 'SHA-256' }, true, ['decrypt']);
}
async function cloudRecoverySet(cloud, password) {
  const ref = cloud.db.doc(`data/users/${cloud.uid}/adminkey`);
  const snap = await ref.get();
  if (!snap.exists) throw new Error('not-configured');
  const k = snap.data();
  let priv;
  try { priv = await recUnwrap(b64dec(k.wrappedPriv), await deriveKek(password, b64dec(k.salt), k.iter || PBKDF2_ITER), b64dec(k.iv)); }
  catch (e) { throw new Error('wrong-password'); }
  const code = recNew();
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  const rk = await deriveKek(recNorm(code), salt, PBKDF2_ITER);
  const w = new Uint8Array(await crypto.subtle.wrapKey('pkcs8', priv, rk, { name: 'AES-GCM', iv }));
  await ref.set(Object.assign({}, k, { rec: { iter: PBKDF2_ITER, salt: b64enc(salt), iv: b64enc(iv), wrappedPriv: b64enc(w) } }));
  return code;
}
async function cloudRecoveryReset(cloud, code, newPassword) {
  const ref = cloud.db.doc(`data/users/${cloud.uid}/adminkey`);
  const snap = await ref.get();
  if (!snap.exists) throw new Error('not-configured');
  const k = snap.data();
  if (!k.rec) throw new Error('no-recovery');
  let priv;
  try { priv = await recUnwrap(b64dec(k.rec.wrappedPriv), await deriveKek(recNorm(code), b64dec(k.rec.salt), k.rec.iter || PBKDF2_ITER), b64dec(k.rec.iv)); }
  catch (e) { throw new Error('wrong-code'); }
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  const kek = await deriveKek(newPassword, salt, PBKDF2_ITER);
  const w = new Uint8Array(await crypto.subtle.wrapKey('pkcs8', priv, kek, { name: 'AES-GCM', iv }));
  await ref.set(Object.assign({}, k, { v: 1, iter: PBKDF2_ITER, salt: b64enc(salt), iv: b64enc(iv), wrappedPriv: b64enc(w) }));
}

// Lê os dados que o app embute em cada PDF da triagem.
function cleanTxt(t) {
  const out = {};
  if (t && typeof t === 'object' && !Array.isArray(t)) {
    Object.keys(t).forEach(k => { if (ITEM[k] && ITEM[k].text && typeof t[k] === 'string') out[k] = t[k].slice(0, 200); });
  }
  return out;
}
async function readPdfRecord(file) {
  const buf = await file.arrayBuffer();
  const txt = new TextDecoder('iso-8859-1').decode(new Uint8Array(buf));
  const m = txt.match(/\/Keywords \(MAVI1:([A-Za-z0-9+\/=]+)\)/);
  if (!m) return null;
  let o;
  try { o = JSON.parse(new TextDecoder().decode(b64dec(m[1]))); } catch (e) { return null; }
  if (!o || typeof o !== 'object' || typeof o.id !== 'string' || o.id.length < 8 || o.id.length > 80) return null;
  if (!o.createdAt || isNaN(Date.parse(o.createdAt)) || !o.ans || typeof o.ans !== 'object' || Array.isArray(o.ans)) return null;
  if (typeof o.score !== 'number' || typeof o.riskClass !== 'string') return null;
  const ans = {};
  for (const [k, v] of Object.entries(o.ans)) {
    if (v === null || typeof v === 'number' || typeof v === 'string' || (Array.isArray(v) && v.every(x => typeof x === 'number'))) ans[k] = v;
    else return null;
  }
  return {
    id: o.id, formVersion: String(o.formVersion || ''), createdAt: o.createdAt,
    updatedAt: o.updatedAt && !isNaN(Date.parse(o.updatedAt)) ? o.updatedAt : o.createdAt,
    municipio: typeof o.municipio === 'string' ? o.municipio.slice(0, 80) : null,
    consent: true, consentAt: o.consentAt || o.createdAt, consentContact: !!o.consentContact,
    contact: (o.consentContact && o.contact && typeof o.contact.name === 'string' && typeof o.contact.phone === 'string') ? { name: o.contact.name.slice(0, 120), phone: o.contact.phone.replace(/\D/g, '').slice(0, 15) } : null,
    ans, txt: cleanTxt(o.txt), bmiCat: o.bmiCat === undefined ? null : o.bmiCat, alert: !!o.alert, score: o.score,
    riskClass: o.riskClass, riskLabel: String(o.riskLabel || ''),
    steps: Array.isArray(o.steps) ? o.steps.filter(x => typeof x === 'string').slice(0, 20) : [],
  };
}

}

let admImportMsg = '';
async function importPdfFiles(files) {
  let added = 0, updated = 0, dup = 0, bad = 0, kept = 0, nokeep = 0;
  const have = new Map(adminRecords.map(r => [r.id, r]));
  for (const f of files) {
    try {
      const rec = await readPdfRecord(f);
      if (!rec) { bad++; continue; }
      const old = have.get(rec.id);
      if (old && String(rec.updatedAt) <= String(old.updatedAt || '')) dup++;
      else {
        await storeImportedRecord(rec);
        have.set(rec.id, rec);
        if (old) updated++; else added++;
      }
      try { await storeImportedPdf(rec.id, new Uint8Array(await f.arrayBuffer())); kept++; } catch (e) { nokeep++; }
    } catch (e) { bad++; }
  }
  await loadAdminRecords();
  const parts = [];
  if (added) parts.push(`${added} adicionado(s) ao relatório`);
  if (updated) parts.push(`${updated} atualizado(s)`);
  if (dup) parts.push(`${dup} já estava(m) no relatório`);
  if (kept) parts.push(`${kept} PDF(s) guardado(s) no app`);
  if (nokeep) parts.push(`${nokeep} PDF(s) não guardado(s)`);
  if (bad) parts.push(`${bad} arquivo(s) sem dados da triagem MAVI`);
  admImportMsg = parts.join(' · ') || 'Nenhum arquivo selecionado.';
  renderDashboard();
}

let adminSenders = 0;
let adminCloudMode = false;
let cloudBadRecs = 0;
async function cloudLoadRecords(cloud) {
  cloudBadRecs = 0;
  const senders = await cloud.db.collection('inbox').get();
  const raws = [];
  for (const s of senders.docs) {
    const recs = await cloud.db.collection(`inbox/${s.id}/recs`).get();
    let bad = 0;
    recs.docs.forEach(d => { try { const b = d.data(); raws.push({ id: d.id, iv: b64dec(b.iv), ek: b64dec(b.ek), ct: b64dec(b.ct) }); } catch (e) { bad++; } });
    cloudBadRecs += bad;
  }
  const out = await Promise.all(raws.map(r => decryptRecord(adminPrivKey, r).catch(() => null)));
  adminRecords = out.filter(Boolean).filter(r => r.createdAt && r.ans && typeof r.ans === 'object');
  adminQ2 = dedupeRecords(out.filter(r => r && r.kind === 'q2' && Array.isArray(r.q2)));
  adminUnreadable = raws.length - adminRecords.length - adminQ2.length + cloudBadRecs;
  adminRecords = dedupeRecords(adminRecords);
  adminSenders = senders.size;
  adminCloudMode = true;
}

async function cloudWipe(cloud) {
  const senders = await cloud.db.collection('inbox').get();
  for (const s of senders.docs) {
    const recs = await cloud.db.collection(`inbox/${s.id}/recs`).get();
    for (const d of recs.docs) await cloud.db.doc(`inbox/${s.id}/recs/${d.id}`).delete();
    for (const sub of ['pdfs', 'pdfmeta']) {
      const ds = await cloud.db.collection(`inbox/${s.id}/${sub}`).get();
      for (const d of ds.docs) await cloud.db.doc(`inbox/${s.id}/${sub}/${d.id}`).delete();
    }
    await cloud.db.doc(`inbox/${s.id}`).delete();
  }
}

function niceMax(v) {
  if (v <= 1) return 1;
  const pow = Math.pow(10, Math.floor(Math.log10(v)));
  for (const m of [1, 2, 4, 5, 10]) if (m * pow >= v) return m * pow;
  return 10 * pow;
}

function isoDay(d) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}

// Série contínua (dias/semanas/meses sem coleta aparecem como zero).
function evolutionSeries(recs) {
  const days = { '7': 7, '30': 30, '90': 90, '365': 365 }[adminFilters.period];
  const now = new Date();
  let start;
  if (days) start = new Date(now.getTime() - (days - 1) * 864e5);
  else if (recs.length) start = new Date(Math.min(...recs.map(r => Date.parse(r.createdAt))));
  else start = new Date(now.getTime() - 6 * 864e5);
  start.setHours(0, 0, 0, 0);
  const spanDays = Math.round((now - start) / 864e5) + 1;
  const gran = spanDays <= 45 ? 'day' : spanDays <= 200 ? 'week' : 'month';

  const keyOf = (d) => {
    const x = new Date(d); x.setHours(0, 0, 0, 0);
    if (gran === 'week') { const wd = (x.getDay() + 6) % 7; x.setDate(x.getDate() - wd); }
    if (gran === 'month') x.setDate(1);
    return isoDay(x);
  };
  const buckets = [];
  const cur = new Date(keyOf(start) + 'T00:00:00');
  const endKey = keyOf(now);
  let guard = 0;
  while (guard++ < 800) {
    const k = isoDay(cur);
    buckets.push({ key: k, date: new Date(cur), v: 0 });
    if (k >= endKey) break;
    if (gran === 'day') cur.setDate(cur.getDate() + 1);
    else if (gran === 'week') cur.setDate(cur.getDate() + 7);
    else cur.setMonth(cur.getMonth() + 1);
  }
  const idx = Object.fromEntries(buckets.map((b, i) => [b.key, i]));
  recs.forEach(r => { const i = idx[keyOf(new Date(r.createdAt))]; if (i !== undefined) buckets[i].v++; });
  return { buckets, gran };
}

function bucketLabel(b, gran, long) {
  const d = b.date;
  const months = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
  if (gran === 'month') return `${months[d.getMonth()]}${long ? '/' + d.getFullYear() : ''}`;
  const dm = `${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth() + 1).padStart(2, '0')}`;
  return gran === 'week' ? (long ? `semana de ${dm}` : dm) : dm;
}

function renderEvolution(container, recs) {
  const { buckets, gran } = evolutionSeries(recs);
  const W = Math.max(280, container.clientWidth || 320);
  const H = 190, pL = 34, pR = 18, pT = 16, pB = 26;
  const w = W - pL - pR, h = H - pT - pB;
  const maxV = niceMax(Math.max(1, ...buckets.map(b => b.v)));
  const n = buckets.length;
  const x = i => pL + (n === 1 ? w / 2 : i * w / (n - 1));
  const y = v => pT + h - (v / maxV) * h;
  const ticks = [0, maxV / 2, maxV].filter(t => Number.isInteger(t));
  const line = buckets.map((b, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(b.v).toFixed(1)}`).join('');
  const area = `${line}L${x(n - 1).toFixed(1)},${y(0)}L${x(0).toFixed(1)},${y(0)}Z`;
  const last = buckets[n - 1];
  const xl = [0, Math.floor((n - 1) / 2), n - 1].filter((v, i, a) => a.indexOf(v) === i);
  container.innerHTML = `
    <div class="area-wrap">
      <svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Questionários recebidos por ${gran === 'day' ? 'dia' : gran === 'week' ? 'semana' : 'mês'}">
        ${ticks.map(t => `<line x1="${pL}" x2="${W - pR}" y1="${y(t)}" y2="${y(t)}" stroke="var(--viz-grid)" stroke-width="1"/>
          <text x="${pL - 6}" y="${y(t) + 4}" text-anchor="end" font-size="11" fill="var(--viz-text-3)">${t}</text>`).join('')}
        ${xl.map(i => `<text x="${x(i)}" y="${H - 6}" text-anchor="${i === 0 && n > 1 ? 'start' : i === n - 1 && n > 1 ? 'end' : 'middle'}" font-size="11" fill="var(--viz-text-3)">${bucketLabel(buckets[i], gran)}</text>`).join('')}
        <path d="${area}" fill="var(--viz-1)" fill-opacity="0.1"/>
        <path d="${line}" fill="none" stroke="var(--viz-1)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
        <circle cx="${x(n - 1)}" cy="${y(last.v)}" r="4" fill="var(--viz-1)" stroke="var(--viz-surface)" stroke-width="2"/>
        <text x="${Math.min(x(n - 1), W - pR)}" y="${y(last.v) - 9}" text-anchor="end" font-size="11.5" font-weight="600" fill="var(--viz-text-1)" stroke="var(--viz-surface)" stroke-width="3" paint-order="stroke">${last.v}</text>
        <line id="evCross" x1="0" x2="0" y1="${pT}" y2="${pT + h}" stroke="var(--viz-text-3)" stroke-width="1" visibility="hidden"/>
        <circle id="evDot" r="5" fill="var(--viz-1)" stroke="var(--viz-surface)" stroke-width="2" visibility="hidden"/>
        <rect id="evHit" x="${pL}" y="0" width="${w}" height="${H}" fill="transparent"/>
      </svg>
      <div class="area-tip" id="evTip"></div>
    </div>`;
  const svg = container.querySelector('svg');
  const hit = container.querySelector('#evHit');
  const cross = container.querySelector('#evCross');
  const dot = container.querySelector('#evDot');
  const tip = container.querySelector('#evTip');
  const show = (clientX) => {
    const rect = svg.getBoundingClientRect();
    const sx = (clientX - rect.left) * (W / rect.width);
    const i = n === 1 ? 0 : Math.max(0, Math.min(n - 1, Math.round((sx - pL) / (w / (n - 1)))));
    const b = buckets[i];
    cross.setAttribute('x1', x(i)); cross.setAttribute('x2', x(i)); cross.setAttribute('visibility', 'visible');
    dot.setAttribute('cx', x(i)); dot.setAttribute('cy', y(b.v)); dot.setAttribute('visibility', 'visible');
    tip.innerHTML = `<strong>${bucketLabel(b, gran, true)}</strong><br>${b.v} questionário${b.v === 1 ? '' : 's'}`;
    tip.style.display = 'block';
    const px = x(i) * (rect.width / W);
    const tw = tip.offsetWidth;
    tip.style.left = Math.max(0, Math.min(rect.width - tw, px - tw / 2)) + 'px';
    tip.style.top = Math.max(0, y(b.v) * (rect.height / H) - tip.offsetHeight - 12) + 'px';
  };
  const hide = () => { cross.setAttribute('visibility', 'hidden'); dot.setAttribute('visibility', 'hidden'); tip.style.display = 'none'; };
  hit.addEventListener('pointermove', e => show(e.clientX));
  hit.addEventListener('pointerdown', e => show(e.clientX));
  hit.addEventListener('pointerleave', hide);
}

// Mapa de calor: mês × período do dia, com contagens reais.
const HM_RAMP = ['#cde2fb', '#9ec5f4', '#6da7ec', '#3987e5', '#256abf', '#184f95'];
function heatmapHTML(recs) {
  if (!recs.length) return `<div class="adm-empty">Sem dados para os filtros atuais.</div>`;
  const months = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
  const per = d => { const hr = d.getHours(); return hr >= 5 && hr < 12 ? 0 : hr >= 12 && hr < 18 ? 1 : 2; };
  const map = {};
  recs.forEach(r => {
    const d = new Date(r.createdAt);
    const k = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
    (map[k] = map[k] || [0, 0, 0])[per(d)]++;
  });
  const keys = Object.keys(map).sort().slice(-12);
  const max = Math.max(1, ...keys.flatMap(k => map[k]));
  const cell = v => {
    if (!v) return `<div class="hm-cell" style="background:var(--viz-track);color:var(--viz-text-3)" title="Nenhum questionário">0</div>`;
    const step = Math.min(HM_RAMP.length - 1, Math.floor((v / max) * (HM_RAMP.length - 1) + 0.0001));
    return `<div class="hm-cell" style="background:${HM_RAMP[step]};color:${step >= 3 ? '#fff' : 'var(--viz-text-1)'}" title="${v} questionário${v === 1 ? '' : 's'}">${v}</div>`;
  };
  const head = `<div></div><div class="hm-h">Manhã</div><div class="hm-h">Tarde</div><div class="hm-h">Noite</div>`;
  const rows = keys.map(k => {
    const [yy, mm] = k.split('-');
    return `<div class="hm-r">${months[+mm - 1]}/${yy}</div>${map[k].map(cell).join('')}`;
  }).join('');
  const legend = `<div class="hm-legend">menos ${HM_RAMP.map(c => `<i style="background:${c}"></i>`).join('')} mais</div>`;
  return `<div class="hm" style="grid-template-columns:auto repeat(3, minmax(0,1fr))">${head}${rows}</div>${legend}`;
}

MiniPDF.prototype.path = function (pts, o) {
  if (pts.length < 2) return;
  const d = pts.map((p, i) => `${this.n(p[0])} ${this.n(this.H - p[1])} ${i ? 'l' : 'm'}`).join(' ');
  const ops = [];
  if (o.fill) ops.push(`${this.rgb(o.fill)} rg`);
  if (o.stroke) ops.push(`${this.rgb(o.stroke)} RG ${this.n(o.lw || 1)} w 1 j 1 J`);
  this.cur.push(`q ${ops.join(' ')} ${d} ${o.fill ? 'h f' : 'S'} Q`);
};

const PDF_VIZ = { blue: [42, 120, 214], wash: [229, 239, 251], track: [240, 239, 236], grid: [231, 229, 223],
  good: [12, 163, 12], warn: [250, 178, 25], serious: [236, 131, 90], critical: [208, 59, 59] };
const PDF_HM = [[205, 226, 251], [158, 197, 244], [109, 167, 236], [57, 135, 229], [37, 106, 191], [24, 79, 149]];

function dashboardModel(recs) {
  const total = recs.length;
  const highRisk = recs.filter(isHigh).length;
  const interestExam = recs.filter(r => r.ans.I3n === 0).length;
  const contactOk = recs.filter(r => r.consentContact).length;
  const cities = Array.from(new Set([...MUNICIPIOS, ...adminRecords.map(r => r.municipio).filter(Boolean)]));
  const statusPdf = { 'risk-alert': PDF_VIZ.critical, 'risk-high': PDF_VIZ.serious, 'risk-mod': PDF_VIZ.warn, 'risk-low': PDF_VIZ.good };
  const charts = [];
  const push = (title, sub, items, base, dots) => charts.push({ title, sub, items, base, dots });
  const q = (id, title, note, sort) => {
    const d = ansDist(recs, id);
    push(title, `Pergunta ${id}. ${note ? note + ' ' : ''}${baseNote(d.base, d.missing)}`, sort ? [...d.items].sort((a, b) => b.n - a.n) : d.items, d.base);
  };
  push('Classificação da triagem', `Resultado calculado pelo questionário (triagem, não diagnóstico). Base: ${total}.`,
    RISK_CLASSES.map(([cls, label, css]) => ({ label, css, color: statusPdf[cls], n: recs.filter(r => r.riskClass === cls).length })), total, true);
  push('Próximos passos sugeridos (oportunidades)', `Quantas pessoas receberam cada sugestão na tela de resultado. Com sinal de alerta não há sugestão de venda. Base: ${total}.`,
    STEP_TITLES.map(t => ({ label: t, n: recs.filter(r => Array.isArray(r.steps) && r.steps.includes(t)).length })).sort((a, b) => b.n - a.n), total);
  push('Pontos de atenção autorreferidos', `Percentual de pessoas que informaram cada ponto. Uma pessoa pode ter vários. Base: ${total}.`,
    RISK_FACTORS.map(([label, fn]) => ({ label, n: recs.filter(fn).length })).sort((a, b) => b.n - a.n), total);
  push('Não sabe ou nunca mediu', `Pessoas sem informação sobre a própria saúde: principal motivo para oferecer exames. Base: ${total}.`,
    UNKNOWN_FACTORS.map(([label, fn]) => ({ label, n: recs.filter(fn).length })).sort((a, b) => b.n - a.n), total);
  push('Sinais de alerta', `Uma pessoa pode ter mais de um. Base: ${total}.`,
    ALERT_IDS.map(id => ({ label: ITEM[id].q.replace(/^O\(a\) senhor\(a\) /, '').replace(/\?$/, ''), n: recs.filter(r => r.ans[id] === 0).length })), total);
  q('I3n', 'Teria outro plano se a proposta fosse boa', '');
  q('I1n', 'Satisfeito(a) com o plano atual', '');
  q('I2n', 'Sabe o que é consulta online', '');
  push('Valor ideal do plano para a família', `Valor mensal digitado pelo captador (R$). Base: ${recs.filter(r => idealVal(r) !== null).length}.`, idealBins(recs), recs.filter(r => idealVal(r) !== null).length);
  q('C4', 'O que mais atrapalha cuidar da saúde', '', true);
  q('C6n', 'Como faz exames de rotina', '');
  q('C3n', 'Plano funerário ou cartão de desconto', 'Pode marcar mais de um.');
  q('C5', 'Últimos exames de sangue', '');
  q('C2', 'Último eletrocardiograma', '');
  q('F2n', 'Alguém da família com problema de saúde', '');
  q('D7n', 'Gordura no fígado', '');
  q('D8n', 'Problema de circulação e/ou varizes', '');
  q('D9n', 'Problema nos ossos', '');
  q('D10n', 'Emocional ultimamente', '');
  q('P2', 'Faixa etária', '');
  push('Municípios', `Base: ${total}.`, [...cities.map(c => ({ label: c, n: recs.filter(r => r.municipio === c).length })),
    { label: 'Não informado', n: recs.filter(r => !r.municipio).length }].filter(it => it.n > 0).sort((a, b) => b.n - a.n), total);
  return {
    total,
    kpis: [
      ['Questionários', String(total), 'no filtro atual'],
      ['Alerta ou risco alto', fmtPct(highRisk, total), `${highRisk} pessoa${highRisk === 1 ? '' : 's'}`],
      ['Abertos a outro plano', fmtPct(interestExam, total), `${interestExam} pessoa${interestExam === 1 ? '' : 's'}`],
      ['Autorizaram contato', fmtPct(contactOk, total), `${contactOk} pessoa${contactOk === 1 ? '' : 's'}`],
    ],
    charts,
  };
}

function pdfChartTitle(pdf, flow, title, sub) {
  pdf.text(flow.x, flow.y + 11, title, 'F2', 11.5, PDF_C.ink);
  flow.y += 16;
  pdfWrap(sub, 'F1', 8.3, flow.w).forEach(l => { pdf.textEnc(flow.x, flow.y + 8.3, l, 'F1', 8.3, PDF_C.gray); flow.y += 11; });
  flow.y += 5;
}

function pdfBarChart(pdf, flow, ch) {
  const rowH = 24;
  const subLines = pdfWrap(ch.sub, 'F1', 8.3, flow.w).length;
  const bodyH = ch.base ? ch.items.length * rowH : 20;
  const h = 16 + subLines * 11 + 5 + bodyH + 12;
  flow.space(Math.min(h, pdf.H - PDF_M.top - PDF_M.bottom));
  pdfChartTitle(pdf, flow, ch.title, ch.sub);
  if (!ch.base) { pdf.text(flow.x, flow.y + 9, 'Sem dados para os filtros atuais.', 'F3', 9, PDF_C.light); flow.y += 20 + 12; return; }
  ch.items.forEach(it => {
    flow.space(rowH);
    const val = pdfEnc(`${fmtPct(it.n, ch.base)} · ${it.n}`);
    const vw = pdfTextWidth(val, 'F1', 8.8);
    let lx = flow.x;
    if (ch.dots) { pdf.rect(flow.x, flow.y + 2.5, 6.5, 6.5, { fill: it.color }); lx += 11; }
    const lab = pdfWrap(it.label, 'F1', 9, flow.w - vw - 20 - (lx - flow.x))[0];
    pdf.textEnc(lx, flow.y + 9, lab, 'F1', 9, PDF_C.ink);
    pdf.textEnc(flow.x + flow.w - vw, flow.y + 9, val, 'F1', 8.8, PDF_C.gray);
    const by = flow.y + 12.5, bh = 7;
    pdf.rect(flow.x, by, flow.w, bh, { fill: PDF_VIZ.track });
    const bw = Math.min(1, it.n / ch.base) * flow.w;
    if (it.n > 0) pdf.rect(flow.x, by, Math.max(2, bw), bh, { fill: it.color || PDF_VIZ.blue });
    flow.y += rowH;
  });
  flow.y += 12;
}

function pdfEvolution(pdf, flow, recs) {
  const { buckets, gran } = evolutionSeries(recs);
  const sub = `Questionários concluídos por ${gran === 'day' ? 'dia' : gran === 'week' ? 'semana' : 'mês'} ${adminCloudMode ? 'em todos os aparelhos que enviaram' : 'neste aparelho'}.`;
  const ch = 130;
  flow.space(16 + 11 + 5 + ch + 30);
  pdfChartTitle(pdf, flow, 'Evolução dos questionários recebidos', sub);
  const pL = 26, x0 = flow.x + pL, w = flow.w - pL - 8, top = flow.y, bottom = flow.y + ch;
  const maxV = niceMax(Math.max(1, ...buckets.map(b => b.v)));
  const n = buckets.length;
  const X = i => x0 + (n === 1 ? w / 2 : i * w / (n - 1));
  const Y = v => bottom - (v / maxV) * ch;
  [0, maxV / 2, maxV].filter(t => Number.isInteger(t)).forEach(t => {
    pdf.line(x0, Y(t), x0 + w, Y(t), PDF_VIZ.grid, 0.6);
    const s = pdfEnc(String(t));
    pdf.textEnc(x0 - 5 - pdfTextWidth(s, 'F1', 8), Y(t) + 3, s, 'F1', 8, PDF_C.light);
  });
  const pts = buckets.map((b, i) => [X(i), Y(b.v)]);
  pdf.path([...pts, [X(n - 1), Y(0)], [X(0), Y(0)]], { fill: PDF_VIZ.wash });
  pdf.path(pts, { stroke: PDF_VIZ.blue, lw: 1.6 });
  const last = buckets[n - 1];
  pdf.rect(X(n - 1) - 2.5, Y(last.v) - 2.5, 5, 5, { fill: PDF_VIZ.blue });
  const lv = pdfEnc(String(last.v));
  pdf.textEnc(X(n - 1) - pdfTextWidth(lv, 'F2', 8.5) - 5, Y(last.v) - 5, lv, 'F2', 8.5, PDF_C.ink);
  const idxs = [0, Math.floor((n - 1) / 2), n - 1].filter((v, i, a) => a.indexOf(v) === i);
  idxs.forEach(i => {
    const s = pdfEnc(bucketLabel(buckets[i], gran, gran === 'month'));
    const sw = pdfTextWidth(s, 'F1', 8);
    const tx = i === 0 && n > 1 ? X(i) : i === n - 1 && n > 1 ? X(i) - sw : X(i) - sw / 2;
    pdf.textEnc(tx, bottom + 12, s, 'F1', 8, PDF_C.light);
  });
  flow.y = bottom + 30;
}

function pdfHeatmap(pdf, flow, recs) {
  const months = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
  const per = d => { const hr = d.getHours(); return hr >= 5 && hr < 12 ? 0 : hr >= 12 && hr < 18 ? 1 : 2; };
  const map = {};
  recs.forEach(r => { const d = new Date(r.createdAt); const k = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`; (map[k] = map[k] || [0, 0, 0])[per(d)]++; });
  const keys = Object.keys(map).sort().slice(-12);
  const sub = 'Mês × período do dia (manhã 5h–12h, tarde 12h–18h, noite 18h–5h). Contagens reais; meses sem coleta não aparecem.';
  const cellH = 20, rows = Math.max(1, keys.length);
  flow.space(16 + 22 + 5 + 16 + rows * (cellH + 2) + 14);
  pdfChartTitle(pdf, flow, 'Quando os questionários são concluídos', sub);
  if (!keys.length) { pdf.text(flow.x, flow.y + 9, 'Sem dados para os filtros atuais.', 'F3', 9, PDF_C.light); flow.y += 26; return; }
  const max = Math.max(1, ...keys.flatMap(k => map[k]));
  const labW = 60, cw = (flow.w - labW - 4) / 3;
  ['Manhã', 'Tarde', 'Noite'].forEach((h, j) => { const s = pdfEnc(h); pdf.textEnc(flow.x + labW + j * (cw + 2) + cw / 2 - pdfTextWidth(s, 'F1', 8.5) / 2, flow.y + 9, s, 'F1', 8.5, PDF_C.gray); });
  flow.y += 14;
  keys.forEach(k => {
    const [yy, mm] = k.split('-');
    pdf.text(flow.x, flow.y + 13, `${months[+mm - 1]}/${yy}`, 'F1', 8.5, PDF_C.gray);
    map[k].forEach((v, j) => {
      const cx = flow.x + labW + j * (cw + 2);
      const step = v ? Math.min(PDF_HM.length - 1, Math.floor((v / max) * (PDF_HM.length - 1) + 0.0001)) : -1;
      pdf.rect(cx, flow.y, cw, cellH, { fill: step < 0 ? PDF_VIZ.track : PDF_HM[step] });
      const s = pdfEnc(String(v));
      pdf.textEnc(cx + cw / 2 - pdfTextWidth(s, 'F2', 9) / 2, flow.y + 13.5, s, 'F2', 9, step >= 3 ? [255, 255, 255] : (step < 0 ? PDF_C.light : PDF_C.ink));
    });
    flow.y += cellH + 2;
  });
  flow.y += 14;
}

    ['Período', periodLabel], ['Município', cityLabel], ['Faixa etária', ageLabel],

    pdfWrap(label, 'F1', 7.8, kw - 14).slice(0, 2).forEach((l, j) => pdf.textEnc(kx + 7, flow.y + 12 + j * 9.5, l, 'F1', 7.8, PDF_C.gray));
    pdf.text(kx + 7, flow.y + 41, value, 'F2', 15, PDF_C.ink);

  flow.y += kh + 18;

  pdfFooters(pdf, `MAVI Assistência à Saúde — relatório agregado da área restrita. Gerado em ${dateStr} às ${timeStr}.`);
  return pdf.output();
}

async function exportDashboardPDF() {
  const box = document.getElementById('admPdfArea');
  const y = new Date(); const stamp = `${y.getFullYear()}-${String(y.getMonth() + 1).padStart(2, '0')}-${String(y.getDate()).padStart(2, '0')}`;
  const name = `MAVI_Relatorio_Triagem_${stamp}.pdf`;
  let bytes;
  try { bytes = buildDashboardPDF(); } catch (e) { box.innerHTML = `<div class="adm-err">Não foi possível gerar o relatório.</div>`; return; }
  bumpAdminIdle();
  if (window.claude && typeof window.claude.use === 'function') {
    box.innerHTML = `<p class="adm-sub">⏳ Confirme o salvamento do PDF na janela que vai aparecer…</p>`;
    const dl = await window.claude.use('downloads');
    if (!dl) { box.innerHTML = `<div class="adm-err">Salvar arquivos não está disponível nesta tela.</div>`; return; }
    try {
      await dl.save({ filename: name, data: new Blob([bytes], { type: 'application/pdf' }) });
      box.innerHTML = `<p class="adm-sub">✅ Relatório salvo no aparelho (pasta Download).</p>`;
    } catch (e) {
      box.innerHTML = e && e.code === 'declined' ? `<p class="adm-sub">Salvamento cancelado.</p>` : `<div class="adm-err">Não foi possível salvar (${(e && e.code) || 'erro'}).</div>`;
    }
    return;
  }
  const url = URL.createObjectURL(new Blob([bytes], { type: 'application/pdf' }));
  let file = null, canShare = false;
  try { file = new File([bytes], name, { type: 'application/pdf' }); canShare = !!(navigator.canShare && navigator.canShare({ files: [file] })); } catch (e) {}
  box.innerHTML = `
    <a class="adm-btn" style="text-align:center;text-decoration:none" href="${url}" download="${name}">⬇️ Baixar relatório (PDF)</a>
    ${canShare ? `<button class="adm-btn" id="admPdfShare" type="button" style="background:var(--whatsapp)">📤 Enviar relatório</button>` : ''}
    <p class="adm-sub" style="margin-top:8px">O arquivo fica na pasta Download do aparelho. Trate como confidencial.</p>`;
  const sb = document.getElementById('admPdfShare');
  if (sb) sb.addEventListener('click', async () => { try { await navigator.share({ files: [file], title: name }); } catch (e) {} });
}

const EXREL_KEY = 'mavi_exam_release_v1';
function exRelRead() { try { return JSON.parse(localStorage.getItem(EXREL_KEY) || '{}') || {}; } catch (e) { return {}; } }
function exRelWrite(m) { try { localStorage.setItem(EXREL_KEY, JSON.stringify(m)); } catch (e) {} }
let admExamOpen = null, admExamOff = {}, admExamMsg = '', admExamLimit = 10, admExamLast = null;
function fmtDT(d) { try { return new Date(d).toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' }); } catch (e) { return ''; } }

function examAdminHTML(recs) {
  const rel = exRelRead();
  const rows = recs.map(r => ({ r, list: examSuggestions(r) })).filter(x => x.list.length)
    .sort((a, b) => String(b.r.createdAt).localeCompare(String(a.r.createdAt)));
  const shown = rows.slice(0, admExamLimit);
  const items = shown.map(({ r, list }) => {
    const id = r.id || '';
    const code = id.slice(0, 8).toUpperCase();
    const nm = r.contact && r.contact.name ? r.contact.name : 'Triagem ' + code;
    const age = (r.ans && r.ans.P2 !== null && r.ans.P2 !== undefined) ? ITEM.P2.opts[r.ans.P2] : '';
    const riskTxt = isAlertRec(r) ? 'Sinal de alerta' : (r.riskLabel || '');
    const done = rel[id];
    const open = admExamOpen === id;

      const keys = []; list.forEach(x => x.refs.forEach(k => { if (!keys.includes(k)) keys.push(k); }));
      const row = x => `<label class="ex-row"><input type="checkbox" class="ex-chk-adm" data-id="${x.id}" ${admExamOff[x.id] ? '' : 'checked'}><span><strong>${escapeHtml(examLabel(x))}</strong><em>${escapeHtml(examWhyText(x, keys))}</em></span></label>`;
      detail = `<div style="flex-basis:100%;margin-top:8px">
        ${list.map(row).join('')}
        <p class="adm-sub" style="margin:8px 0 0">Só os exames marcados entram no pedido. O PDF sai sem nome do paciente e sem nome ou CRM do médico; assinatura e carimbo ficam em branco.</p>
        <button class="adm-btn" type="button" data-ex-release="${escapeHtml(id)}">✅ Liberar pedido e gerar PDF</button>
        ${admExamMsg ? `<p class="adm-sub"><strong>${escapeHtml(admExamMsg)}</strong></p>` : ''}
        ${(admExamMsg && admExamLast && admExamLast.id === id) ? `<button class="adm-btn" type="button" data-ex-again="${escapeHtml(id)}" style="margin-top:6px">⬇️ Baixar o PDF do pedido</button>` : ''}</div>`;
    }
    return `<div class="ct-item" style="flex-wrap:wrap">
      <div class="ct-main">
        <strong>${escapeHtml(nm)}</strong>
        <span class="ct-phone">${escapeHtml([fmtDT(r.createdAt), r.municipio, age].filter(Boolean).join(' · '))}</span>
        <span class="ct-tags"><span class="ct-tag">${list.length} exame(s) sugerido(s)</span>${riskTxt ? `<span class="ct-tag">${escapeHtml(riskTxt)}</span>` : ''}${done ? `<span class="ct-tag">Liberado em ${escapeHtml(fmtDT(done.at))}</span>` : ''}</span>
      </div>
      <button class="ct-wa" type="button" style="background:var(--blue)" data-ex-open="${escapeHtml(id)}">${open ? 'Fechar' : (done ? 'Rever' : 'Revisar')}</button>
      ${detail}
    </div>`;
  }).join('');
  const more = rows.length > shown.length ? `<button class="adm-btn" id="exMore" type="button" style="margin-top:10px">Mostrar mais (${rows.length - shown.length})</button>` : '';
  return `<section class="adm-card">
      <h3>🧪 Pedido de exames (só você libera)</h3>
      <p class="adm-sub">Triagens com exames sugeridos. Nenhum pedido existe até você revisar e liberar aqui. ${fmtInt(rows.length)} triagem(ns) no período e município escolhidos.</p>
      ${items || '<p class="adm-sub">Nenhuma triagem com exame sugerido.</p>'}
      ${more}
    </section>`;
}

function buildExamOrderPDF(rec, list) {
  const { dateStr, timeStr } = pdfMeta();
  const keys = []; list.forEach(x => x.refs.forEach(k => { if (!keys.includes(k)) keys.push(k); }));
  const pdf = newMaviPdf(), flow = new PdfFlow(pdf);
  pdfHeader(pdf, flow, 'Pedido de Exames', dateStr, timeStr);
  let created = '';
  try { created = new Date(rec.createdAt).toLocaleDateString('pt-BR'); } catch (e) {}
  pdfMetaBox(pdf, flow, [
    ['Triagem de referência', (rec.id || '').slice(0, 8).toUpperCase() || '—'],
    ['Data da triagem', created || '—'],
    ['Pedido liberado em', `${dateStr} às ${timeStr}`],
  ]);
  pdfSection(pdf, flow, 'Avaliação da triagem');
  {
    const ageTxt = (rec.ans && rec.ans.P2 !== null && rec.ans.P2 !== undefined && ITEM.P2.opts[rec.ans.P2]) ? ITEM.P2.opts[rec.ans.P2] : '—';
    const attn = RISK_FACTORS.filter(f => { try { return f[1](rec); } catch (e) { return false; } }).map(f => f[0]);
    const unk = UNKNOWN_FACTORS.filter(f => { try { return f[1](rec); } catch (e) { return false; } }).map(f => f[0]);
    const rows = [
      ['Classificação', isAlertRec(rec) ? 'Sinal de alerta: procurar atendimento médico' : (rec.riskLabel || '—')],
      ['Pontuação', (rec.score !== undefined && rec.score !== null) ? String(rec.score) + ' pontos' : '—'],
      ['Faixa de idade', ageTxt],
      ['Município', rec.municipio || '—'],
      ['Pontos de atenção', attn.length ? attn.join('; ') : 'nenhum informado'],
    ];
    if (unk.length) rows.push(['Informações que faltam', unk.join('; ')]);
    pdfMetaBox(pdf, flow, rows);
  }
  pdfSection(pdf, flow, 'Exames solicitados');
  list.forEach(x => pdfExamItem(pdf, flow, examTag(x), examLabel(x), examWhyText(x, keys)));
  examTotalLines(list).forEach((l, i) => { flow.para(l, { size: i ? 8 : 9.5, color: i ? PDF_C.gray : PDF_C.ink, lh: 1.4 }); flow.gap(2); });
  flow.gap(6);
  flow.para('Referências', { size: 9.5, lh: 1.4 });
  keys.forEach((k, i) => { flow.para((i + 1) + '. ' + EX_REFS[k], { size: 8, color: PDF_C.gray, lh: 1.35 }); flow.gap(2); });
  flow.gap(20);
  flow.space(50);
  pdf.line(flow.x, flow.y + 24, flow.x + 250, flow.y + 24, PDF_C.ink, 0.8);
  pdf.text(flow.x, flow.y + 36, 'Assinatura e carimbo do médico', 'F1', 8.5, PDF_C.gray);
  flow.y += 48;
  pdfDisclaimer(pdf, flow, 'Pedido liberado após revisão das respostas da triagem. Não substitui consulta nem diagnóstico. Só tem validade com a assinatura e o carimbo do médico.');
  pdfFooters(pdf, `MAVI Assistência à Saúde — pedido de exames. Gerado em ${dateStr} às ${timeStr}.`);
  return pdf.output();
}

// ---------------- Contatos para retorno ----------------
const adminContactFilters = { risk: '', interest: '', mode: 'and', limit: 30, pdfLimit: 10 };
let admPdfMsg = '';
const isAlertRec = r => r.riskClass === 'risk-alert' || r.alert;
function ansHas(r, id, idx) { const v = r.ans && r.ans[id]; return Array.isArray(v) ? v.includes(idx) : v === idx; }
const RISK_FILTERS = [
  ['', 'Qualquer risco'],
  ['alert', 'Sinal de alerta'],
  ['high', 'Risco alto'],
  ['modplus', 'Risco moderado ou alto'],
  ['low', 'Risco baixo'],
];
const INTEREST_FILTERS = [
  ['', 'Qualquer interesse'],
  ['plan', 'Teria outro plano (aberto a proposta)'],
  ['unsat', 'Insatisfeito(a) com o plano atual'],
];
function recRiskMatch(r, f) {
  if (f === 'alert') return isAlertRec(r);
  if (f === 'high') return r.riskClass === 'risk-high';
  if (f === 'modplus') return r.riskClass === 'risk-mod' || r.riskClass === 'risk-high' || isAlertRec(r);
  if (f === 'low') return r.riskClass === 'risk-low';
  return true;
}
function recInterestMatch(r, f) {
  if (f === 'plan') return ansHas(r, 'I3n', 0);
  if (f === 'unsat') return ansHas(r, 'I1n', 1);
  return true;
}
function contactRows(recs) {
  const withContact = recs.filter(r => r.consentContact && r.contact && r.contact.phone);
  const { risk, interest, mode } = adminContactFilters;
  const rows = withContact.filter(r => {
    if (risk && interest) {
      const a = recRiskMatch(r, risk), b = recInterestMatch(r, interest);
      return mode === 'or' ? (a || b) : (a && b);
    }
    return recRiskMatch(r, risk) && recInterestMatch(r, interest);
  });
  rows.sort((a, b) => String(b.createdAt).localeCompare(String(a.createdAt)));
  return { rows, total: withContact.length };
}
function waDigits(p) {
  let d = String(p || '').replace(/\D/g, '');
  if (d.length === 10 || d.length === 11) d = '55' + d;
  return d;
}
function fmtPhone(p) {
  const d = String(p || '').replace(/\D/g, '');
  if (d.length === 11) return `(${d.slice(0, 2)}) ${d.slice(2, 7)}-${d.slice(7)}`;
  if (d.length === 10) return `(${d.slice(0, 2)}) ${d.slice(2, 6)}-${d.slice(6)}`;
  return d;
}
function interestTags(r) {
  const t = [];
  if (ansHas(r, 'I3n', 0)) t.push('Teria outro plano');
  if (ansHas(r, 'I1n', 1)) t.push('Insatisfeito(a) com o plano atual');
  if (ansHas(r, 'I2n', 0)) t.push('Sabe o que é consulta online');
  return t;
}
function contactsHTML(recs) {
  const { rows, total } = contactRows(recs);
  const sel = (arr, cur) => arr.map(([v, l]) => `<option value="${v}" ${v === cur ? 'selected' : ''}>${l}</option>`).join('');
  const shown = rows.slice(0, adminContactFilters.limit);
  const list = shown.map(r => {
    const first = (r.contact.name || '').trim().split(/\s+/)[0] || '';
    const msg = `Olá${first ? ', ' + first : ''}! Aqui é do Mavi Assistência em Saúde, gostaríamos de saber se a senhora gostaria de receber dicas e orientações de saúde.`;
    const href = `https://wa.me/${waDigits(r.contact.phone)}?text=${encodeURIComponent(msg)}`;
    const tags = interestTags(r).map(x => `<span class="ct-tag">${escapeHtml(x)}</span>`).join('');
    const riskCls = isAlertRec(r) ? 'alert' : (r.riskClass === 'risk-high' ? 'high' : r.riskClass === 'risk-mod' ? 'mod' : 'low');
    return `<div class="ct-item">
      <div class="ct-main">
        <strong>${escapeHtml(r.contact.name || 'Sem nome')}</strong>
        <span class="ct-phone">${escapeHtml(fmtPhone(r.contact.phone))}${r.municipio ? ' · ' + escapeHtml(r.municipio) : ''}</span>
        <span class="ct-tags"><span class="ct-risk ${riskCls}">${escapeHtml(isAlertRec(r) ? 'Sinal de alerta' : (r.riskLabel || ''))}</span>${tags}</span>
      </div>
      <a class="ct-wa" href="${href}" target="_blank" rel="noopener">WhatsApp</a>
    </div>`;
  }).join('');
  const more = rows.length > shown.length ? `<button class="adm-btn" id="ctMore" type="button" style="margin-top:10px">Mostrar mais (${rows.length - shown.length})</button>` : '';
  return `
    <section class="adm-card">
      <h3>📞 Contatos para retorno</h3>
      <p class="adm-sub">Só aparece quem autorizou o contato. ${fmtInt(total)} contato(s) disponível(is) no período e município escolhidos.</p>
      <div class="adm-filters" style="margin-top:0">
        <label>Risco<select id="ctRisk">${sel(RISK_FILTERS, adminContactFilters.risk)}</select></label>
        <label>Interesse<select id="ctInterest">${sel(INTEREST_FILTERS, adminContactFilters.interest)}</select></label>
        <label>Cruzar<select id="ctMode">${sel([['and', 'Os dois (risco e interesse)'], ['or', 'Um dos dois (risco ou interesse)']], adminContactFilters.mode)}</select></label>
      </div>
      <p class="adm-sub" style="margin:10px 0 0"><strong>${fmtInt(rows.length)}</strong> pessoa(s) na lista.</p>
      ${list || '<p class="adm-sub" style="margin-top:8px">Nenhum contato com estes filtros.</p>'}
      ${more}
    </section>`;
}

// ---------------- Painel visual (rosca, barras, fluxo de atendimento, fluxograma) ----------------
const FASE_KEY = 'mavi_fase_v1';
const FASES = [['nao', 'Não iniciado', 'Não iniciado'], ['triagem', 'Em triagem', 'Em triagem'], ['alerta', 'Alerta / acompanhamento', 'Alerta'], ['final', 'Finalizado / agendado', 'Finalizado']];
let admKbAll = false;
function faseRead() { try { return JSON.parse(localStorage.getItem(FASE_KEY) || '{}') || {}; } catch (e) { return {}; } }
function faseWrite(m) { try { localStorage.setItem(FASE_KEY, JSON.stringify(m)); } catch (e) {} }
function faseOf(r, m) {
  if (m[r.id] && FASES.some(f => f[0] === m[r.id])) return m[r.id];
  if (exRelRead()[r.id]) return 'final';
  return isAlertRec(r) ? 'alerta' : 'triagem';
}
function recLabel(r) {
  const parts = r.contact && r.contact.name ? String(r.contact.name).trim().split(/\s+/).filter(Boolean) : [];
  if (!parts.length) return 'Anônimo ' + String(r.id).slice(0, 4).toUpperCase();
  return parts.length > 1 ? parts[0] + ' ' + parts[parts.length - 1][0].toUpperCase() + '.' : parts[0];
}

function donutHTML(recs) {
  const total = recs.length;
  const defs = [['Alerta', '#D03B3B'], ['Alto', '#E8731A'], ['Moderado', '#E0A100'], ['Baixo', '#2E9E5B']];
  const cnt = [
    recs.filter(r => isAlertRec(r)).length,
    recs.filter(r => !isAlertRec(r) && (r.riskClass === 'risk-high' || r.riskClass === 'risk-vhigh')).length,
    recs.filter(r => !isAlertRec(r) && r.riskClass === 'risk-mod').length,
    recs.filter(r => !isAlertRec(r) && r.riskClass === 'risk-low').length,
  ];
  const R = 54, C = 2 * Math.PI * R;
  let off = 0, segs = '';
  if (total) {
    cnt.forEach((n, i) => {
      if (!n) return;
      const len = n / total * C;
      segs += `<circle cx="70" cy="70" r="${R}" fill="none" stroke="${defs[i][1]}" stroke-width="22" stroke-dasharray="${len.toFixed(2)} ${(C - len).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}"></circle>`;
      off += len;
    });
  }
  const hi = cnt[0] + cnt[1];
  return `<div class="donut"><svg viewBox="0 0 140 140" role="img" aria-label="Nível de risco: ${total ? fmtPct(hi, total) + ' com alerta ou risco alto' : 'sem dados'}">
      <circle cx="70" cy="70" r="${R}" fill="none" stroke="#E6ECF3" stroke-width="22"></circle>
      <g transform="rotate(-90 70 70)">${segs}</g></svg>
      <div class="dc">${total ? fmtPct(hi, total) : '—'}<small>${total ? 'alerta ou risco alto' : 'sem dados'}</small></div></div>
    <div class="lg">${defs.map((d, i) => `<div class="lg-r"><span><i style="background:${d[1]}"></i>${d[0]}</span><b>${cnt[i]}${total ? ' · ' + fmtPct(cnt[i], total) : ''}</b></div>`).join('')}</div>`;
}

function interestBarsHTML(recs) {
  const total = recs.length;
  const ie = recs.filter(r => r.ans.I3n === 0).length;
  const co = recs.filter(r => r.consentContact).length;
  const bars = [['Abertos a outro plano', ie, '#1A5FA8'], ['Autorizaram contato', co, '#2E9E5B']];
  const H = 110;
  return `<div class="vbars">${bars.map(([l, n, c]) => `<div class="vbar"><div class="vv">${total ? fmtPct(n, total) : '—'}</div><div class="vb" style="height:${total ? Math.max(3, Math.round(n / total * H)) : 3}px;background:${c}"></div></div>`).join('')}</div>
    <div class="vlab">${bars.map(b => `<span>${b[0]}</span>`).join('')}</div>`;
}

function visualPanelHTML(recs) {
  return `<div class="vz3">
    <section class="adm-card"><h3>Nível de risco</h3>${donutHTML(recs)}</section>
    <section class="adm-card"><h3>Interesse e contato</h3>${interestBarsHTML(recs)}</section>
    <section class="adm-card wide"><h3>Evolução dos questionários recebidos</h3>
      <p class="adm-sub">Questionários concluídos ${adminCloudMode ? 'em todos os aparelhos que enviaram' : 'neste aparelho'}. Toque no gráfico para ver cada ponto.</p>
      <div id="evoChart"></div></section>
  </div>`;
}

function kanbanHTML(recs) {
  const m = faseRead();
  const cols = FASES.map(f => ({ id: f[0], name: f[1], items: [] }));
  const sorted = recs.slice().sort((a, b) => String(b.createdAt).localeCompare(String(a.createdAt)));
  sorted.forEach(r => { cols.find(c => c.id === faseOf(r, m)).items.push(r); });
  const LIM = 5;
  const opts = cur => FASES.map(f => `<option value="${f[0]}" ${f[0] === cur ? 'selected' : ''}>${f[2]}</option>`).join('');
  const anyMore = cols.some(c => c.items.length > LIM);
  return `<section class="adm-card">
    <h3>Fluxo de atendimento <span style="font-weight:600;color:var(--muted)">· fases da triagem</span></h3>
    <p class="adm-sub">Cada pessoa aparece na fase atual. Alerta vai para acompanhamento e pedido liberado vai para finalizado. Para mudar de fase, use a lista no cartão. A fase fica guardada neste aparelho.</p>
    <div class="kb">${cols.map((c, i) => `<div class="kb-col kb-${i}"><h4><span>${c.name}</span><em>${c.items.length}</em></h4>
      ${c.items.length ? '' : '<div class="kb-empty">Ninguém nesta fase.</div>'}
      ${(admKbAll ? c.items : c.items.slice(0, LIM)).map(r => `<div class="kb-card"><div class="kc-top"><span>${isAlertRec(r) ? '<span class="al" title="Sinal de alerta">⚠</span>' : ''}${escapeHtml(recLabel(r))}</span><span class="sc" title="Pontos de atenção">${r.score}</span></div>
        <select data-fase="${escapeHtml(r.id)}" aria-label="Mudar a fase de ${escapeHtml(recLabel(r))}">${opts(c.id)}</select></div>`).join('')}
      ${!admKbAll && c.items.length > LIM ? `<div class="kb-more">+ ${c.items.length - LIM} pessoa(s)</div>` : ''}
    </div>`).join('')}</div>
    ${anyMore ? `<button class="adm-btn" type="button" data-kb-more style="margin-top:12px;background:#fff;color:var(--navy);border:1.5px solid var(--blue)">${admKbAll ? 'Mostrar menos' : 'Mostrar todas as pessoas'}</button>` : ''}
  </section>`;
}

function flowHTML(recs) {
  const total = recs.length;
  const al = recs.filter(isAlertRec).length;
  const rest = total - al;
  const low = recs.filter(r => !isAlertRec(r) && r.riskClass === 'risk-low').length;
  const up = rest - low;
  return `<section class="adm-card">
    <h3>Classificação da triagem</h3>
    <p class="adm-sub">Caminho de cada questionário, com a contagem real do filtro atual.</p>
    <div class="flow">
      <div class="fl-node fl-n1">Triagem realizada<small>${fmtInt(total)} pessoa${total === 1 ? '' : 's'}</small></div>
      <div class="fl-arrow"></div>
      <div class="fl-node fl-n2">Sinais de alerta?</div>
      <div class="fl-arrow"></div>
      <div class="fl-split">
        <div class="fl-branch"><span class="fl-tag" style="background:#C9302C">Sim · ${fmtInt(al)}</span><div class="fl-arrow"></div>
          <div class="fl-node fl-n3">Encaminhamento médico (alerta)<small>sem oferta de venda</small></div></div>
        <div class="fl-branch"><span class="fl-tag" style="background:#2E9E5B">Não · ${fmtInt(rest)}</span><div class="fl-arrow"></div>
          <div class="fl-node fl-n4">Monitoramento preventivo<small>${fmtInt(low)} risco baixo</small></div>
          <div class="fl-arrow"></div>
          <div class="fl-node fl-n5">Exames e ECG sugeridos<small>${fmtInt(up)} risco moderado ou alto</small></div></div>
      </div>
    </div>
  </section>`;
}

EX_REFS.CP21 = 'Gulati M, et al. 2021 AHA/ACC/ASE/CHEST/SAEM/SCCT/SCMR Guideline for the Evaluation and Diagnosis of Chest Pain. Circulation. 2021;144(22):e368-e454. doi:10.1161/CIR.0000000000001029 (PMID 34709879)';
EX_REFS.TOB21 = 'US Preventive Services Task Force (Krist AH, et al.). Interventions for Tobacco Smoking Cessation in Adults, Including Pregnant Persons: Recommendation Statement. JAMA. 2021;325(3):265-279. doi:10.1001/jama.2020.25019 (PMID 33464343)';
EX_REFS.PA20 = 'Bull FC, et al. World Health Organization 2020 guidelines on physical activity and sedentary behaviour. Br J Sports Med. 2020;54(24):1451-1462. doi:10.1136/bjsports-2020-102955 (PMID 33239350)';
EX_REFS.PHQ03 = 'Kroenke K, Spitzer RL, Williams JBW. The Patient Health Questionnaire-2: validity of a two-item depression screener. Med Care. 2003;41(11):1284-1292. doi:10.1097/01.MLR.0000093487.78664.3C (PMID 14583691)';
EX_REFS.DEP23 = 'US Preventive Services Task Force (Barry MJ, et al.). Screening for Depression and Suicide Risk in Adults: Recommendation Statement. JAMA. 2023;329(23):2057-2067. doi:10.1001/jama.2023.9297 (PMID 37338872)';

function ovData(recs) {
  const cnt = fn => recs.filter(fn).length;
  const sign = id => cnt(r => r.ans && r.ans[id] === 0);
  const exr = exRelRead();
  return {
    N: recs.length,
    signs: [['Dor ou aperto no peito ao esforço', sign('A1')], ['Falta de ar fora do normal', sign('A2')], ['Desmaio ou quase desmaio', sign('A3')], ['Coração acelerado/irregular', sign('A4')]].sort((a, b) => b[1] - a[1]),
    noBmi: cnt(r => r.bmiCat === 'ns' || r.bmiCat === null || r.bmiCat === undefined),
    alerts: cnt(isAlertRec),
    contact: cnt(r => r.consentContact),
    released: cnt(r => exr[r.id]),
  };
}
function dashMetaRows(total) {

  const cityLabel = adminFilters.city === '' ? 'Todos' : adminFilters.city === '__none' ? 'Não informado' : adminFilters.city;
  const ageLabel = adminFilters.age === '' ? 'Todas' : ITEM.P2.opts[+adminFilters.age];
  return [['Período', periodLabel], ['Município', cityLabel], ['Faixa etária', ageLabel], ['Questionários no filtro', String(total)], ['Gerado em', `${dateStr} às ${timeStr}`]];

// Ações recomendadas: cruzam os números do painel com as respostas informadas (cada pessoa do filtro atual)

        'Sintomas ao esforço sem sinais de gravidade: marcar consulta médica com eletrocardiograma de repouso de 12 derivações na primeira avaliação. Dor aos esforços sugere angina e deve ser tratada como assunto médico, não comercial.',

      headline: `Confirmar a pressão arterial de ${hUn.length + hKn.length} pessoas (${hUn.length} com pressão alta descontrolada ou sem controle conhecido, ${hKn.length} que não medem há mais de 1 ano)`,

        'Sem diagnóstico prévio, confirmar a hipertensão com medidas fora do consultório (MRPA ou MAPA) antes de rotular a pessoa, quando possível.',

        'Exames de rotina da avaliação inicial: ECG, creatinina, potássio, ácido úrico, perfil lipídico e glicemia (sugeridos pelo app na tela de resultado).',
        'Orientar sal, peso, atividade física e álcool, e marcar nova medida de controle com data definida pelo médico.'],

      steps: [
        'Coletar glicemia de jejum (jejum de 8 horas) e hemoglobina glicada de quem tem 35 anos ou mais, ou sobrepeso com outro fator de risco; priorizar o grupo do cruzamento acima.',
        'Interpretar: glicemia de jejum de 100 a 125 mg/dL ou HbA1c de 5,7 a 6,4% indicam pré-diabetes; 126 mg/dL ou mais, ou HbA1c de 6,5% ou mais, indicam diabetes, com confirmação em nova amostra se não houver sintomas.',
        'Pré-diabetes: orientar mudança de estilo de vida (alimentação, peso, atividade física) e repetir o exame em intervalo definido pelo médico.',
        'Diabetes confirmado: consulta médica para plano de tratamento, com avaliação de função renal, perfil lipídico e risco cardiovascular.'],
      refs: ['ADA2', 'ADA10'] });
  }

  // 4) Colesterol
  const cUn = recs.filter(r => A(r).D4 === 3), cHi = recs.filter(r => A(r).D4 === 2);
  if (cUn.length + cHi.length) {
    push({ id: 'col', n: cUn.length + cHi.length,
      headline: `Medir ou tratar o colesterol de ${cUn.length + cHi.length} pessoas (${cUn.length} nunca mediram, ${cHi.length} com colesterol alto sem remédio)`,
      data: [
        `${P(cUn.length)} nunca mediram o colesterol ou não sabem; ${P(cHi.length)} têm colesterol alto e não tomam remédio.`,
        `Cruzamento: entre os que nunca mediram, ${C(cUn, f.has)} têm pressão alta, ${C(cUn, f.smoke)} fumam, ${C(cUn, f.fam)} têm infarto ou AVC na família e ${C(cUn, f.dm)} têm diabetes; entre os com colesterol alto sem remédio, ${C(cHi, f.has)} têm pressão alta e ${C(cHi, f.smoke)} fumam.`],
      steps: [
        'Coletar perfil lipídico (colesterol total, HDL, LDL e triglicerídeos), começando por quem acumula fatores de risco no cruzamento acima.',
        'Colesterol alto sem tratamento: consulta médica para estimar o risco cardiovascular total e definir a meta de LDL-c e a necessidade de medicamento; a decisão de tratar é do médico.',
        'Considerar apolipoproteína B e dosar a lipoproteína(a) uma vez na vida, em especial com história familiar de doença cardiovascular precoce (opcionais no app).',
        'Orientar alimentação, atividade física e parada do fumo, e repetir o perfil lipídico no intervalo definido pelo médico.'],
      refs: ['DIS25', 'PREV21', 'DYSL19', 'LPA22'] });

  // 6) Histórico familiar

    headline: `Oferecer check-up do coração a ${fm.length} pessoas com infarto ou AVC na família`,
    data: [
      `${P(fm.length)} têm pai, mãe ou familiar com infarto ou AVC.`,

  // 10) Peso e altura
  const nb = recs.filter(r => r.bmiCat === 'ns' || r.bmiCat === null || r.bmiCat === undefined);

    headline: `Atualizar peso e altura de ${nb.length} pessoas`,

      `${P(nb.length)} estão sem peso ou altura válidos; sem esses dados o sobrepeso e a obesidade não entram na pontuação.`,
      `Cruzamento: entre elas, ${C(nb, f.a50)} têm 50 anos ou mais, ${C(nb, f.has)} têm pressão alta e ${C(nb, f.dm)} têm diabetes, grupos em que o peso mais pesa na decisão clínica.`],

      'Quem passar para sobrepeso ou obesidade recebe orientação de alimentação e atividade física (ações acima).'],

  return out;
}

// ---------- Listas do painel: ocultar zerados, ordenar, selecionar, fixar, mover e arrastar ----------
const DASH_KEY = 'mavi_dash_lists_v1';
const DASH_DEFAULT = () => ({ hideZero: false, sort: 'manual', unchecked: {}, hidden: {}, pinned: {}, order: {} });
let dashPrefs = (() => { try { return Object.assign(DASH_DEFAULT(), JSON.parse(localStorage.getItem(DASH_KEY) || '{}')); } catch (e) { return DASH_DEFAULT(); } })();
function dashSave() { try { localStorage.setItem(DASH_KEY, JSON.stringify(dashPrefs)); } catch (e) {} }
function dkey(ch, it) { return ch.title + '|' + it.label; }
function dashOrdered(ch, includeHidden) {
  let arr = ch.items.map((it, i) => ({ it, i }));
  const so = dashPrefs.sort;
  if (so === 'desc') arr.sort((a, b) => b.it.n - a.it.n || a.i - b.i);
  else if (so === 'asc') arr.sort((a, b) => a.it.n - b.it.n || a.i - b.i);
  else if (so === 'az') arr.sort((a, b) => a.it.label.localeCompare(b.it.label, 'pt-BR') || a.i - b.i);
  else {
    const ord = dashPrefs.order[ch.title];
    if (ord) { const pos = l => { const k = ord.indexOf(l); return k < 0 ? 1e6 : k; }; arr.sort((a, b) => pos(a.it.label) - pos(b.it.label) || a.i - b.i); }
  }
  arr.sort((a, b) => (dashPrefs.pinned[dkey(ch, b.it)] ? 1 : 0) - (dashPrefs.pinned[dkey(ch, a.it)] ? 1 : 0));
  let out = arr.map(x => x.it);
  if (!includeHidden) out = out.filter(it => !dashPrefs.hidden[dkey(ch, it)] && !(dashPrefs.hideZero && it.n === 0));
  return out;
}
// Para o PDF: só o que está visível e marcado
function dashPdfChart(ch) {
  if (!ch.base) return ch;
  const items = dashOrdered(ch).filter(it => !dashPrefs.unchecked[dkey(ch, it)]);
  return items.length ? Object.assign({}, ch, { items }) : null;
}
function dashListHTML(ch) {
  if (!ch.base) return `<div class="adm-empty">Sem dados para os filtros atuais.</div>`;
  const shown = dashOrdered(ch);
  const hiddenN = ch.items.filter(it => dashPrefs.hidden[dkey(ch, it)]).length;
  const rows = shown.map(it => {
    const key = dkey(ch, it), w = Math.min(100, it.n / ch.base * 100), zero = it.n === 0;
    const color = it.color || it.css || 'linear-gradient(#34589F,#27478A)';
    const attrs = `data-ch="${escapeHtml(ch.title)}" data-label="${escapeHtml(it.label)}"`;
    return `<div class="dl-row${zero ? ' dl-zero' : ''}" ${attrs}>
      <span class="dl-handle" title="Arraste para reordenar" aria-label="Arrastar para reordenar">⠿</span>
      <input type="checkbox" class="dl-chk" ${attrs} ${dashPrefs.unchecked[key] ? '' : 'checked'} aria-label="Incluir ${escapeHtml(it.label)} no gráfico e no relatório">
      <div class="dl-main" title="${escapeHtml(it.label)}: ${it.n} (${fmtPct(it.n, ch.base)})">
        <div class="hb-label"><span class="hb-key">${ch.dots ? `<span class="hb-dot" style="background:${color}"></span>` : ''}${escapeHtml(it.label)}</span></div>
        <div class="dl-track"><div class="dl-fill" style="width:${w}%;${zero ? '' : 'min-width:4px;'}background:${zero ? 'transparent' : color}"></div><span class="dl-val${w >= 72 ? ' in' : ''}" style="${w >= 72 ? '' : 'left:calc(' + w + '% + 10px)'}">${fmtInt(it.n)} de ${fmtInt(ch.base)} (${fmtPct(it.n, ch.base)})</span></div>
      </div>
      <div class="dl-act">
        <button type="button" class="${dashPrefs.pinned[key] ? 'on' : ''}" data-dl="pin" ${attrs} title="Fixar no topo" aria-label="Fixar no topo">📌</button>
        <button type="button" data-dl="up" ${attrs} title="Subir" aria-label="Subir">▲</button>
        <button type="button" data-dl="down" ${attrs} title="Descer" aria-label="Descer">▼</button>
        <button type="button" data-dl="hide" ${attrs} title="Ocultar" aria-label="Ocultar">✕</button>
      </div>
    </div>`;
  }).join('');
  const empty = shown.length ? '' : `<div class="adm-empty">Todos os itens estão ocultos ou zerados.</div>`;
  const hid = hiddenN ? `<div class="dl-hid">${hiddenN} item(ns) oculto(s) · <button type="button" data-dl="unhide" data-ch="${escapeHtml(ch.title)}">mostrar</button></div>` : '';
  const table = `<details class="adm-tbl"><summary>Ver dados em tabela</summary>
    <table class="adm-table"><thead><tr><th>Categoria</th><th class="num">Qtde</th><th class="num">%</th></tr></thead>
    <tbody>${shown.map(it => `<tr><td>${escapeHtml(it.label)}</td><td class="num">${fmtInt(it.n)}</td><td class="num">${fmtPct(it.n, ch.base)}</td></tr>`).join('')}</tbody>
    <tfoot><tr><td>Base</td><td class="num">${fmtInt(ch.base)}</td><td></td></tr></tfoot></table></details>`;
  return `<div class="dl-list" data-ch="${escapeHtml(ch.title)}">${rows}</div>${empty}${hid}${table}`;
}
function dashToolbarHTML() {
  const o = (v, l) => `<option value="${v}" ${dashPrefs.sort === v ? 'selected' : ''}>${l}</option>`;
  return `<section class="adm-card dl-toolbar"><h3>Listas dos gráficos</h3>
    <div class="dl-ctl">
      <label><input type="checkbox" class="dl-switch" id="dlHideZero" ${dashPrefs.hideZero ? 'checked' : ''}> Ocultar zerados (0%)</label>
      <label>Ordenação <select id="dlSort">${o('manual', 'Ordem manual')}${o('desc', 'Maior porcentagem')}${o('asc', 'Menor porcentagem')}${o('az', 'Ordem alfabética (A-Z)')}</select></label>
      <button class="adm-btn" id="dlReset" type="button" style="margin:0">Restaurar listas</button>
    </div>
    <p class="adm-sub" style="margin:8px 0 0">Marque o que entra nos gráficos e no relatório em PDF. Arraste o ⠿ para reordenar, ou use fixar (📌), subir (▲), descer (▼) e ocultar (✕).</p>
  </section>`;
}
function bindDashLists(model, rerender) {
  const chartOf = t => model.charts.find(c => c.title === t);
  const hz = document.getElementById('dlHideZero');
  if (hz) hz.addEventListener('change', () => { dashPrefs.hideZero = hz.checked; dashSave(); rerender(); });
  const so = document.getElementById('dlSort');
  if (so) so.addEventListener('change', () => { dashPrefs.sort = so.value; dashSave(); rerender(); });
  const rs = document.getElementById('dlReset');
  if (rs) rs.addEventListener('click', () => { dashPrefs = DASH_DEFAULT(); dashSave(); rerender(); });
  const saveOrder = (ch, labels) => {
    const rest = ch.items.map(i => i.label).filter(l => !labels.includes(l));
    dashPrefs.order[ch.title] = labels.concat(rest); dashPrefs.sort = 'manual'; dashSave();
  };
  adminArea.querySelectorAll('.dl-chk').forEach(c => c.addEventListener('change', () => {
    const ch = chartOf(c.dataset.ch); if (!ch) return;
    const k = ch.title + '|' + c.dataset.label;
    if (c.checked) delete dashPrefs.unchecked[k]; else dashPrefs.unchecked[k] = true;
    dashSave();
  }));
  adminArea.querySelectorAll('[data-dl]').forEach(b => b.addEventListener('click', () => {
    const ch = chartOf(b.dataset.ch); if (!ch) return;
    const act = b.dataset.dl, label = b.dataset.label, k = ch.title + '|' + label;
    if (act === 'pin') { if (dashPrefs.pinned[k]) delete dashPrefs.pinned[k]; else dashPrefs.pinned[k] = true; }
    else if (act === 'hide') dashPrefs.hidden[k] = true;
    else if (act === 'unhide') ch.items.forEach(it => delete dashPrefs.hidden[ch.title + '|' + it.label]);
    else {
      const labels = dashOrdered(ch).map(i => i.label), i = labels.indexOf(label), j = act === 'up' ? i - 1 : i + 1;
      if (i < 0 || j < 0 || j >= labels.length) return;
      [labels[i], labels[j]] = [labels[j], labels[i]];
      saveOrder(ch, labels);
    }
    dashSave(); rerender();
  }));
  // arrastar e soltar (mouse e toque)
  adminArea.querySelectorAll('.dl-list').forEach(list => {
    let dragRow = null;
    list.addEventListener('pointerdown', e => {
      const h = e.target.closest('.dl-handle'); if (!h) return;
      dragRow = h.closest('.dl-row'); dragRow.classList.add('dragging');
      try { h.setPointerCapture(e.pointerId); } catch (err) {}
      e.preventDefault();
    });
    list.addEventListener('pointermove', e => {
      if (!dragRow) return;
      const others = Array.from(list.children).filter(r => r !== dragRow && r.classList.contains('dl-row'));
      let placed = false;
      for (const r of others) {
        const rc = r.getBoundingClientRect();
        if (e.clientY < rc.top + rc.height / 2) { if (dragRow.nextSibling !== r) list.insertBefore(dragRow, r); placed = true; break; }
      }
      if (!placed && others.length) { const last = others[others.length - 1]; if (last.nextSibling !== dragRow) last.after(dragRow); }
    });
    const end = () => {
      if (!dragRow) return;
      const ch = chartOf(list.dataset.ch);
      dragRow.classList.remove('dragging'); dragRow = null;
      if (!ch) return;
      saveOrder(ch, Array.from(list.querySelectorAll('.dl-row')).map(r => r.dataset.label));
      rerender();
    };
    list.addEventListener('pointerup', end);
    list.addEventListener('pointercancel', end);
  });
}

    if (!admExamLast) return;

      const blob = new Blob([admExamLast.bytes], { type: 'application/pdf' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = admExamLast.name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 60000);
      admExamMsg = 'Download iniciado.';
    } catch (e) { admExamMsg = 'Não foi possível baixar o PDF.'; }
    rerender();
  }));
  adminArea.querySelectorAll('[data-adm-pdf]').forEach(b => b.addEventListener('click', async () => {
    const id = b.getAttribute('data-adm-pdf');
    try {
      const bytes = await adminGetPdf(id);
      await deliverPdf(bytes, `MAVI_Triagem_${id.slice(0, 8)}.pdf`);
      admPdfMsg = 'PDF pronto.';
    } catch (e) { admPdfMsg = (e && e.code === 'declined') ? 'Cancelado.' : 'Não foi possível abrir o PDF.'; }
    rerender();
  }));
  document.getElementById('admPdfFiles').addEventListener('change', e => {
    const files = Array.from(e.target.files || []);
    if (!files.length) return;
    admImportMsg = 'Lendo ' + files.length + ' arquivo(s)…';
    importPdfFiles(files);
  });
  renderEvolution(document.getElementById('evoChart'), recs);
  [['fPeriod', 'period'], ['fCity', 'city'], ['fAge', 'age']].forEach(([id, key]) => {
    document.getElementById(id).addEventListener('change', e => {
      adminFilters[key] = e.target.value;
      const y = adminArea.scrollTop;
      renderDashboard();
      adminArea.scrollTop = y;
    });
  });
  document.getElementById('admWipeShow').addEventListener('click', () => document.getElementById('admWipeZone').classList.add('show'));
  document.getElementById('admWipeGo').addEventListener('click', async () => {
    if (document.getElementById('admWipeTxt').value.trim().toUpperCase() !== 'APAGAR') return;
    const cloud = await getCloud();
    if (cloud) await cloudWipe(cloud); else { await idb('records', 'readwrite', s => s.clear()); await idb('imported', 'readwrite', s => s.clear()); }
    adminRecords = []; adminQ2 = []; adminUnreadable = 0; adminPdfs = [];
    renderDashboard();
  });
  bumpAdminIdle();
}

let admResizeT;
window.addEventListener('resize', () => {
  clearTimeout(admResizeT);
  admResizeT = setTimeout(() => {
    const c = document.getElementById('evoChart');
    if (c && adminPrivKey) renderEvolution(c, adminFiltered());
  }, 150);
});
document.addEventListener('visibilitychange', () => {
  // Ao sair do app com o painel aberto, bloqueia imediatamente.
  if (document.hidden && adminPrivKey) { lockAdmin(); if (adminArea.classList.contains('open')) renderLogin('Sessão bloqueada ao sair do app. Entre novamente.'); }
});
document.getElementById('adminBtn').addEventListener('click', openAdmin);


// ---------------- PWA: service worker ----------------
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(err => {

function updateOfflineBadge() {
  document.getElementById('offlineBadge').style.display = navigator.onLine ? 'none' : 'inline-block';
}
